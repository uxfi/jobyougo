<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Food Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/fonts.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #efe8c8;
  --screen-top: #20140d;
  --screen-mid: #62401c;
  --screen-bottom: #b97a2f;
  --card: #ffffff;
  --card-soft: #f4f4f1;
  --card-warm: #f6f0d3;
  --text: #141414;
  --muted: rgba(20,20,20,.58);
  --line: rgba(20,20,20,.08);
  --orange: #f27845;
  --orange-soft: #f7d1c2;
  --blue: #539ae9;
  --blue-soft: #d2e6ff;
  --green: #79a84c;
  --green-soft: #d9ebc6;
}

html, body {
  width: 100%;
  height: 100%;
  font-family: var(--font-caros, 'Inter', sans-serif);
  background:
    radial-gradient(circle at top, rgba(255,255,255,.42), rgba(255,255,255,0) 45%),
    linear-gradient(180deg, #efecd5 0%, var(--bg) 100%);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

body {
  display: flex;
  align-items: stretch;
  justify-content: center;
}

.screen {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  background:
    radial-gradient(circle at 74% 16%, rgba(255,186,84,.3), transparent 22%),
    linear-gradient(180deg, #1a100b 0%, #4b2b12 28%, #7e4a18 55%, #9b6328 68%, #d9ba92 72%, #efe8c8 72.5%, #efe8c8 100%);
}

.hero {
  position: relative;
  min-height: 50vh;
  padding: 16px 20px 0;
  overflow: hidden;
  isolation: isolate;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 50% 24%, rgba(255,172,67,.42), transparent 22%),
    radial-gradient(circle at 78% 18%, rgba(255,212,160,.12), transparent 18%),
    linear-gradient(180deg, rgba(10,6,4,.78) 0%, rgba(36,19,8,.24) 54%, rgba(36,19,8,0) 100%);
  z-index: -3;
}

.hero::after {
  content: "";
  position: absolute;
  inset: auto 0 -28px;
  height: 148px;
  background:
    linear-gradient(180deg, rgba(255,236,214,0) 0%, rgba(255,225,176,.74) 58%, rgba(255,248,235,.9) 100%);
  filter: blur(5px);
  z-index: -2;
}

.sparkles,
.sparkles::before,
.sparkles::after {
  position: absolute;
  inset: 0;
  content: "";
  pointer-events: none;
}

.sparkles {
  z-index: -1;
  background:
    radial-gradient(circle at 14% 30%, rgba(255,205,111,.95) 0 3px, transparent 4px),
    radial-gradient(circle at 23% 22%, rgba(255,186,71,.75) 0 5px, transparent 6px),
    radial-gradient(circle at 68% 18%, rgba(255,198,103,.85) 0 4px, transparent 5px),
    radial-gradient(circle at 80% 28%, rgba(255,233,177,.65) 0 3px, transparent 4px),
    radial-gradient(circle at 17% 54%, rgba(255,215,133,.6) 0 2px, transparent 3px),
    radial-gradient(circle at 86% 48%, rgba(255,193,91,.5) 0 2px, transparent 3px);
  opacity: .9;
}

.sparkles::before {
  background:
    radial-gradient(circle at 18% 16%, rgba(255,255,255,.28) 0 2px, transparent 3px),
    radial-gradient(circle at 28% 8%, rgba(255,242,210,.44) 0 2px, transparent 3px),
    radial-gradient(circle at 36% 12%, rgba(255,242,210,.36) 0 2px, transparent 3px),
    radial-gradient(circle at 57% 10%, rgba(255,242,210,.32) 0 2px, transparent 3px),
    radial-gradient(circle at 63% 22%, rgba(255,242,210,.28) 0 2px, transparent 3px),
    radial-gradient(circle at 72% 12%, rgba(255,242,210,.22) 0 2px, transparent 3px);
}

.sparkles::after {
  inset: 110px 18px auto;
  height: 220px;
  background:
    radial-gradient(circle at 28% 34%, rgba(255,186,71,.32) 0 9px, transparent 11px),
    radial-gradient(circle at 70% 18%, rgba(255,216,141,.28) 0 8px, transparent 10px),
    radial-gradient(circle at 17% 72%, rgba(255,216,141,.2) 0 7px, transparent 9px),
    radial-gradient(circle at 84% 62%, rgba(255,186,71,.22) 0 6px, transparent 8px);
  filter: blur(.4px);
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 3;
}

.status-time {
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -.02em;
}

.status-icons {
  display: flex;
  align-items: center;
  gap: 7px;
}

.nav {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 18px;
  z-index: 3;
}

.nav-title {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,.95);
  font-family: var(--font-bricolage, 'Inter', sans-serif);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -.03em;
}

.nav-btn {
  width: 46px;
  height: 46px;
  border: none;
  border-radius: 16px;
  background: rgba(255,255,255,.97);
  color: #1b1713;
  display: grid;
  place-items: center;
  box-shadow: 0 10px 24px rgba(0,0,0,.14);
}

.hero-stage {
  position: relative;
  min-height: 430px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-top: 18px;
}

.splash {
  position: absolute;
  left: 50%;
  top: 68px;
  width: 268px;
  height: 268px;
  transform: translateX(-50%);
  border-radius: 50%;
  background:
    radial-gradient(circle at 50% 52%, rgba(255,178,51,.96) 0 34%, rgba(255,129,27,.88) 35% 47%, transparent 48%),
    radial-gradient(circle at 28% 36%, rgba(255,237,195,.9) 0 8px, transparent 9px),
    radial-gradient(circle at 68% 28%, rgba(255,237,195,.84) 0 7px, transparent 8px),
    radial-gradient(circle at 78% 48%, rgba(255,237,195,.84) 0 5px, transparent 6px),
    radial-gradient(circle at 18% 60%, rgba(255,237,195,.7) 0 6px, transparent 7px);
  filter: blur(1.6px) drop-shadow(0 18px 36px rgba(255,122,32,.28));
  opacity: .88;
}

.splash::before,
.splash::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
}

.splash::before {
  background:
    radial-gradient(circle at 18% 25%, rgba(255,236,208,.95) 0 4px, transparent 5px),
    radial-gradient(circle at 10% 46%, rgba(255,221,168,.88) 0 5px, transparent 6px),
    radial-gradient(circle at 86% 23%, rgba(255,221,168,.88) 0 4px, transparent 5px),
    radial-gradient(circle at 92% 52%, rgba(255,221,168,.88) 0 5px, transparent 6px),
    radial-gradient(circle at 84% 74%, rgba(255,236,208,.95) 0 4px, transparent 5px),
    radial-gradient(circle at 16% 82%, rgba(255,236,208,.8) 0 4px, transparent 5px),
    radial-gradient(circle at 56% 6%, rgba(255,236,208,.85) 0 4px, transparent 5px);
}

.splash::after {
  transform: rotate(14deg);
  background:
    radial-gradient(circle at 50% 6%, rgba(255,197,102,.96) 0 16px, transparent 18px),
    radial-gradient(circle at 23% 16%, rgba(255,197,102,.88) 0 18px, transparent 20px),
    radial-gradient(circle at 77% 16%, rgba(255,197,102,.88) 0 18px, transparent 20px),
    radial-gradient(circle at 10% 44%, rgba(255,197,102,.84) 0 16px, transparent 18px),
    radial-gradient(circle at 92% 41%, rgba(255,197,102,.84) 0 16px, transparent 18px),
    radial-gradient(circle at 24% 90%, rgba(255,197,102,.74) 0 12px, transparent 14px),
    radial-gradient(circle at 74% 90%, rgba(255,197,102,.74) 0 12px, transparent 14px);
}

.floor-glow {
  position: absolute;
  left: 50%;
  bottom: 8px;
  width: min(92vw, 390px);
  height: 78px;
  transform: translateX(-50%);
  border-radius: 50%;
  background:
    radial-gradient(ellipse at center, rgba(255,249,240,.62) 0%, rgba(255,215,141,.4) 38%, rgba(255,207,112,.16) 56%, transparent 72%);
  filter: blur(10px);
}

.food-shot {
  position: relative;
  width: min(100vw, 480px);
  filter: drop-shadow(0 38px 30px rgba(0,0,0,.28));
  transform: translateY(-14px) rotate(-4deg);
  z-index: 2;
}

.food-shot img {
  width: 100%;
  display: block;
}

.food-meta {
  position: absolute;
  left: 20px;
  right: 20px;
  bottom: 18px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  z-index: 3;
}

.food-name {
  color: #fff;
  font-family: var(--font-bricolage, 'Inter', sans-serif);
  font-size: clamp(22px, 5.7vw, 29px);
  font-weight: 600;
  letter-spacing: -.04em;
  text-shadow: 0 8px 26px rgba(0,0,0,.24);
  max-width: 220px;
  line-height: .98;
}

.kcal-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  padding: 9px 13px;
  border-radius: 999px;
  background: rgba(255,255,255,.16);
  border: 1px solid rgba(255,255,255,.32);
  backdrop-filter: blur(10px);
  color: rgba(255,255,255,.92);
  font-size: 14px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14);
}

.sheet {
  position: relative;
  margin-top: -10px;
  background: var(--card);
  border-radius: 34px 34px 0 0;
  padding: 26px 20px calc(24px + env(safe-area-inset-bottom));
  box-shadow: 0 -20px 36px rgba(82,42,11,.12);
}

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
}

.section-title {
  font-family: var(--font-bricolage, 'Inter', sans-serif);
  font-size: clamp(24px, 5.3vw, 30px);
  font-weight: 600;
  letter-spacing: -.05em;
}

.section-note {
  color: var(--muted);
  font-size: 14px;
  white-space: nowrap;
}

.macro-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-top: 22px;
}

.macro-card {
  background: var(--card-soft);
  border-radius: 22px;
  padding: 16px 14px 14px;
}

.macro-title {
  font-family: var(--font-bricolage, 'Inter', sans-serif);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -.04em;
}

.mini-meter {
  position: relative;
  height: 10px;
  border-radius: 999px;
  margin: 12px 0 14px;
  overflow: hidden;
}

.mini-meter::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--fill, 50%);
  border-radius: inherit;
  background: var(--track-fill);
}

.mini-meter::after {
  content: "";
  position: absolute;
  top: 50%;
  left: calc(var(--fill, 50%) - 10px);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  transform: translateY(-50%);
  border: 3px solid rgba(255,255,255,.7);
  background: var(--accent);
  box-shadow: 0 6px 14px rgba(0,0,0,.08);
}

.mini-meter span {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  opacity: .95;
  background:
    linear-gradient(90deg, transparent 0 8%, rgba(255,255,255,.78) 8% 11%, transparent 11% 18%, rgba(255,255,255,.78) 18% 21%, transparent 21% 28%, rgba(255,255,255,.78) 28% 31%, transparent 31% 100%),
    var(--track-bg);
}

.macro-value {
  color: rgba(20,20,20,.8);
  font-size: 14px;
}

.score-block {
  margin-top: 28px;
}

.score-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.score-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-bricolage, 'Inter', sans-serif);
  font-size: clamp(24px, 5vw, 28px);
  font-weight: 600;
  letter-spacing: -.05em;
}

.score-title svg {
  color: rgba(20,20,20,.82);
  flex-shrink: 0;
}

.score-value {
  font-size: 17px;
  color: rgba(20,20,20,.92);
}

.score-value strong {
  font-family: var(--font-bricolage, 'Inter', sans-serif);
  font-size: 23px;
  font-weight: 700;
  letter-spacing: -.05em;
}

.score-bar {
  position: relative;
  height: 24px;
  margin-top: 18px;
  border-radius: 999px;
  background: var(--orange-soft);
  overflow: hidden;
}

.score-fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  border-radius: inherit;
  background:
    linear-gradient(90deg, rgba(255,255,255,.88) 0 4%, transparent 4% 8%, rgba(255,255,255,.88) 8% 12%, transparent 12% 16%, rgba(255,255,255,.88) 16% 20%, transparent 20% 24%, rgba(255,255,255,.88) 24% 28%, transparent 28% 32%, rgba(255,255,255,.88) 32% 36%, transparent 36% 40%, rgba(255,255,255,.88) 40% 44%, transparent 44% 48%, rgba(255,255,255,.88) 48% 52%, transparent 52% 100%),
    linear-gradient(90deg, #ef6536 0%, var(--orange) 100%);
  transition: width 900ms cubic-bezier(.2,.8,.2,1);
}

.score-dot {
  position: absolute;
  top: 50%;
  left: calc(66% - 16px);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  transform: translateY(-50%) scale(.7);
  border: 4px solid rgba(255,255,255,.82);
  background: var(--orange);
  box-shadow: 0 14px 22px rgba(242,120,69,.24);
  transition: transform 500ms ease 200ms;
}

.tip-card {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 16px;
  align-items: center;
  margin-top: 28px;
  padding: 13px;
  background: var(--card-warm);
  border-radius: 24px;
}

.tip-icon {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 22px;
  display: grid;
  place-items: center;
  background: rgba(255,255,255,.62);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
}

.tip-title {
  font-family: var(--font-bricolage, 'Inter', sans-serif);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -.04em;
}

.tip-copy {
  margin-top: 6px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.4;
}

.actions {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.48fr);
  gap: 12px;
  margin-top: 16px;
}

.btn {
  min-height: 60px;
  border-radius: 22px;
  border: 1px solid var(--line);
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}

.btn:active { transform: scale(.985); }

.btn-secondary {
  background: #fff;
  color: #191919;
  box-shadow: 0 12px 22px rgba(0,0,0,.04);
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: rgba(255,255,255,.94);
  border-color: rgba(0,0,0,.08);
  background:
    radial-gradient(circle at 22% 16%, rgba(255,255,255,.14), transparent 22%),
    linear-gradient(180deg, #3c3b37 0%, #1d1c1a 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 16px 28px rgba(0,0,0,.15);
}

.btn-primary.active {
  border-color: rgba(242,120,69,.4);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 16px 28px rgba(0,0,0,.15), 0 0 0 4px rgba(242,120,69,.12);
}

.status-icons svg,
.nav-btn svg,
.tip-icon svg,
.btn-primary svg,
.btn-secondary svg {
  display: block;
  stroke-linecap: round;
  stroke-linejoin: round;
}

@media (max-width: 390px) {
  .hero { padding-left: 16px; padding-right: 16px; }
  .sheet { padding-left: 16px; padding-right: 16px; }
  .macro-grid { gap: 10px; }
  .macro-card { padding: 14px 12px 13px; }
}

@media (max-height: 760px) {
  .hero { min-height: 46vh; }
  .hero-stage { min-height: 324px; }
  .food-shot { width: min(64vw, 250px); }
  .sheet { padding-top: 22px; }
  .macro-grid { margin-top: 18px; }
  .score-block { margin-top: 24px; }
  .tip-card { margin-top: 22px; }
  .actions { margin-top: 14px; }
}

@media (max-width: 320px) {
  .hero {
    padding: 14px 16px 0;
  }

  .nav {
    margin-top: 14px;
  }

  .nav-btn {
    width: 42px;
    height: 42px;
    border-radius: 15px;
  }

  .nav-title {
    font-size: 17px;
  }

  .hero-stage {
    min-height: 330px;
  }

  .splash {
    width: 236px;
    height: 236px;
    top: 78px;
  }

  .food-shot {
    width: min(60vw, 214px);
  }

  .food-name {
    font-size: 20px;
    max-width: 190px;
  }

  .kcal-pill {
    margin-top: 10px;
    padding: 8px 12px;
    font-size: 13px;
  }

  .sheet {
    padding: 22px 16px calc(20px + env(safe-area-inset-bottom));
  }

  .section-title,
  .score-title {
    font-size: 20px;
  }

  .section-note,
  .score-value {
    font-size: 13px;
  }

  .macro-grid {
    gap: 10px;
  }

  .macro-card {
    padding: 13px 11px 12px;
    border-radius: 18px;
  }

  .macro-title {
    font-size: 15px;
  }

  .macro-value {
    font-size: 12px;
  }

  .score-bar {
    height: 20px;
  }

  .score-dot {
    width: 28px;
    height: 28px;
    left: calc(66% - 14px);
  }

  .tip-card {
    grid-template-columns: 64px 1fr;
    gap: 12px;
    border-radius: 20px;
  }

  .tip-icon {
    border-radius: 18px;
  }

  .tip-title {
    font-size: 15px;
  }

  .tip-copy {
    font-size: 12px;
  }

  .actions {
    gap: 10px;
    margin-top: 12px;
  }

  .btn {
    min-height: 54px;
    border-radius: 18px;
    font-size: 13px;
  }
}
</style>
</head>
<body>
<div class="screen">
  <section class="hero">
    <div class="sparkles"></div>

    <div class="topbar">
      <span class="status-time">9:30</span>
      <div class="status-icons" aria-hidden="true">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
          <rect x="0" y="5" width="3" height="7" rx="1" fill="#fff" opacity=".3"/>
          <rect x="4.5" y="3" width="3" height="9" rx="1" fill="#fff" opacity=".55"/>
          <rect x="9" y="1" width="3" height="11" rx="1" fill="#fff" opacity=".8"/>
          <rect x="13.5" y="0" width="3" height="12" rx="1" fill="#fff"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
          <path d="M8 9.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3z" fill="#fff"/>
          <path d="M3 6c1.3-1.3 3.1-2 5-2s3.7.7 5 2" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".75"/>
          <path d="M0.5 3.5C2.5 1.3 5.1 0 8 0s5.5 1.3 7.5 3.5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".38"/>
        </svg>
        <svg width="26" height="13" viewBox="0 0 26 13" fill="none">
          <rect x=".5" y=".5" width="22" height="12" rx="3.5" stroke="#fff" stroke-opacity=".45"/>
          <rect x="2" y="2" width="16" height="9" rx="2" fill="#fff"/>
          <path d="M24 4.5v4c1-.5 1.5-1.1 1.5-2s-.5-1.5-1.5-2z" fill="#fff" opacity=".42"/>
        </svg>
      </div>
    </div>

    <div class="nav">
      <button class="nav-btn" type="button" aria-label="Back">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
          <path d="M14.5 6L8.5 12L14.5 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="nav-title">Food Details</div>
      <button class="nav-btn" type="button" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="hero-stage">
      <div class="splash"></div>
      <div class="floor-glow"></div>
      <div class="food-shot">
        <img src="../assets/burger-cutout.png" alt="BlackLabel Burger">
      </div>

      <div class="food-meta">
        <h1 class="food-name">BlackLabel Burger</h1>
        <div class="kcal-pill">
          <svg width="14" height="16" viewBox="0 0 14 16" fill="none" aria-hidden="true">
            <path d="M8.55 1.2c.28 1.77-.4 2.9-1.44 4.03-.91 1-1.9 2-1.9 3.68 0 1.66 1.1 2.7 2.49 2.7 1.94 0 3.27-1.46 3.27-3.53 0-1.66-1-2.95-2.42-4.23-.57-.52-1.02-1.27 0-2.65z" fill="#ff7d32"/>
            <path d="M4.01 6.64c-1.68 1.06-2.9 2.52-2.9 4.65C1.11 14.04 3.4 16 6.42 16c3.26 0 5.87-2.2 5.87-5.48 0-1.35-.5-2.46-1.35-3.56.13 2.88-1.45 4.8-3.88 4.8-1.88 0-3.1-1.4-3.05-3.12z" fill="#f45b20"/>
          </svg>
          <span>650 Kcal</span>
        </div>
      </div>
    </div>
  </section>

  <section class="sheet">
    <div class="section-head">
      <h2 class="section-title">Nutrition Summary</h2>
      <span class="section-note">Per serving</span>
    </div>

    <div class="macro-grid">
      <article class="macro-card">
        <div class="macro-title">Carbs</div>
        <div class="mini-meter" style="--fill:50.4%;--accent:var(--orange);--track-fill:linear-gradient(90deg,#f26d3c 0%, #f6a37f 100%);--track-bg:linear-gradient(90deg,#f8a884 0%, #f4d0c1 100%);">
          <span></span>
        </div>
        <div class="macro-value">60.5/120g</div>
      </article>

      <article class="macro-card">
        <div class="macro-title">Fat</div>
        <div class="mini-meter" style="--fill:13%;--accent:var(--blue);--track-fill:linear-gradient(90deg,#4d97eb 0%, #8bc0ff 100%);--track-bg:linear-gradient(90deg,#98c8ff 0%, #d9ecff 100%);">
          <span></span>
        </div>
        <div class="macro-value">7.8/60g</div>
      </article>

      <article class="macro-card">
        <div class="macro-title">Protein</div>
        <div class="mini-meter" style="--fill:8.4%;--accent:var(--green);--track-fill:linear-gradient(90deg,#7ea746 0%, #b8d88a 100%);--track-bg:linear-gradient(90deg,#b2d27c 0%, #dff0c6 100%);">
          <span></span>
        </div>
        <div class="macro-value">5/60g</div>
      </article>
    </div>

    <div class="score-block">
      <div class="score-head">
        <div class="score-title">
          <span>Nutrition Summary</span>
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="10" r="8.2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M10 8.25V13.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="10" cy="5.85" r="1.1" fill="currentColor"/>
          </svg>
        </div>
        <div class="score-value"><strong>8.2</strong>/10</div>
      </div>

      <div class="score-bar" aria-hidden="true">
        <div class="score-fill" id="scoreFill"></div>
        <div class="score-dot" id="scoreDot"></div>
      </div>
    </div>

    <div class="tip-card">
      <div class="tip-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12.3 4.1l1.28 2.92 2.92 1.28-2.92 1.29-1.28 2.91-1.29-2.91-2.91-1.29 2.91-1.28 1.29-2.92z" stroke="#111" stroke-width="1.7"/>
          <path d="M17.65 13.7l.73 1.66 1.66.73-1.66.73-.73 1.66-.73-1.66-1.66-.73 1.66-.73.73-1.66z" fill="#111"/>
        </svg>
      </div>
      <div>
        <div class="tip-title">Great meal choice!</div>
        <p class="tip-copy">Try adding a side salad for more fiber.</p>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-secondary" id="logBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M8 4.8v2.4M16 4.8v2.4M6.2 8.1h11.6M7.4 19.2h9.2a1.6 1.6 0 001.6-1.6V8.2a1.6 1.6 0 00-1.6-1.6H7.4a1.6 1.6 0 00-1.6 1.6v9.4a1.6 1.6 0 001.6 1.6z" stroke="currentColor" stroke-width="1.85"/>
          <path d="M12 11.1v4.8M9.6 13.5h4.8" stroke="currentColor" stroke-width="1.85"/>
        </svg>
        <span>Log it</span>
      </button>
      <button class="btn btn-primary" id="favBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 20.35l-1.24-1.12C6 14.95 3 12.27 3 8.88A4.88 4.88 0 017.95 4c1.53 0 3 .71 4.05 1.86A5.27 5.27 0 0116.05 4 4.88 4.88 0 0121 8.88c0 3.39-3 6.07-7.76 10.35L12 20.35z" stroke="currentColor" stroke-width="1.85"/>
        </svg>
        <span>Save</span>
      </button>
    </div>
  </section>
</div>

<script>
const logBtn = document.getElementById('logBtn');
const favBtn = document.getElementById('favBtn');
const scoreFill = document.getElementById('scoreFill');
const scoreDot = document.getElementById('scoreDot');
const logLabel = logBtn.querySelector('span');

requestAnimationFrame(() => {
  scoreFill.style.width = '66%';
  scoreDot.style.transform = 'translateY(-50%) scale(1)';
});

let logged = false;
logBtn.addEventListener('click', () => {
  logged = !logged;
  logLabel.textContent = logged ? 'Logged ✓' : 'Log it';
  logBtn.style.borderColor = logged ? 'rgba(242,120,69,.28)' : 'rgba(20,20,20,.08)';
  logBtn.style.boxShadow = logged ? '0 14px 24px rgba(242,120,69,.12)' : '0 12px 22px rgba(0,0,0,.04)';
});

let faved = false;
favBtn.addEventListener('click', () => {
  faved = !faved;
  favBtn.classList.toggle('active', faved);
  favBtn.querySelector('span').textContent = faved ? 'Saved ✓' : 'Save';
});
</script>
</body>
</html>
