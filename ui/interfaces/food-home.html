<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NutriTrack Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/fonts.css">
<script>document.documentElement.classList.add('js');</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f2ebcf;
  --card: rgba(255,255,255,.95);
  --ink: #141414;
  --muted: rgba(20,20,20,.66);
  --soft: rgba(255,255,255,.72);
  --orange: #f47a4b;
  --orange-text: #d44f1d;
  --blue: #539ae9;
  --green: #d6ef73;
  --green-deep: #b6dc49;
  --green-text: #6f9a3a;
  --shadow: 0 24px 44px rgba(94,71,26,.12);
  --ease: cubic-bezier(.2,.7,.2,1);
  --t-micro: 160ms;
  --t-ui: 240ms;
  --t-enter: 420ms;
  --t-draw: 900ms;
}

html, body {
  width: 100%;
  height: 100%;
  font-family: var(--font-caros, 'Inter', sans-serif);
  background: var(--bg);
  color: var(--ink);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition:
    transform var(--t-micro) var(--ease),
    box-shadow var(--t-micro) var(--ease),
    background-color var(--t-ui) var(--ease),
    color var(--t-ui) var(--ease);
}

button:active { transform: scale(.96); }

:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 3px;
}

.bottom-nav :focus-visible {
  outline-color: #fff;
  outline-offset: 2px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.screen {
  height: 100vh;
  padding: 16px 18px calc(20px + env(safe-area-inset-bottom));
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  background:
    radial-gradient(circle at 62% 8%, rgba(255,197,108,.42), transparent 18%),
    radial-gradient(circle at 14% 30%, rgba(255,255,255,.25), transparent 18%),
    linear-gradient(180deg, #f8efda 0%, #f1e8c8 44%, #efe7ca 100%);
}

/* ─── Entrance: plays once, gated on .js so no-JS gets a complete page ─── */
.js [data-enter] {
  opacity: 0;
  transform: translateY(14px);
}

.js.is-in [data-enter] {
  opacity: 1;
  transform: none;
  transition:
    opacity var(--t-enter) var(--ease),
    transform var(--t-enter) var(--ease);
  transition-delay: calc(var(--i, 0) * 45ms);
}

.status {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #151515;
}

.status-time {
  font-size: 15px;
  font-weight: 700;
}

.status-icons {
  display: flex;
  align-items: center;
  gap: 7px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-top: 18px;
}

.profile {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  min-width: 0;
}

.avatar {
  width: 50px;
  height: 50px;
  border-radius: 18px;
  flex-shrink: 0;
  background:
    radial-gradient(circle at 50% 28%, #3f2916 0 9px, transparent 10px),
    radial-gradient(circle at 50% 34%, #5f4026 0 15px, transparent 16px),
    linear-gradient(180deg, #f4e4c5 0%, #ead8b5 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
}

.hello {
  font-size: 15px;
  color: rgba(20,20,20,.76);
}

.dateline {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 3px;
  font-family: var(--font-bricolage, 'Inter', sans-serif);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -.03em;
  white-space: nowrap;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.icon-card {
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 12px;
  background: transparent;
  display: grid;
  place-items: center;
  color: #1d1d1d;
  position: relative;
  flex-shrink: 0;
}

.icon-card svg,
.search-ic svg,
.search-clear svg,
.filter-btn svg,
.wish-btn svg,
.add-btn svg,
.nav-item svg {
  display: block;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.notif-dot {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #f05a28;
  border: 1.5px solid #f2e9d4;
  transition: opacity var(--t-ui) var(--ease), transform var(--t-ui) var(--ease);
}

.icon-card.is-read .notif-dot {
  opacity: 0;
  transform: scale(.4);
}

.hero-copy {
  margin-top: 28px;
}

.hero-copy h1 {
  max-width: 290px;
  font-family: var(--font-bricolage, 'Inter', sans-serif);
  font-size: clamp(44px, 10.8vw, 56px);
  line-height: .94;
  letter-spacing: -.08em;
  font-weight: 600;
}

.hero-copy .accent {
  color: var(--orange-text);
}

.search-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 58px;
  gap: 12px;
  margin-top: 26px;
}

.search-box,
.filter-btn {
  background: var(--card);
  border-radius: 24px;
  box-shadow: var(--shadow);
}

.search-box {
  min-height: 70px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 10px 0 16px;
  transition: box-shadow var(--t-ui) var(--ease);
}

.search-box:focus-within {
  box-shadow: var(--shadow), 0 0 0 2px var(--ink);
}

.search-ic {
  width: 36px;
  height: 36px;
  border-radius: 14px;
  background: #f5f5f2;
  display: grid;
  place-items: center;
  color: #1f1f1f;
  flex-shrink: 0;
  cursor: text;
}

.search-box input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: none;
  font: inherit;
  font-size: 16px;
  color: var(--ink);
  -webkit-appearance: none;
  appearance: none;
}

.search-box input:focus-visible { outline: none; }
.search-box input::-webkit-search-cancel-button,
.search-box input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
.search-box input::placeholder { color: rgba(20,20,20,.62); opacity: 1; }

.search-clear {
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: #1f1f1f;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  opacity: 0;
  transform: scale(.6);
  pointer-events: none;
  transition: opacity var(--t-micro) var(--ease), transform var(--t-micro) var(--ease), background-color var(--t-ui) var(--ease);
}

.search-box.has-text .search-clear {
  opacity: 1;
  transform: none;
  pointer-events: auto;
}

.filter-btn {
  border: none;
  display: grid;
  place-items: center;
  color: #181818;
}

/* ─── Today: intake ring (the home's one chart) ─── */
.today {
  display: grid;
  grid-template-columns: 72px minmax(0, 1fr);
  gap: 14px;
  align-items: center;
  margin-top: 22px;
  padding: 12px 16px 12px 12px;
  border-radius: 24px;
  background: var(--card);
  box-shadow: var(--shadow);
}

.ring {
  width: 72px;
  height: 72px;
  display: block;
}

.ring-track {
  fill: none;
  stroke: rgba(20,20,20,.08);
  stroke-width: 9;
}

.ring-fill {
  fill: none;
  stroke: var(--orange);
  stroke-width: 9;
  stroke-linecap: round;
  transform: rotate(-90deg);
  transform-origin: 50% 50%;
  stroke-dasharray: 100;
  stroke-dashoffset: var(--off, 38);
  transition: stroke-dashoffset var(--t-draw) var(--ease), stroke var(--t-ui) var(--ease);
}

.js:not(.is-in) .ring-fill { stroke-dashoffset: 100; }
.js.is-in:not(.is-settled) .ring-fill { transition-delay: 180ms; }
.today.near-goal .ring-fill { stroke: var(--orange-text); }

.today-kcal {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 6px;
  font-family: var(--font-bricolage, 'Inter', sans-serif);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -.04em;
  line-height: 1;
}

.today-kcal .num {
  font-variant-numeric: tabular-nums;
  min-width: 4.4ch;
}

.today-kcal .unit {
  font-family: var(--font-caros, 'Inter', sans-serif);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0;
  color: var(--muted);
}

.macros {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  margin-top: 8px;
  font-size: 14px;
  color: rgba(20,20,20,.8);
  list-style: none;
}

.macro {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.macro::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--c);
  flex-shrink: 0;
}

.macro b {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}

.chips {
  position: relative;
  display: flex;
  gap: 12px;
  margin-top: 24px;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
  scroll-snap-type: x proximity;
  scroll-padding-inline: 4px;
}

.chips::-webkit-scrollbar { display: none; }

.chips.has-more {
  -webkit-mask-image: linear-gradient(90deg, #000 82%, transparent);
  mask-image: linear-gradient(90deg, #000 82%, transparent);
}

.chip {
  flex: 0 0 auto;
  min-width: 108px;
  height: 50px;
  border: none;
  padding: 0 18px;
  border-radius: 18px;
  background: rgba(255,255,255,.9);
  box-shadow: 0 14px 24px rgba(94,71,26,.08);
  font-family: var(--font-bricolage, 'Inter', sans-serif);
  font-size: 16px;
  color: #181818;
  scroll-snap-align: start;
}

.chip[aria-pressed="true"] {
  background: var(--ink);
  color: #fff;
  box-shadow: 0 14px 24px rgba(20,20,20,.16);
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 24px;
}

.section-head h2 {
  font-family: var(--font-bricolage, 'Inter', sans-serif);
  font-size: 22px;
  letter-spacing: -.05em;
  font-weight: 600;
}

.food-card {
  position: relative;
  margin-top: 16px;
  min-height: 356px;
  padding: 18px 16px 16px;
  border-radius: 34px;
  background: linear-gradient(180deg, #d9f275 0%, #cde85b 100%);
  box-shadow: 0 24px 44px rgba(157,187,52,.24);
  overflow: hidden;
}

.food-top {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 2;
}

.score-pill,
.wish-btn,
.food-bottom {
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.score-pill {
  display: inline-flex;
  align-items: center;
  height: 50px;
  padding: 0 18px;
  border-radius: 20px;
  background: rgba(255,255,255,.28);
  border: 1px solid rgba(255,255,255,.42);
  font-family: var(--font-bricolage, 'Inter', sans-serif);
}

.score-pill strong {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -.04em;
}

.score-pill small {
  font-size: 14px;
  color: rgba(20,20,20,.62);
  margin-left: 1px;
}

.wish-btn {
  width: 50px;
  height: 50px;
  border: none;
  border-radius: 20px;
  background: rgba(255,255,255,.24);
  border: 1px solid rgba(255,255,255,.42);
  display: grid;
  place-items: center;
  color: var(--ink);
}

.wish-btn svg path {
  fill: transparent;
  transition: fill var(--t-ui) var(--ease), stroke var(--t-ui) var(--ease);
}

.wish-btn[aria-pressed="true"] svg path {
  fill: var(--orange-text);
  stroke: var(--orange-text);
}

.wish-btn.pop svg { animation: pop var(--t-ui) var(--ease); }

@keyframes pop {
  50% { transform: scale(1.22); }
}

.food-visual {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 18px;
  min-height: 178px;
  z-index: 1;
  transform: translate(calc(var(--tx, 0) * 7px), calc(var(--ty, 0) * 5px));
  transition: transform 180ms linear;
}

.food-visual::before {
  content: "";
  position: absolute;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle at center, rgba(255,255,255,.42) 0%, rgba(255,255,255,0) 62%);
  filter: blur(4px);
  transform: translate(calc(var(--tx, 0) * -12px), calc(var(--ty, 0) * -8px));
  transition: transform 180ms linear;
}

.food-visual img {
  position: relative;
  width: min(74vw, 284px);
  height: auto;
  transform: rotate(calc(-5deg + var(--tx, 0) * 2.5deg));
  filter: drop-shadow(0 20px 24px rgba(131,90,11,.28));
  transition: transform 180ms linear;
}

.js:not(.is-in) .food-visual img {
  transform: rotate(-11deg) translateY(26px) scale(.94);
}

.js.is-in:not(.is-settled) .food-visual img {
  transition: transform 720ms var(--ease) 340ms;
}

.food-card.is-resetting .food-visual,
.food-card.is-resetting .food-visual::before,
.food-card.is-resetting .food-visual img {
  transition: transform 560ms var(--ease);
}

.food-bottom {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 14px 14px 16px;
  border-radius: 26px;
  background: rgba(255,255,255,.34);
  border: 1px solid rgba(255,255,255,.44);
  z-index: 3;
}

.food-info h3 {
  font-family: var(--font-bricolage, 'Inter', sans-serif);
  font-size: 17px;
  letter-spacing: -.04em;
  font-weight: 600;
}

.food-info p {
  margin-top: 4px;
  color: rgba(20,20,20,.62);
  font-size: 15px;
}

.add-btn {
  flex: 0 0 auto;
  min-width: 104px;
  height: 52px;
  border: none;
  border-radius: 20px;
  background: rgba(255,255,255,.7);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 17px;
  color: #272727;
}

.add-btn svg path {
  transform-box: view-box;
  transform-origin: 50% 50%;
  transition: opacity var(--t-ui) var(--ease), transform var(--t-ui) var(--ease);
}

.add-btn .p-check {
  opacity: 0;
  transform: scale(.4) rotate(-45deg);
}

.add-btn[aria-pressed="true"] {
  background: var(--ink);
  color: #fff;
  box-shadow: none;
}

.add-btn[aria-pressed="true"] .p-plus {
  opacity: 0;
  transform: rotate(90deg) scale(.4);
}

.add-btn[aria-pressed="true"] .p-check {
  opacity: 1;
  transform: none;
}

.bottom-nav {
  position: sticky;
  bottom: 0;
  z-index: 8;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 14px;
  padding: 8px;
  border-radius: 30px;
  background: rgba(25,25,24,.94);
  box-shadow: 0 26px 44px rgba(28,28,26,.24);
}

.nav-item {
  height: 56px;
  border: none;
  border-radius: 20px;
  background: transparent;
  color: rgba(255,255,255,.86);
  display: grid;
  place-items: center;
}

.nav-item[aria-current="page"] {
  background: linear-gradient(180deg, #ffbb9d 0%, #ff9469 100%);
  color: #1b120d;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.54);
}

@media (hover: hover) {
  .icon-card:hover,
  .search-clear:hover { background: rgba(20,20,20,.06); }
  .chip:not([aria-pressed="true"]):hover {
    transform: translateY(-1px);
    box-shadow: 0 16px 26px rgba(94,71,26,.14);
  }
  .chip:not([aria-pressed="true"]):hover:active { transform: scale(.96); }
  .filter-btn:hover { box-shadow: var(--shadow), 0 0 0 1px rgba(20,20,20,.1); }
  .wish-btn:hover { background: rgba(255,255,255,.44); }
  .add-btn:not([aria-pressed="true"]):hover { background: rgba(255,255,255,.92); }
  .nav-item:not([aria-current="page"]):hover { background: rgba(255,255,255,.08); }
}

@media (max-height: 820px) {
  .hero-copy h1 { font-size: clamp(40px, 10vw, 50px); }
  .food-card { min-height: 326px; }
  .food-visual img { width: min(66vw, 240px); }
}

@media (max-width: 320px) {
  .screen {
    padding: 14px 14px calc(16px + env(safe-area-inset-bottom));
  }

  .header {
    align-items: flex-start;
    gap: 10px;
  }

  .profile {
    min-width: 0;
    gap: 10px;
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 15px;
    flex-shrink: 0;
  }

  .hello {
    font-size: 13px;
  }

  .dateline {
    gap: 5px;
    font-size: 14px;
    line-height: 1.05;
  }

  .hero-copy {
    margin-top: 14px;
  }

  .hero-copy h1 {
    max-width: 100%;
    font-size: 36px;
    line-height: .92;
    letter-spacing: -.075em;
  }

  .search-row {
    grid-template-columns: minmax(0, 1fr) 50px;
    gap: 10px;
    margin-top: 18px;
  }

  .search-box {
    min-height: 58px;
    gap: 10px;
    padding: 0 8px 0 12px;
    border-radius: 20px;
  }

  .search-ic {
    width: 32px;
    height: 32px;
    border-radius: 12px;
  }

  .filter-btn {
    border-radius: 20px;
  }

  .today {
    grid-template-columns: 60px minmax(0, 1fr);
    gap: 12px;
    margin-top: 16px;
    padding: 10px 12px;
    border-radius: 20px;
  }

  .ring {
    width: 60px;
    height: 60px;
  }

  .today-kcal {
    font-size: 18px;
  }

  .today-kcal .unit {
    font-size: 13px;
  }

  .macros {
    gap: 3px 10px;
    margin-top: 6px;
    font-size: 13px;
  }

  .chips {
    gap: 10px;
    margin-top: 14px;
  }

  .chip {
    min-width: 78px;
    height: 40px;
    padding: 0 14px;
    border-radius: 14px;
    font-size: 13px;
  }

  .section-head {
    margin-top: 16px;
  }

  .section-head h2 {
    font-size: 16px;
  }

  .food-card {
    min-height: 280px;
    margin-top: 12px;
    padding: 12px 12px 12px;
    border-radius: 26px;
  }

  .score-pill,
  .wish-btn {
    height: 42px;
    border-radius: 16px;
  }

  .score-pill {
    padding: 0 14px;
  }

  .score-pill strong {
    font-size: 17px;
  }

  .score-pill small {
    font-size: 13px;
  }

  .wish-btn {
    width: 42px;
  }

  .food-visual {
    min-height: 132px;
    margin-top: 8px;
  }

  .food-visual img {
    width: min(58vw, 176px);
  }

  .food-bottom {
    left: 12px;
    right: 12px;
    bottom: 12px;
    gap: 10px;
    padding: 10px 10px 10px 12px;
    border-radius: 20px;
  }

  .food-info h3 {
    font-size: 14px;
  }

  .food-info p {
    margin-top: 3px;
    font-size: 13px;
  }

  .add-btn {
    min-width: 84px;
    height: 42px;
    border-radius: 16px;
    font-size: 13px;
  }

  .bottom-nav {
    gap: 6px;
    margin-top: 10px;
    padding: 7px;
    border-radius: 24px;
    bottom: 0;
  }

  .nav-item {
    height: 46px;
    border-radius: 16px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0ms !important;
    transition-delay: 0ms !important;
    animation-duration: 0ms !important;
    animation-iteration-count: 1 !important;
  }
  .js [data-enter] {
    opacity: 1;
    transform: none;
  }
  .js:not(.is-in) .food-visual img {
    transform: rotate(-5deg);
  }
  .js:not(.is-in) .ring-fill {
    stroke-dashoffset: var(--off, 38);
  }
}
</style>
</head>
<body>
<div class="screen">
  <div class="status" data-enter style="--i:0">
    <span class="status-time">9:30</span>
    <div class="status-icons" aria-hidden="true">

        <path d="M0.5 3.5C2.5 1.3 5.1 0 8 0s5.5 1.3 7.5 3.5" stroke="#141414" stroke-width="1.5" stroke-linecap="round" opacity=".38"/>

      <svg width="26" height="13" viewBox="0 0 26 13" fill="none">
        <rect x=".5" y=".5" width="22" height="12" rx="3.5" stroke="#141414" stroke-opacity=".32"/>

  <header class="header" data-enter style="--i:1">

  <section class="hero-copy" data-enter style="--i:2">

  <div class="search-row" data-enter style="--i:3">
    <div class="search-box">
      <label class="search-ic" for="foodSearch">
        <span class="sr-only">Search food</span>

      </label>
      <input id="foodSearch" type="search" placeholder="Search food" autocomplete="off" enterkeyhint="search" spellcheck="false">
      <button class="search-clear" type="button" aria-label="Clear search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">

    <button class="filter-btn" type="button" aria-label="Filters">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="1.9"/>
        <circle cx="9" cy="7" r="2.1" fill="#fff" stroke="currentColor" stroke-width="1.7"/>
        <circle cx="15" cy="12" r="2.1" fill="#fff" stroke="currentColor" stroke-width="1.7"/>
        <circle cx="11" cy="17" r="2.1" fill="#fff" stroke="currentColor" stroke-width="1.7"/>
      </svg>

  <section class="today" id="today" aria-label="Today's intake" data-enter style="--i:4">
    <svg class="ring" viewBox="0 0 96 96" aria-hidden="true">
      <circle class="ring-track" cx="48" cy="48" r="40"/>
      <circle class="ring-fill" id="ringFill" cx="48" cy="48" r="40" pathLength="100"/>
    </svg>
    <div class="today-copy">
      <p class="today-kcal"><span class="num" id="kcalNum">1,240</span><span class="unit">/ 2,000 kcal</span></p>
      <ul class="macros">
        <li class="macro" style="--c:var(--orange)"><b id="mCarb">150</b> g carbs</li>
        <li class="macro" style="--c:var(--blue)"><b id="mFat">40</b> g fat</li>
        <li class="macro" style="--c:var(--green-text)"><b id="mPro">70</b> g protein</li>
      </ul>
      <span class="sr-only" id="liveNote" aria-live="polite"></span>
    </div>
  </section>

  <div class="chips" role="group" aria-label="Browse" data-enter style="--i:5">
    <button class="chip" type="button" aria-pressed="true">Popular</button>
    <button class="chip" type="button" aria-pressed="false">Quick &amp; Easy</button>
    <button class="chip" type="button" aria-pressed="false">Diets</button>
    <button class="chip" type="button" aria-pressed="false">Protein</button>
  </div>

  <div class="section-head" data-enter style="--i:6">
    <h2>Recommended for you</h2>
  </div>

  <article class="food-card" id="foodCard" data-enter style="--i:7">
    <div class="food-top">
      <p class="score-pill"><span class="sr-only">Nutrition score </span><strong>8.2</strong><small aria-hidden="true">/10</small><span class="sr-only"> out of 10</span></p>
      <button class="wish-btn" id="wishBtn" type="button" aria-label="Favourite" aria-pressed="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 20.5l-1.22-1.1C6.1 15.18 3 12.4 3 8.9A4.9 4.9 0 017.98 4c1.54 0 3.01.72 4.02 1.87A5.24 5.24 0 0116.02 4 4.9 4.9 0 0121 8.9c0 3.5-3.1 6.28-7.78 10.5L12 20.5z" stroke="currentColor" stroke-width="1.85"/>
        </svg>
      </button>
    </div>

    <div class="food-visual">
      <img src="../assets/burger-cutout.png" alt="Black Label Burger" width="792" height="832" decoding="async" fetchpriority="high">
    </div>

    <div class="food-bottom">
      <div class="food-info">
        <h3>Black Label Burger</h3>
        <p>650 Kcal</p>
      </div>
      <button class="add-btn" id="addBtn" type="button" aria-pressed="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path class="p-plus" d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          <path class="p-check" d="M5.5 12.5l4 4 9-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Add</span>
      </button>
    </div>
  </article>

  <nav class="bottom-nav" aria-label="Primary">
    <button class="nav-item" type="button" aria-label="Home" aria-current="page">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4.5 10.4L12 4.5l7.5 5.9v8a1.4 1.4 0 01-1.4 1.4h-3.9v-5.1a1 1 0 00-1-1H10.8a1 1 0 00-1 1v5.1H5.9a1.4 1.4 0 01-1.4-1.4v-8z" stroke="currentColor" stroke-width="1.9"/>
      </svg>
    </button>
    <button class="nav-item" type="button" aria-label="Favourites">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 20.5l-1.22-1.1C6.1 15.18 3 12.4 3 8.9A4.9 4.9 0 017.98 4c1.54 0 3.01.72 4.02 1.87A5.24 5.24 0 0116.02 4 4.9 4.9 0 0121 8.9c0 3.5-3.1 6.28-7.78 10.5L12 20.5z" stroke="currentColor" stroke-width="1.85"/>
      </svg>
    </button>
    <button class="nav-item" type="button" aria-label="History">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.85"/>
        <path d="M12 7.6V12l3 2" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="nav-item" type="button" aria-label="Profile">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="8.6" r="3.6" stroke="currentColor" stroke-width="1.85"/>
        <path d="M5.2 19.2c1.5-2.9 3.88-4.35 6.8-4.35s5.3 1.45 6.8 4.35" stroke="currentColor" stroke-width="1.85"/>
      </svg>
    </button>
  </nav>
</div>

<script>
(function () {
  var doc = document.documentElement;
  var reduceMq = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  function reduced() { return reduceMq.matches; }
  function $(s) { return document.querySelector(s); }
  function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  /* Date line: "Sunday, Oct 19"; the static "Today" stays as the no-JS text. */
  var todayEl = $('[data-today]');
  if (todayEl) {
    try {
      todayEl.textContent = new Intl.DateTimeFormat('en-US', { weekday: 'long', month: 'short', day: 'numeric' }).format(new Date());
    } catch (e) { /* keep "Today" */ }
  }

  /* Today ring: demo intake for the fictional product. The meal values are the
     pair screen's per-serving figures (650 kcal, 60.5 g / 7.8 g / 5 g). */
  var GOAL = 2000;
  var base = { kcal: 1240, carb: 150, fat: 40, pro: 70 };
  var meal = { kcal: 650, carb: 60.5, fat: 7.8, pro: 5 };
  var shown = { kcal: 0, carb: base.carb, fat: base.fat, pro: base.pro };
  var out = { kcal: $('#kcalNum'), carb: $('#mCarb'), fat: $('#mFat'), pro: $('#mPro') };
  var today = $('#today');
  var ring = $('#ringFill');
  var live = $('#liveNote');
  var raf = 0;

  function sum(a, b) { return { kcal: a.kcal + b.kcal, carb: a.carb + b.carb, fat: a.fat + b.fat, pro: a.pro + b.pro }; }
  function copy(o) { return { kcal: o.kcal, carb: o.carb, fat: o.fat, pro: o.pro }; }

  function paint(v) {
    out.kcal.textContent = fmt(v.kcal);
    out.carb.textContent = fmt(v.carb);
    out.fat.textContent = fmt(v.fat);
    out.pro.textContent = fmt(v.pro);
  }

  function setRing(kcal) {
    var pct = Math.min(100, Math.round(kcal / GOAL * 100));
    ring.style.setProperty('--off', String(100 - pct));
    today.classList.toggle('near-goal', pct >= 90);
  }

  function tween(to, ms) {
    cancelAnimationFrame(raf);
    if (reduced() || ms === 0) { shown = copy(to); paint(shown); return; }
    var from = copy(shown);
    var t0 = performance.now();
    function step(now) {
      var t = Math.min(1, (now - t0) / ms);
      var k = easeOut(t);
      shown.kcal = from.kcal + (to.kcal - from.kcal) * k;
      shown.carb = from.carb + (to.carb - from.carb) * k;
      shown.fat = from.fat + (to.fat - from.fat) * k;
      shown.pro = from.pro + (to.pro - from.pro) * k;
      paint(shown);
      if (t < 1) raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
  }

  /* Entrance: once, after fonts settle, capped at 300 ms so an offline page never waits. */
  var entered = false;
  function enter() {
    if (entered) return;
    entered = true;
    doc.classList.add('is-in');
    setRing(base.kcal);
    if (reduced()) {
      shown = copy(base);
      paint(shown);
      doc.classList.add('is-settled');
      return;
    }
    setTimeout(function () { tween(base, 900); }, 200);
    setTimeout(function () { doc.classList.add('is-settled'); }, 1200);
  }

  if (reduced()) {
    enter();
  } else {
    paint(shown); /* kcal reads 0 while still hidden, then counts up */
    var armed = false;
    function go() {
      if (armed) return;
      armed = true;
      requestAnimationFrame(function () { requestAnimationFrame(enter); });
    }
    setTimeout(go, 300);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(go, go);
  }

  /* Add: logs the meal into the ring; second tap undoes it (pair of "Logged ✓"). */
  var addBtn = $('#addBtn');
  var addLabel = addBtn.querySelector('span');
  var added = false;
  addBtn.addEventListener('click', function () {
    added = !added;
    addBtn.setAttribute('aria-pressed', String(added));
    addLabel.textContent = added ? 'Added' : 'Add';
    var to = added ? sum(base, meal) : base;
    setRing(to.kcal);
    tween(to, 600);
    live.textContent = (added ? 'Black Label Burger added. ' : 'Black Label Burger removed. ') + fmt(to.kcal) + ' of ' + fmt(GOAL) + ' kcal today.';
  });

  /* Favourite: pressed state + one pop. */
  var wish = $('#wishBtn');
  wish.addEventListener('click', function () {
    var on = wish.getAttribute('aria-pressed') !== 'true';
    wish.setAttribute('aria-pressed', String(on));
    if (on && !reduced()) {
      wish.classList.remove('pop');
      void wish.offsetWidth;
      wish.classList.add('pop');
    }
  });

  /* Notifications: a tap marks them read. */
  var notif = $('#notifBtn');
  notif.addEventListener('click', function () {
    notif.classList.add('is-read');
    notif.setAttribute('aria-label', 'Notifications');
  });

  /* Search: clear button appears with text. */
  var input = $('#foodSearch');
  var box = input.parentNode;
  var clearBtn = box.querySelector('.search-clear');
  function syncClear() { box.classList.toggle('has-text', input.value.length > 0); }
  input.addEventListener('input', syncClear);
  clearBtn.addEventListener('click', function () {
    input.value = '';
    syncClear();
    input.focus();
  });
  syncClear();

  /* Chips: single select, kept in view without touching the parent frame's scroll. */
  var chips = $('.chips');
  function moreCheck() {
    chips.classList.toggle('has-more', chips.scrollLeft + chips.clientWidth < chips.scrollWidth - 1);
  }
  chips.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    var all = chips.querySelectorAll('.chip');
    for (var i = 0; i < all.length; i++) all[i].setAttribute('aria-pressed', String(all[i] === b));
    var pad = 12;
    var left = b.offsetLeft;
    var right = left + b.offsetWidth;
    var target = null;
    if (left - pad < chips.scrollLeft) target = left - pad;
    else if (right + pad > chips.scrollLeft + chips.clientWidth) target = right + pad - chips.clientWidth;
    if (target !== null) chips.scrollTo({ left: Math.max(0, target), behavior: reduced() ? 'auto' : 'smooth' });
  });
  chips.addEventListener('scroll', moreCheck, { passive: true });
  window.addEventListener('resize', moreCheck);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(moreCheck, moreCheck);
  moreCheck();

  /* Pointer tilt on the card: desktop pointers only, after the entrance, never under reduced motion. */
  var card = $('#foodCard');
  var fine = window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (fine) {
    var tx = 0, ty = 0, queued = false;
    card.addEventListener('pointermove', function (e) {
      if (reduced() || !doc.classList.contains('is-settled')) return;
      var r = card.getBoundingClientRect();
      tx = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width) * 2 - 1));
      ty = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height) * 2 - 1));
      if (queued) return;
      queued = true;
      requestAnimationFrame(function () {
        queued = false;
        card.classList.remove('is-resetting');
        card.style.setProperty('--tx', tx.toFixed(3));
        card.style.setProperty('--ty', ty.toFixed(3));
      });
    });
    card.addEventListener('pointerleave', function () {
      card.classList.add('is-resetting');
      card.style.setProperty('--tx', '0');
      card.style.setProperty('--ty', '0');
    });
  }
})();
</script>
</body>
</html>
