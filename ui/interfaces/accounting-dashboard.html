<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LedgerStack — IT Accounting</title>
<link rel="stylesheet" href="/ui/assets/fonts.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #efece4;
  --white:     #fffcf8;
  --border:    #e3ddd2;
  --t1:        #1a1814;
  --t2:        #6f6a62;
  --teal:      #0e6b52;
  --teal-l:    #e4f2eb;
  --blue:      #3d5a80;
  --blue-l:    #e7eef6;
  --green:     #0e6b52;
  --green-l:   #e4f2eb;
  --red:       #b42318;
  --red-l:     #f8e8e6;
  --amber:     #8a5a12;
  --amber-l:   #f8efd8;
  --brass:     #c4a574;
  --ink:       #141210;
  --shadow:    0 1px 0 rgba(26,24,20,.04), 0 10px 28px rgba(26,24,20,.04);
  --shadow-lg: 0 16px 40px rgba(26,24,20,.12);
  --sidebar-w: 232px;
  --r-sm:      4px;
  --r-md:      10px;
  --r-lg:      16px;
  --r-shell:   24px;
  --display:   var(--font-darker), "Arial Narrow", sans-serif;
  --ease:      cubic-bezier(.16, 1, .3, 1);
  --dur-1:     180ms;
  --dur-2:     420ms;
  --dur-3:     700ms;
}

html, body {
  height: 100%;
  background: var(--bg);
  font-family: var(--font-inter), -apple-system, sans-serif;
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  color: var(--t1);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes growBar { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes drawLine { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes donutSpin { from { stroke-dasharray: 0 440; } to { stroke-dasharray: var(--dash) 440; } }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes popDiamond { from { transform: rotate(45deg) scale(0); } to { transform: rotate(45deg) scale(1); } }
@keyframes sheetIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

.app {
  display: flex;
  height: 100%;
  min-height: 0;
  overflow: hidden;
  gap: 12px;
  padding: 12px;
  background:
    radial-gradient(520px 420px at 0% 0%, rgba(196,165,116,.28), transparent 62%),
    var(--bg);
}

/* Sidebar: dark rail with the brass edge */
.sidebar {
  position: relative;
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 16px 12px 12px;
  border-radius: var(--r-shell);
  color: #e7e1d6;
  background: rgba(22, 18, 14, .78);
  box-shadow: 0 18px 40px rgba(20,18,16,.18);
  animation: fadeIn var(--dur-2) ease both;
}
.sidebar::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(160deg, rgba(246,241,231,.55) 0%, rgba(196,165,116,.42) 38%, rgba(255,252,248,.08) 68%, rgba(196,165,116,.22) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  pointer-events: none;
}
.sidebar :focus-visible { outline-color: #e7d3ae; }
.sb-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 6px 2px 2px;
}
.sb-logo-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--r-md);
  background: rgba(255,252,248,.08);
  box-shadow: inset 0 0 0 1px rgba(196,165,116,.35);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.sb-logo-icon svg { width: 16px; height: 16px; }
.sb-brand { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.sb-logo-text {
  height: 24px;
  font-family: var(--display);
  font-size: 24px;
  font-weight: 600;
  color: #f6f1e7;
  letter-spacing: -.02em;
  line-height: 1;
}
.sb-badge {
  width: fit-content;
  padding: 1px 7px;
  border-radius: 999px;
  background: rgba(196,165,116,.16);
  font-family: var(--display);
  font-size: 13px;
  font-weight: 600;
  color: #e7d3ae;
}
.sb-nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-height: 0;
  overflow: auto;
  padding-right: 2px;
}
.sb-section {
  font-family: var(--display);
  font-size: 13px;
  font-weight: 600;
  color: rgba(231,225,214,.7);
  padding: 12px 10px 4px;
}
.sb-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 36px;
  padding: 0 8px 0 6px;
  border: 0;
  border-radius: var(--r-md);
  background: transparent;
  font-size: 13px;
  font-weight: 500;
  text-align: left;
  color: #d9d2c6;
  cursor: pointer;
  transition: background var(--dur-1) ease, color var(--dur-1) ease;
}
.sb-item:focus-visible { outline-offset: -2px; }
.sb-item svg {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
  opacity: .8;
}
.sb-item:hover { background: rgba(255,252,248,.06); color: #f6f1e7; }
.sb-item.active {
  background: rgba(255,252,248,.1);
  color: #f6f1e7;
  box-shadow: inset 0 0 0 1px rgba(196,165,116,.38);
}
.sb-item.active svg { opacity: 1; color: #e7d3ae; }
.sb-item[aria-disabled="true"] { opacity: .5; cursor: default; }
.sb-item[aria-disabled="true"]:hover { background: transparent; color: #d9d2c6; }
.sb-item .pill {
  margin-left: auto;
  font-family: var(--display);
  font-size: 13px;
  font-weight: 700;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: var(--r-md);
  background: rgba(196,165,116,.22);
  color: #f0dfbf;
  display: grid;
  place-items: center;
}
.sb-user {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: auto;
  padding: 8px;
  border-radius: var(--r-lg);
  background: rgba(255,252,248,.06);
}
.sb-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(196,165,116,.16);
  display: grid;
  place-items: center;
  flex: none;
  font-family: var(--display);
  font-size: 13px;
  color: #e7d3ae;
}
.sb-user-name { font-size: 13px; font-weight: 600; color: #f6f1e7; }
.sb-user-role { font-size: 11.5px; color: #c4bcb0; margin-top: 1px; }

/* Main */
.main {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
  min-height: 0;
  border-radius: var(--r-shell);
  background: rgba(255,252,248,.35);
}

.topbar {
  height: 56px;
  padding: 0 20px;
  background: rgba(255,252,248,.86);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
  animation: fadeIn var(--dur-2) ease both;
}
.tb-left { display: flex; flex-direction: column; min-width: 0; }
.tb-title {
  font-family: var(--display);
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -.02em;
  line-height: 1;
}
.tb-sub { font-size: 12px; color: var(--t2); margin-top: 3px; white-space: nowrap; }

/* Period switch: two real periods, one sliding thumb */
.tb-period {
  --seg: 0;
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  margin-left: 16px;
  padding: 3px;
  border-radius: 999px;
  background: rgba(26,24,20,.06);
}
.tb-period::before {
  content: "";
  position: absolute;
  top: 3px;
  bottom: 3px;
  left: 3px;
  width: calc(50% - 3px);
  border-radius: 999px;
  background: var(--white);
  box-shadow: 0 1px 2px rgba(26,24,20,.14);
  transform: translateX(calc(var(--seg) * 100%));
  transition: transform var(--dur-1) var(--ease);
}
.tb-seg {
  position: relative;
  z-index: 1;
  min-width: 44px;
  height: 26px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  font-family: var(--display);
  font-size: 15px;
  font-weight: 600;
  line-height: 1;
  color: var(--t2);
  cursor: pointer;
  transition: color var(--dur-1) ease;
}
.tb-seg[aria-pressed="true"] { color: var(--t1); cursor: default; }

.tb-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.tb-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  white-space: nowrap;
  transition: transform .12s, border-color var(--dur-1), color var(--dur-1);
}
.tb-btn:active { transform: scale(.97); }
.tb-btn-ghost {
  background: rgba(255,252,248,.45);
  border: 1px solid var(--border);
  color: var(--t2);
}
.tb-btn-ghost:hover,
.tb-btn-ghost[aria-expanded="true"] { border-color: var(--teal); color: var(--teal); }
.tb-btn-primary {
  height: 36px;
  padding: 0 12px 0 4px;
  gap: 8px;
  background: var(--ink);
  color: #f6f1e7;
  font-family: var(--display);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -.02em;
  line-height: 1;
}
.tb-btn-primary:hover { background: #2a241c; }
.tb-plus {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--brass);
  color: var(--ink);
  font-size: 18px;
  line-height: 1;
}
.tb-btn-primary:hover .tb-plus { background: #d7bc8e; }
.tb-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

/* Export sheet: the CSV stays reachable when a download is blocked */
.sheet {
  position: absolute;
  top: 62px;
  right: 20px;
  z-index: 30;
  width: min(440px, calc(100% - 40px));
  padding: 14px;
  border-radius: var(--r-lg);
  background: var(--white);
  box-shadow: 0 0 0 1px var(--border), var(--shadow-lg);
  animation: sheetIn 240ms var(--ease) both;
}
.sheet-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.sheet-title { font-family: var(--display); font-size: 19px; font-weight: 600; line-height: 1.05; letter-spacing: -.01em; }
.sheet-sub { font-size: 12px; line-height: 1.4; color: var(--t2); margin-top: 4px; }
.sheet-x {
  flex: none;
  width: 28px;
  height: 28px;
  margin-left: auto;
  border: 0;
  border-radius: 50%;
  background: rgba(26,24,20,.06);
  font-size: 17px;
  line-height: 1;
  cursor: pointer;
}
.sheet-x:hover { background: rgba(26,24,20,.1); }
.sheet-csv {
  display: block;
  width: 100%;
  height: 136px;
  padding: 10px 12px;
  resize: none;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--bg);
  font: 12px/1.6 ui-monospace, "SFMono-Regular", Consolas, monospace;
  color: var(--t1);
  overflow: auto;
}
.sheet-foot { display: flex; justify-content: flex-end; margin-top: 10px; }
.sheet-copy {
  height: 32px;
  padding: 0 14px;
  border: 0;
  border-radius: 999px;
  background: var(--ink);
  color: #f6f1e7;
  font-weight: 600;
  cursor: pointer;
}
.sheet-copy:hover { background: #2a241c; }

.content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 20px 24px 40px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: var(--bg);
}

/* KPI row */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
.kpi {
  background: rgba(255,252,248,.78);
  border-radius: var(--r-lg);
  padding: 16px 18px 15px;
  box-shadow: var(--shadow);
  animation: fadeUp var(--dur-2) var(--ease) both;
  animation-delay: calc(40ms + var(--i, 0) * 60ms);
}
.kpi-row.is-settled .kpi { animation: none; }
.kpi-hero {
  background: rgba(20,18,16,.88);
  color: #f6f1e7;
}
.kpi-hero .kpi-label,
.kpi-hero .kpi-hint { color: rgba(246,241,231,.66); }
.kpi-hero .kpi-value { color: #f6f1e7; }
.kpi-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: 24px;
  margin-bottom: 10px;
}
.kpi-label { font-size: 12px; font-weight: 500; color: var(--t2); }
.spark { width: 72px; height: 24px; flex: none; overflow: visible; }
.spark polyline {
  fill: none;
  stroke: rgba(26,24,20,.42);
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.spark circle { fill: var(--t1); }
.kpi-hero .spark polyline { stroke: rgba(246,241,231,.5); }
.kpi-hero .spark circle { fill: var(--brass); }
.kpi-value {
  font-family: var(--display);
  font-size: clamp(30px, 3.4vw, 42px);
  font-weight: 650;
  letter-spacing: -.04em;
  line-height: 1;
  color: var(--t1);
  font-variant-numeric: tabular-nums;
}
.kpi-foot {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  font-size: 12px;
}
.kpi-delta {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: var(--r-sm);
}
.kpi-delta.up { background: var(--green-l); color: var(--green); }
.kpi-delta.down { background: var(--red-l); color: var(--red); }
.kpi-delta svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2.5; }
.kpi-hint { color: var(--t2); }

/* Secondary KPIs */
.kpi-row-sm {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  background: rgba(255,252,248,.62);
  border-radius: var(--r-lg);
  padding: 14px 2px;
  box-shadow: var(--shadow);
  animation: fadeUp var(--dur-2) var(--ease) 240ms both;
}
.kpi-sm { padding: 4px 16px; }
.kpi-sm:not([hidden]) ~ .kpi-sm { border-left: 1px solid var(--border); }
.kpi-sm-label { font-size: 12px; color: var(--t2); font-weight: 500; margin-bottom: 4px; }
.kpi-sm-value {
  font-family: var(--display);
  font-size: 28px;
  font-weight: 650;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.kpi-sm-sub { font-size: 12px; color: var(--t2); margin-top: 3px; }

/* Grid layout */
.kpi-row,
.kpi-row-sm,
.grid-2-1,
.grid-1-1,
.content > .card { flex: 0 0 auto; overflow: visible; }

.grid-2-1 {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
  gap: 14px;
  align-items: stretch;
}
.grid-2-1 > .card { height: 100%; }
.grid-1-1 {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 14px;
}
.grid-2-1:has(> [hidden]),
.grid-1-1:has(> [hidden]) { grid-template-columns: minmax(0, 1fr); }

.card {
  background: rgba(255,252,248,.7);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  padding: 18px;
  animation: fadeUp var(--dur-2) var(--ease) both;
  animation-delay: var(--enter, 300ms);
  display: flex;
  flex-direction: column;
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  flex-shrink: 0;
}
.card-title {
  font-family: var(--display);
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -.03em;
  line-height: 1;
}
.card-sub { font-size: 12px; color: var(--t2); margin-top: 4px; }
.card-tabs {
  display: flex;
  flex: none;
  gap: 4px;
  background: var(--bg);
  padding: 3px;
  border-radius: 999px;
}
.card-tab {
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--t2);
  cursor: pointer;
  border: none;
  background: transparent;
  transition: background var(--dur-1), color var(--dur-1);
}
.card-tab[aria-pressed="true"] { background: var(--ink); color: #f6f1e7; }

/* Bar chart */
.chart-area { flex: 1; position: relative; min-height: 280px; }
.chart-legend {
  display: flex;
  gap: 16px;
  margin-bottom: 12px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--t2);
  font-weight: 500;
}
.legend-dot { width: 8px; height: 8px; border-radius: 2px; }
.bar-chart {
  --bar-delay: 340ms;
  position: relative;
  display: grid;
  grid-template-columns: repeat(var(--n, 6), minmax(0, 1fr));
  align-items: end;
  gap: 16px;
  height: 248px;
  padding: 22px 4px 0;
  border-bottom: 1px solid var(--border);
}
.bar-scale {
  position: absolute;
  left: 0;
  right: 0;
  top: 22px;
  border-top: 1px dashed rgba(26,24,20,.18);
  pointer-events: none;
}
.bar-scale span {
  position: absolute;
  right: 0;
  bottom: 5px;
  font-family: var(--display);
  font-size: 14px;
  font-weight: 600;
  line-height: 1;
  color: var(--t2);
}
.month {
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  justify-items: center;
  align-items: end;
  gap: 8px;
  height: 100%;
  min-width: 0;
  padding: 0;
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  cursor: pointer;
}
.month-pair {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 100%;
  width: 100%;
  max-width: 96px;
}
.month-pair.single { justify-content: center; }
.month-pair.single .bar { width: 46%; flex: none; }
.bar {
  flex: 1;
  height: var(--h);
  border-radius: var(--r-md) var(--r-md) 2px 2px;
  transform-origin: bottom center;
  animation: growBar var(--dur-3) var(--ease) both;
  animation-delay: calc(var(--bar-delay) + var(--d, 0) * 60ms);
  transition: opacity var(--dur-1) ease, filter var(--dur-1) ease;
}
.month:hover .bar { filter: brightness(1.12); }
.bar-chart.has-sel .month:not([aria-pressed="true"]) .bar { opacity: .38; }
.month[aria-pressed="true"] .month-name { color: var(--ink); }
.bar.income { background: linear-gradient(180deg, #1a1814, #3a342c); }
.bar.expense { background: linear-gradient(180deg, #e7d7b8, #c4a574); }
.bar.net { background: linear-gradient(180deg, #1f8a6a, var(--teal)); }
.month-name {
  font-family: var(--display);
  font-size: 16px;
  font-weight: 600;
  line-height: 1;
  color: var(--t2);
}
.month-read {
  min-height: 22px;
  margin-top: 12px;
  font-size: 13px;
  color: var(--t2);
}
.month-read.is-set { color: var(--t1); }
.month-read b { font-family: var(--display); font-size: 18px; font-weight: 650; }

/* Cash line: drawn at the box's own pixel size, so labels stay 1:1 */
.cash-chart { position: relative; flex: 1; min-height: 200px; }
.cash-chart svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.cash-line {
  fill: none;
  stroke: rgba(20,18,16,.62);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 0;
}
.cash-line.is-drawing { animation: drawLine 1.1s var(--ease) both; }
.cash-area { fill: url(#cashGrad); }
.grid-line { stroke: rgba(26,24,20,.1); stroke-width: 1; stroke-dasharray: 1 5; }
.axis-label { font-family: var(--display); font-size: 14px; font-weight: 600; fill: var(--t2); }
.cash-scale { font-family: var(--display); font-size: 13px; font-weight: 600; fill: var(--t2); }
.cash-last { font-family: var(--display); font-size: 16px; font-weight: 650; fill: var(--t1); }
.cash-pt { cursor: pointer; }
.cash-pt:focus, .cash-pt:focus-visible { outline: none; }
.cash-dot {
  fill: rgba(20,18,16,.32);
  stroke: none;
  transition: fill var(--dur-1) ease;
}
.cash-ring { fill: none; stroke: var(--teal); stroke-width: 2; opacity: 0; }
.cash-pt:focus-visible .cash-ring { opacity: 1; }
.cash-pt.is-last .cash-dot { fill: #fffcf8; stroke: rgba(20,18,16,.55); stroke-width: 1.25; }
.cash-pt:hover .cash-dot,
.cash-pt.is-on .cash-dot { fill: var(--ink); stroke: none; }
.cash-foot {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 8px;
  font-size: 12px;
  color: var(--t2);
}
.cash-foot b { font-weight: 600; color: var(--t1); }

/* Donut */
.donut-wrap {
  display: flex;
  align-items: center;
  gap: 20px;
  flex: 1;
}
.donut-chart {
  position: relative;
  width: 140px;
  height: 140px;
  flex-shrink: 0;
}
.donut-chart svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut-arc {
  transition: opacity var(--dur-1) ease;
  animation: donutSpin var(--dur-3) var(--ease) both;
  animation-delay: calc(440ms + var(--k, 0) * 50ms);
}
.donut-arc.is-dim { opacity: .28; }
.donut-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.donut-total {
  font-family: var(--display);
  font-size: 28px;
  font-weight: 650;
  letter-spacing: -.02em;
  line-height: 1;
}
.donut-lbl { max-width: 84px; margin-top: 3px; font-size: 11.5px; line-height: 1.2; color: var(--t2); }
.donut-legend { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.donut-row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 5px 6px;
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  font-size: 12px;
  text-align: left;
  cursor: pointer;
}
.donut-row:hover, .donut-row.is-on { background: var(--bg); }
.donut-row[aria-pressed="true"] { box-shadow: inset 2px 0 0 var(--ink); }
.donut-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.donut-row-name { flex: 1; min-width: 0; color: var(--t2); }
.donut-row-val { font-weight: 700; font-variant-numeric: tabular-nums; }
.donut-row-pct { font-size: 11.5px; color: var(--t2); width: 36px; text-align: right; }

/* Transactions table */
.tx-table { width: 100%; border-collapse: collapse; }
.tx-wrap { overflow: visible; }
.tx-table th {
  text-align: left;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--t2);
  padding: 0 10px 10px;
  border-bottom: 1px solid var(--border);
}
.tx-table td {
  padding: 11px 10px;
  font-size: 12.5px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.tx-table tr:last-child td { border-bottom: none; }
.tx-table tbody tr:hover td { background: var(--bg); }
.tx-date { color: var(--t2); white-space: nowrap; }
.tx-client { font-weight: 600; }
.tx-cat { font-size: 12px; color: var(--t2); }
.tx-amount { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.tx-amount.pos { color: var(--green); }
.tx-amount.neg { color: var(--t1); }

/* Collections calendar: when the open money lands, and when VAT leaves */
.cal { margin: -2px 0 16px; }
.cal-track { position: relative; height: 78px; margin: 0 8px; }
.cal-past {
  position: absolute;
  left: 0;
  top: 18px;
  bottom: 22px;
  border-radius: var(--r-sm) 0 0 var(--r-sm);
  background: repeating-linear-gradient(135deg, rgba(26,24,20,.08) 0 1px, transparent 1px 6px);
}
.cal-line {
  position: absolute;
  left: 0;
  right: 0;
  top: 40px;
  height: 1px;
  background: rgba(26,24,20,.24);
}
.cal-week { position: absolute; top: 40px; bottom: 0; width: 1px; }
.cal-week::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  width: 1px;
  height: 6px;
  background: rgba(26,24,20,.32);
}
.cal-week span {
  position: absolute;
  left: 0;
  bottom: 0;
  transform: translateX(-50%);
  font-size: 11.5px;
  line-height: 1;
  color: var(--t2);
  white-space: nowrap;
}
.cal-today {
  position: absolute;
  top: 16px;
  bottom: 22px;
  width: 0;
  border-left: 1.5px solid var(--brass);
}
.cal-today span {
  position: absolute;
  left: 0;
  top: -16px;
  transform: translateX(-50%);
  font-family: var(--display);
  font-size: 14px;
  font-weight: 650;
  line-height: 1;
  color: var(--t1);
  white-space: nowrap;
}
.cal-dot {
  position: absolute;
  top: 40px;
  width: 28px;
  height: 28px;
  margin: -14px 0 0 -14px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
}
.cal-dot::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--s);
  height: var(--s);
  margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
  border-radius: 50%;
  background: var(--c);
  box-shadow: 0 0 0 2px var(--white);
  transition: box-shadow var(--dur-1) ease;
  animation: pop var(--dur-2) var(--ease) both;
  animation-delay: calc(620ms + var(--k, 0) * 70ms);
}
.cal-dot.is-on::before { box-shadow: 0 0 0 2px var(--white), 0 0 0 3.5px var(--ink); }
.cal-dot:focus-visible { outline-offset: 0; }
.cal-amt {
  position: absolute;
  left: 50%;
  bottom: calc(50% + var(--s) / 2 + 5px);
  transform: translateX(-50%);
  font-family: var(--display);
  font-size: 15px;
  font-weight: 650;
  line-height: 1;
  color: var(--t1);
  white-space: nowrap;
}
.cal-dot.late .cal-amt { color: var(--red); }
.cal-vat { --s: 10px; position: absolute; top: 40px; width: 0; height: 0; }
.cal-vat::before {
  content: "";
  position: absolute;
  left: -5px;
  top: -5px;
  width: 10px;
  height: 10px;
  background: var(--ink);
  box-shadow: 0 0 0 2px var(--white);
  transform: rotate(45deg);
  animation: popDiamond var(--dur-2) var(--ease) both;
  animation-delay: calc(620ms + var(--k, 0) * 70ms);
}
.cal-key {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  margin-top: 12px;
  font-size: 12px;
  color: var(--t2);
}
.cal-key b { font-weight: 600; color: var(--t1); }
.cal-key i {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 6px;
  border-radius: 50%;
  background: var(--c);
}
.cal-key i.vat { border-radius: 1px; transform: rotate(45deg) scale(.85); }

/* Invoices */
.inv-list { display: flex; flex-direction: column; flex: 1; }
.inv-item {
  display: flex;
  align-items: center;

.inv-client { flex: 1; min-width: 0; }

.inv-due { display: block; font-size: 12px; color: var(--t2); margin-top: 1px; }
.inv-due.late { color: var(--red); font-weight: 600; }
.inv-amt { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; transition: color var(--dur-1) ease; }
.inv-status {

.inv-status.pending { background: var(--amber-l); color: var(--amber); }
.inv-status.sent { background: var(--blue-l); color: var(--blue); }
.inv-status.overdue { background: var(--red-l); color: var(--red); }

/* Tooltip */
.chart-tip {
  position: fixed;
  pointer-events: none;
  background: var(--t1);

  font-weight: 600;

.cash-fig {

[hidden] { display: none !important; }

@media (max-width: 1180px) {

}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .cash-line { stroke-dashoffset: 0 !important; }
}
</style>

<script>
const EUR = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const fmt = (n) => EUR.format(n);
const fmtK = (n) => {
  const a = Math.abs(n);
  const s = a >= 1000 ? '€' + (a / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : fmt(a);
  return (n < 0 ? '−' : '') + s;
};
const signed = (n) => (n < 0 ? '−' : '+') + fmt(Math.abs(n));
const sumBy = (rows, f) => rows.reduce((s, r) => s + f(r), 0);
const reduced = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const easeOut = (t) => 1 - Math.pow(1 - t, 4);

const DATA = {
  company: 'HexaNode SAS',
  asOf: '28 Jun',
  kpis: {
    revenue:      { value: 487200, delta: 14.2, label: 'Revenue' },
    expenses:     { value: 312800, delta: 8.6, label: 'Total expenses' },
    netProfit:    { value: 174400, delta: 22.8, label: 'Net profit' },
    cash:         { value: 89400,  delta: -3.2, label: 'Cash' },
    receivables:  { value: 42800,  sub: '4 open invoices' },
    payables:     { value: 18600,  sub: 'Due in under 30 days' },
    grossMargin:  { value: 64.2,   sub: 'Gross margin' },
    vatDue:       { value: 12400,  sub: 'VAT to remit', due: '24 Jul' }
  },
  monthly: [
    { month: 'Jan', income: 62000, expense: 48000 },
    { month: 'Feb', income: 71000, expense: 52000 },
    { month: 'Mar', income: 78000, expense: 54000 },
    { month: 'Apr', income: 85000, expense: 51000 },
    { month: 'May', income: 92000, expense: 56000 },
    { month: 'Jun', income: 99200, expense: 51800 }
  ],
  cashFlow: [72000, 68500, 74200, 79800, 83100, 89400],
  expenses: [
    { name: 'Salaries and charges', amount: 168000, color: '#1a1814' },
    { name: 'Cloud and infra', amount: 38400, color: '#0e6b52' },
    { name: 'SaaS tools', amount: 28600, color: '#c4a574' },
    { name: 'Offices', amount: 22400, color: '#8a9a7b' },
    { name: 'Marketing', amount: 18200, color: '#b85c38' },
    { name: 'Other', amount: 37200, color: '#c8c0b4' }
  ],
  transactions: [
    { date: '28 Jun', client: 'DataFlow GmbH', cat: 'Development', type: 'in', amount: 18500 },
    { date: '27 Jun', client: 'Coldrack Hosting', cat: 'Cloud and hosting', type: 'out', amount: -4200 },
    { date: '26 Jun', client: 'ScaleUp Ventures', cat: 'SaaS maintenance', type: 'in', amount: 6800 },
    { date: '25 Jun', client: 'Tracewell Design', cat: 'Design tools', type: 'out', amount: -890 },
    { date: '24 Jun', client: 'NeoBank SA', cat: 'Security audit', type: 'in', amount: 12400 },
    { date: '23 Jun', client: 'Halle Neuf Coworking', cat: 'Offices', type: 'out', amount: -3200 }
  ],
  invoices: [
    { num: 'FAC-2025-042', client: 'DataFlow GmbH', amount: 18500, due: '5 Jul', status: 'sent' },
    { num: 'FAC-2025-038', client: 'TechBridge AS', amount: 9200, due: '20 Jun', status: 'overdue', late: true },
    { num: 'FAC-2025-035', client: 'CloudNine Ltd', amount: 7600, due: '10 Jul', status: 'pending' },
    { num: 'FAC-2025-031', client: 'StartupLab', amount: 7500, due: '15 Jul', status: 'pending' }
  ]
};

const totalExpBreakdown = DATA.expenses.reduce((s, e) => s + e.amount, 0);

/* Periods: both views are derived from the same monthly arrays. */
const PERIODS = {
  h1: { start: 0, label: 'Jan — Jun 2025', vs: 'vs. H1 2024' },
  q2: { start: 3, label: 'Apr — Jun 2025', vs: 'vs. Q1 2025' }
};
const change = (now, before) => (now / before - 1) * 100;

function deriveView(key) {
  const p = PERIODS[key];
  const months = DATA.monthly.slice(p.start);
  const cash = DATA.cashFlow.slice(p.start);
  const revenue = sumBy(months, (m) => m.income);
  const expenses = sumBy(months, (m) => m.expense);
  const net = revenue - expenses;
  const cashNow = cash[cash.length - 1];
  let d = {
    revenue: DATA.kpis.revenue.delta,
    expenses: DATA.kpis.expenses.delta,
    netProfit: DATA.kpis.netProfit.delta,
    cash: DATA.kpis.cash.delta
  };
  if (p.start > 0) {
    const prior = DATA.monthly.slice(0, p.start);
    const pr = sumBy(prior, (m) => m.income);
    const pe = sumBy(prior, (m) => m.expense);
    d = {
      revenue: change(revenue, pr),
      expenses: change(expenses, pe),
      netProfit: change(net, pr - pe),
      cash: change(cashNow, DATA.cashFlow[p.start - 1])
    };
  }
  return {
    key,
    label: p.label,
    vs: p.vs,
    months,
    cash,
    kpis: {
      revenue:   { label: DATA.kpis.revenue.label, value: revenue, delta: d.revenue, series: months.map((m) => m.income) },
      expenses:  { label: DATA.kpis.expenses.label, value: expenses, delta: d.expenses, series: months.map((m) => m.expense) },
      netProfit: { label: DATA.kpis.netProfit.label, value: net, delta: d.netProfit, series: months.map((m) => m.income - m.expense) },
      cash:      { label: DATA.kpis.cash.label, value: cashNow, delta: d.cash, series: cash }
    }
  };
}

const state = { period: 'h1', mode: 'flow' };
let view = deriveView('h1');

/* Calendar maths: day numbers from 1 Jun, today = the latest booked entry. */
const MONTH_START = { Jun: 0, Jul: 30 };
const dayNo = (s) => { const [d, m] = s.split(' '); return MONTH_START[m] + Number(d); };
const TODAY = dayNo(DATA.asOf);
const CAL_FROM = TODAY - 10;
const CAL_DAYS = 40;
const calX = (day) => ((day - CAL_FROM) / CAL_DAYS * 100).toFixed(2) + '%';
const dayLabel = (day) => (day > 30 ? `${day - 30} Jul` : `${day} Jun`);
function dueIn(s) {
  const diff = dayNo(s) - TODAY;
  if (diff < 0) return `${-diff} day${diff === -1 ? '' : 's'} late`;
  if (diff === 0) return 'due today';
  return `in ${diff} day${diff === 1 ? '' : 's'}`;
}
const STATUS = {
  overdue: { label: 'Overdue', color: 'var(--red)' },
  sent:    { label: 'Sent', color: 'var(--blue)' },
  pending: { label: 'Pending', color: 'var(--amber)' }
};
const invoicesByDue = DATA.invoices.slice().sort((a, b) => dayNo(a.due) - dayNo(b.due));

function spark(values) {
  const w = 72, h = 24, pad = 3;
  const min = Math.min(...values);
  const span = (Math.max(...values) - min) || 1;
  const pts = values.map((v, i) => [
    pad + i * (w - pad * 2) / (values.length - 1),
    pad + (1 - (v - min) / span) * (h - pad * 2)
  ]);
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true" focusable="false"><polyline points="${pts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.2"/></svg>`;
}

const KPI_DEFS = [
  { key: 'revenue', hero: true },
  { key: 'expenses', invert: true },
  { key: 'netProfit' },
  { key: 'cash' }
];

function kpiCard(def, i) {
  const k = view.kpis[def.key];
  const up = k.delta >= 0;
  const good = def.invert ? !up : up;
  const arrow = up ? '<polyline points="18 15 12 9 6 15"/>' : '<polyline points="6 9 12 15 18 9"/>';
  return `
    <div class="kpi${def.hero ? ' kpi-hero' : ''}" style="--i:${i}">
      <div class="kpi-head">
        <span class="kpi-label">${k.label}</span>
        ${spark(k.series)}
      </div>
      <div class="kpi-value" data-k="${def.key}">${fmt(k.value)}</div>
      <div class="kpi-foot">
        <span class="kpi-delta ${good ? 'up' : 'down'}"><svg viewBox="0 0 24 24" aria-hidden="true">${arrow}</svg><span class="sr">${up ? 'Up' : 'Down'} </span>${Math.abs(k.delta).toFixed(1)}%</span>
        <span class="kpi-hint">${view.vs}</span>
      </div>
    </div>`;
}

let countRun = 0;
function countTo(el, from, to, delay, run) {
  el.textContent = fmt(to);
  if (from === to || reduced()) return;
  const t0 = performance.now() + delay;
  const tick = (now) => {
    if (run !== countRun) return;
    const t = Math.min(1, Math.max(0, (now - t0) / 700));
    el.textContent = fmt(Math.round(from + (to - from) * easeOut(t)));
    if (t < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function renderKpis(prev) {
  const row = document.getElementById('kpiRow');
  row.innerHTML = KPI_DEFS.map(kpiCard).join('');
  const run = ++countRun;
  /* Each figure counts from the value it is compared with (H1 2024, or the previous
     period on a switch), so the motion is the delta printed under it, never a count from zero. */
  row.querySelectorAll('.kpi-value').forEach((el, i) => {
    const key = el.dataset.k;
    const k = view.kpis[key];
    const before = prev ? prev.kpis[key].value : Math.round(k.value / (1 + k.delta / 100));
    countTo(el, before, k.value, prev ? 0 : 120 + i * 60, run);
  });
}

const READ_HINT = 'Select a month to read its income, expenses and net.';

function drawBars(delayMs) {
  const chart = document.getElementById('barChart');
  const net = state.mode === 'net';
  const months = view.months;
  const vals = net ? months.map((m) => m.income - m.expense) : months.flatMap((m) => [m.income, m.expense]);
  const max = Math.max(1, ...vals);
  const pctOf = (v) => (Math.max(0, v) / max * 100).toFixed(2) + '%';
  chart.style.setProperty('--n', months.length);
  chart.style.setProperty('--bar-delay', delayMs + 'ms');
  chart.classList.remove('has-sel');
  chart.innerHTML = `<span class="bar-scale" aria-hidden="true"><span>${fmtK(max)}</span></span>` + months.map((m, i) => {
    const label = net
      ? `${m.month}: net ${fmt(m.income - m.expense)}`
      : `${m.month}: income ${fmt(m.income)}, expenses ${fmt(m.expense)}`;
    const bars = net
      ? `<i class="bar net" style="--h:${pctOf(m.income - m.expense)}"></i>`
      : `<i class="bar income" style="--h:${pctOf(m.income)}"></i><i class="bar expense" style="--h:${pctOf(m.expense)}"></i>`;
    return `
    <button class="month" type="button" data-i="${i}" style="--d:${i}" aria-pressed="false" aria-label="${label}">
      <span class="month-pair${net ? ' single' : ''}">${bars}</span>
      <span class="month-name" aria-hidden="true">${m.month}</span>

  resetRead();
}

function resetRead() {
  const read = document.getElementById('month-read');
  read.classList.remove('is-set');
  if (read.textContent !== READ_HINT) read.textContent = READ_HINT;

function cashSvg(w, h, animate) {
  const vals = view.cash;
  const left = 50, right = 14, top = 30, bottom = 30;
  const floor = Math.floor(Math.min(...vals) / 10000) * 10000;
  const ceil = Math.ceil(Math.max(...vals) / 10000) * 10000;
  const span = (ceil - floor) || 1;
  const innerW = w - left - right;
  const innerH = h - top - bottom;
  const yOf = (v) => top + (1 - (v - floor) / span) * innerH;
  const pts = vals.map((v, i) => ({
    x: left + i * (innerW / (vals.length - 1)),
    y: yOf(v),
    v,
    month: view.months[i].month
  }));
  let curve = `M ${pts[0].x} ${pts[0].y}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i];
    const b = pts[i + 1];
    const cx = (a.x + b.x) / 2;
    curve += ` C ${cx} ${a.y}, ${cx} ${b.y}, ${b.x} ${b.y}`;
  }
  const base = h - bottom;
  const area = `${curve} L ${pts[pts.length - 1].x} ${base} L ${pts[0].x} ${base} Z`;
  const grids = [floor, (floor + ceil) / 2, ceil].map((val) => {
    const y = yOf(val);
    return `<line class="grid-line" x1="${left}" y1="${y}" x2="${w - right}" y2="${y}"/><text class="cash-scale" x="${left - 8}" y="${y + 4}" text-anchor="end">${fmtK(val)}</text>`;
  }).join('');
  const last = pts[pts.length - 1];
  const dots = pts.map((p, i) => `<g class="cash-pt${i === pts.length - 1 ? ' is-last' : ''}" tabindex="${i === pts.length - 1 ? 0 : -1}" role="img" aria-label="${p.month}: ${fmt(p.v)}" data-tip="${p.month}: ${fmt(p.v)}">
      <circle cx="${p.x}" cy="${p.y}" r="12" fill="transparent"></circle>
      <circle class="cash-ring" cx="${p.x}" cy="${p.y}" r="7"></circle>
      <circle class="cash-dot" cx="${p.x}" cy="${p.y}" r="${i === pts.length - 1 ? 3.4 : 2.4}"></circle>
    </g>`).join('');
  const labels = pts.map((p) => `<text class="axis-label" x="${p.x}" y="${h - 8}" text-anchor="middle" aria-hidden="true">${p.month}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" role="group" aria-label="Cash balance from ${fmt(pts[0].v)} in ${pts[0].month} to ${fmt(last.v)} in ${last.month}. Arrow keys step through the months.">
    <defs>
      <linearGradient id="cashGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#c4a574" stop-opacity=".22"/>
        <stop offset="100%" stop-color="#c4a574" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <g aria-hidden="true">${grids}${labels}</g>
    <path class="cash-area" d="${area}" aria-hidden="true"/>
    <path class="cash-line${animate === null ? '' : ' is-drawing'}" pathLength="1" d="${curve}"${animate === null ? '' : ` style="animation-delay:${animate}ms"`} aria-hidden="true"/>
    <text class="cash-last" x="${last.x - 8}" y="${last.y - 12}" text-anchor="end" aria-hidden="true">${fmt(last.v)}</text>
    ${dots}
  </svg>`;
}

let cashSize = '';
function drawCash(animateDelay) {
  const box = document.getElementById('cashChart');
  if (!box) return false;
  const w = Math.round(box.clientWidth);
  const h = Math.round(box.clientHeight);
  if (w < 80 || h < 80) return false;
  cashSize = w + 'x' + h;
  box.innerHTML = cashSvg(w, h, reduced() ? null : animateDelay);
  bindCashPoints();
  const first = view.cash[0];
  const last = view.cash[view.cash.length - 1];
  document.getElementById('cashFoot').innerHTML =
    `<span>${view.months[0].month} <b>${fmt(first)}</b> → ${view.months[view.months.length - 1].month} <b>${fmt(last)}</b></span><span>Change <b>${signed(last - first)}</b></span>`;
  return true;
}

function watchCash() {
  const box = document.getElementById('cashChart');
  if (!('ResizeObserver' in window)) { drawCash(400); return; }
  let firstDraw = true;
  let raf = 0;
  new ResizeObserver(() => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      if (Math.round(box.clientWidth) + 'x' + Math.round(box.clientHeight) === cashSize) return;
      if (drawCash(firstDraw ? 400 : null)) firstDraw = false;
    });
  }).observe(box);
}

function calendar() {
  const maxAmt = Math.max(...DATA.invoices.map((x) => x.amount));
  const end = CAL_FROM + CAL_DAYS;
  let monday = CAL_FROM;
  while ((monday - 2) % 7 !== 0) monday++;
  const weeks = [];
  for (let d = monday; d < end; d += 7) weeks.push(d);
  const weekMarks = weeks.map((d) => `<span class="cal-week" style="left:${calX(d)}" aria-hidden="true"><span>${dayLabel(d)}</span></span>`).join('');
  const dots = invoicesByDue.map((x, k) => {
    /* Area tracks the amount; the rows below are the keyboard path, so the dot is pointer-only. */
    const size = Math.max(10, Math.round(20 * Math.sqrt(x.amount / maxAmt)));
    return `<button type="button" class="cal-dot${x.late ? ' late' : ''}" data-num="${x.num}" aria-pressed="false" tabindex="-1" style="left:${calX(dayNo(x.due))}; --s:${size}px; --c:${STATUS[x.status].color}; --k:${k}" aria-label="${x.num}, ${x.client}, ${fmt(x.amount)}, due ${x.due}, ${dueIn(x.due)}"><span class="cal-amt" aria-hidden="true">${fmtK(x.amount)}</span></button>`;
  }).join('');
  const vat = DATA.kpis.vatDue;
  const vatMark = `<span class="cal-vat" style="left:${calX(dayNo(vat.due))}; --k:${invoicesByDue.length}"><span class="cal-amt">${fmtK(-vat.value)} VAT</span><span class="sr">, to remit on ${vat.due}</span></span>`;
  const byStatus = (s) => sumBy(DATA.invoices.filter((x) => x.status === s), (x) => x.amount);
  const key = ['overdue', 'sent', 'pending'].map((s) => `<span><i style="--c:${STATUS[s].color}"></i>${STATUS[s].label} <b>${fmt(byStatus(s))}</b></span>`).join('')
    + `<span><i class="vat" style="--c:var(--ink)"></i>VAT out <b>${fmt(vat.value)}</b></span>`;
  return `
    <div class="cal">
      <div class="cal-track" role="group" aria-label="Due dates from ${dayLabel(CAL_FROM)} to ${dayLabel(end)}, today ${DATA.asOf}">
        <span class="cal-past" style="width:${calX(TODAY)}" aria-hidden="true"></span>
        <span class="cal-line" aria-hidden="true"></span>
        ${weekMarks}
        <span class="cal-today" style="left:${calX(TODAY)}" aria-hidden="true"><span>Today</span></span>
        ${vatMark}
        ${dots}
      </div>
      <p class="cal-key">${key}</p>
    </div>`;
}

function bindCashPoints() {
  const tip = document.getElementById('chartTip');
  const place = (x, y) => {
    const w = tip.offsetWidth;
    tip.style.left = (x + w > window.innerWidth - 8 ? x - w - 24 : x) + 'px';
    tip.style.top = y + 'px';
  };
  const pts = [...document.querySelectorAll('#cashChart .cash-pt')];
  pts.forEach((node, i) => {
    /* One tab stop for the line; arrows, Home and End walk the months. */
    node.addEventListener('keydown', (event) => {
      const to = { ArrowRight: i + 1, ArrowUp: i + 1, ArrowLeft: i - 1, ArrowDown: i - 1, Home: 0, End: pts.length - 1 }[event.key];
      if (to === undefined) return;
      event.preventDefault();
      const next = pts[Math.max(0, Math.min(pts.length - 1, to))];
      pts.forEach((n) => n.setAttribute('tabindex', n === next ? '0' : '-1'));
      next.focus();
    });
    const on = () => {
      tip.textContent = node.dataset.tip;
      tip.classList.add('show');
      node.classList.add('is-on');
    };
    const off = () => {
      tip.classList.remove('show');
      node.classList.remove('is-on');
    };
    node.addEventListener('mouseenter', (event) => { on(); place(event.clientX + 12, event.clientY - 32); });
    node.addEventListener('mousemove', (event) => place(event.clientX + 12, event.clientY - 32));
    node.addEventListener('mouseleave', off);
    node.addEventListener('focus', () => {
      on();
      const r = node.querySelector('.cash-dot').getBoundingClientRect();
      place(r.right + 10, r.top - 34);
    });
    node.addEventListener('blur', off);
  });
}

function bindMonths() {
  const chart = document.getElementById('barChart');
  const read = document.getElementById('month-read');
  chart.addEventListener('click', (event) => {
    const btn = event.target.closest('.month');
    if (!btn) return;
    const wasOn = btn.getAttribute('aria-pressed') === 'true';
    chart.querySelectorAll('.month').forEach((node) => node.setAttribute('aria-pressed', 'false'));
    chart.classList.toggle('has-sel', !wasOn);
    if (wasOn) {
      resetRead();
      return;
    }
    btn.setAttribute('aria-pressed', 'true');
    const m = view.months[Number(btn.dataset.i)];
    read.classList.add('is-set');
    read.innerHTML = `${m.month} · income <b>${fmt(m.income)}</b> · expenses <b>${fmt(m.expense)}</b> · net <b>${fmt(m.income - m.expense)}</b>`;
  });
}

function bindChartMode() {
  const mode = document.getElementById('chart-mode');
  mode.addEventListener('click', (event) => {
    const tab = event.target.closest('.card-tab');
    if (!tab || tab.dataset.mode === state.mode) return;
    state.mode = tab.dataset.mode;
    mode.querySelectorAll('.card-tab').forEach((node) => node.setAttribute('aria-pressed', String(node === tab)));
    document.getElementById('flow-legend').hidden = state.mode === 'net';
    document.getElementById('net-legend').hidden = state.mode !== 'net';
    drawBars(0);
  });
}

function bindDonut() {
  const rows = [...document.querySelectorAll('.donut-row')];
  const arcs = [...document.querySelectorAll('.donut-arc')];
  const total = document.querySelector('.donut-total');
  const label = document.querySelector('.donut-lbl');
  let pinned = -1;
  const show = (index) => {
    arcs.forEach((arc, i) => arc.classList.toggle('is-dim', index > -1 && i !== index));
    rows.forEach((row, i) => row.classList.toggle('is-on', i === index));
    const item = DATA.expenses[index];
    total.textContent = fmtK(item ? item.amount : totalExpBreakdown);
    label.textContent = item ? item.name : 'Total expenses';
  };
  rows.forEach((row, i) => {
    row.addEventListener('mouseenter', () => show(i));
    row.addEventListener('focus', () => show(i));
    row.addEventListener('mouseleave', () => show(pinned));
    row.addEventListener('blur', () => show(pinned));
    row.addEventListener('click', () => {
      pinned = pinned === i ? -1 : i;
      rows.forEach((node, j) => node.setAttribute('aria-pressed', String(j === pinned)));
      show(i);
    });
  });
}

/* Calendar dot and invoice row point at each other: hover or focus previews, click pins. */
function bindInvoices() {
  const nodes = [...document.querySelectorAll('#invCard [data-num]')];
  let pinned = null;
  const show = (num) => nodes.forEach((node) => node.classList.toggle('is-on', node.dataset.num === num));
  nodes.forEach((node) => {
    const num = node.dataset.num;
    node.addEventListener('mouseenter', () => show(num));
    node.addEventListener('focus', () => show(num));
    node.addEventListener('mouseleave', () => show(pinned));
    node.addEventListener('blur', () => show(pinned));
    node.addEventListener('click', () => {
      pinned = pinned === num ? null : num;
      nodes.forEach((n) => n.setAttribute('aria-pressed', String(n.dataset.num === pinned)));
      show(num);
    });
  });
}

function setPeriod(key) {
  if (key === state.period || !PERIODS[key]) return;
  const prev = view;
  state.period = key;
  view = deriveView(key);
  const seg = document.getElementById('periodSeg');
  seg.style.setProperty('--seg', key === 'h1' ? 0 : 1);
  seg.querySelectorAll('.tb-seg').forEach((btn) => btn.setAttribute('aria-pressed', String(btn.dataset.period === key)));
  document.getElementById('kpiRow').classList.add('is-settled');
  renderKpis(prev);
  drawBars(0);
  cashSize = '';
  drawCash(0);
  updateCopy();
}

render();
renderKpis(null);
drawBars(340);
updateCopy();
watchCash();

document.getElementById('periodSeg').addEventListener('click', (event) => {
  const btn = event.target.closest('.tb-seg');
  if (btn) setPeriod(btn.dataset.period);
});

function showView(viewName) {
  document.querySelectorAll('[data-pane]').forEach((node) => {
    node.hidden = viewName !== 'dashboard' && !node.dataset.pane.split(' ').includes(viewName);
  });
  document.querySelectorAll('.kpi-row-sm, .grid-2-1, .grid-1-1').forEach((row) => {
    const panes = [...row.querySelectorAll('[data-pane]')];
    if (panes.length) row.hidden = panes.every((node) => node.hidden);
  });
  const title = document.querySelector('.tb-title');
  const names = { dashboard: 'Dashboard', invoices: 'Invoices', expenses: 'Expenses', cash: 'Cash', ledger: 'General ledger', vat: 'VAT and tax', customers: 'Customers', suppliers: 'Suppliers' };
  if (title) title.textContent = names[viewName] || 'Dashboard';
}

const navItems = [...document.querySelectorAll('.sb-item[data-view]')];
navItems.forEach((item) => {
  item.addEventListener('click', () => {
    navItems.forEach((node) => {
      node.classList.toggle('active', node === item);
      if (node === item) node.setAttribute('aria-current', 'page');
      else node.removeAttribute('aria-current');
    });
    showView(item.dataset.view);
  });
});

/* Export: try the download, and always show the rows so they can be copied. */
const exportBtn = document.getElementById('exportBtn');
const sheet = document.getElementById('exportSheet');
const sheetStatus = document.getElementById('sheetStatus');
const csvBox = document.getElementById('csvText');

function csvText() {
  const cell = (v) => (/[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v));
  const rows = [['Date', 'Counterparty', 'Category', 'Type', 'Amount']]
    .concat(DATA.transactions.map((tx) => [tx.date, tx.client, tx.cat, tx.type, tx.amount]));
  return rows.map((row) => row.map(cell).join(',')).join('\n');
}

/* A sandboxed preview frame without allow-downloads refuses the file silently: say so instead of trying. */
const canDownload = (() => {
  try {
    const frame = window.frameElement;
    return !(frame && frame.hasAttribute('sandbox') && !frame.sandbox.contains('allow-downloads'));
  } catch (err) {
    return false;
  }
})();

function openSheet() {
  const csv = csvText();
  const rows = DATA.transactions.length;
  csvBox.value = csv;
  sheetStatus.textContent = canDownload
    ? `${rows} rows, downloading now. They are also here to copy.`
    : `${rows} rows. Downloads are off in this preview, so copy them from here.`;
  sheet.hidden = false;
  exportBtn.setAttribute('aria-expanded', 'true');
  if (canDownload) {
    try {
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = 'ledgerstack-transactions.csv';
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch (err) {
      sheetStatus.textContent = `${rows} rows. The download did not start, so copy them from here.`;
    }
  }
  document.getElementById('csvCopy').focus();
}

function closeSheet(returnFocus) {
  if (sheet.hidden) return;
  sheet.hidden = true;
  exportBtn.setAttribute('aria-expanded', 'false');
  if (returnFocus) exportBtn.focus();
}

exportBtn.addEventListener('click', () => (sheet.hidden ? openSheet() : closeSheet(false)));
document.getElementById('sheetClose').addEventListener('click', () => closeSheet(true));
document.getElementById('csvCopy').addEventListener('click', () => {
  const done = (ok) => {
    sheetStatus.textContent = ok ? 'Copied to the clipboard.' : 'Rows selected: press Ctrl+C (⌘C on a Mac) to copy.';
  };
  const fallback = () => {
    csvBox.focus();
    csvBox.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    done(ok);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(csvBox.value).then(() => done(true), fallback);
  } else {
    fallback();
  }
});
document.addEventListener('pointerdown', (event) => {
  if (!sheet.hidden && !sheet.contains(event.target) && !exportBtn.contains(event.target)) closeSheet(false);
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && !sheet.hidden) closeSheet(true);
});

document.getElementById('newInvoiceBtn').addEventListener('click', () => {
  document.querySelector('.sb-item[data-view="invoices"]').click();
});

function mountLedgerEffects() {
  const word = document.getElementById('ledger-word');
  const script = document.createElement('script');
  script.src = '/effects/dist/effects.js';
  script.onload = () => {
    const fx = window.JobYouGoEffects;
    if (!fx) return;
    const paint = () => {
      if (word && fx.mountMetalWord) {
        fx.mountMetalWord(word, {
          text: 'LedgerStack',
          font: '600 24px/1 "Darker Grotesque", sans-serif',
          color: '#f6f1e7',
          theme: 'dark',
        });
      }
    };
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(paint);
    else paint();
  };
  document.head.appendChild(script);
}
mountLedgerEffects();
