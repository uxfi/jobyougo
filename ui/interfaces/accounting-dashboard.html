<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LedgerStack — IT Accounting</title>
<link rel="stylesheet" href="/ui/assets/fonts.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #efece4;
  --white:     #fffcf8;
  --border:    #e3ddd2;
  --t1:        #1a1814;
  --t2:        #6f6a62;
  --t3:        #9a948a;
  --teal:      #0e6b52;
  --teal-d:    #0a5340;
  --teal-l:    #e4f2eb;
  --teal-xl:   #f3faf6;
  --blue:      #3d5a80;
  --blue-l:    #e7eef6;
  --green:     #0e6b52;
  --green-l:   #e4f2eb;
  --red:       #b42318;
  --red-l:     #f8e8e6;
  --amber:     #8a5a12;
  --amber-l:   #f8efd8;
  --violet:    #6b5b4f;
  --violet-l:  #f0ebe4;
  --brass:     #c4a574;
  --ink:       #141210;
  --shadow:    0 1px 0 rgba(26,24,20,.04), 0 10px 28px rgba(26,24,20,.04);
  --shadow-lg: 0 16px 40px rgba(26,24,20,.08);
  --sidebar-w: 232px;
  --radius:    16px;
  --display:   var(--font-darker), "Arial Narrow", sans-serif;
  --ease:      cubic-bezier(.16, 1, .3, 1);
}

html, body {
  height: 100%;
  background: var(--bg);
  font-family: var(--font-inter), -apple-system, sans-serif;
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  color: var(--t1);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes growBar { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes drawLine { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes donutSpin { from { stroke-dasharray: 0 440; } to { stroke-dasharray: var(--dash) 440; } }

.app {
  display: flex;
  height: 100%;
  min-height: 0;
  overflow: hidden;
  gap: 12px;
  padding: 12px;
  background:
    radial-gradient(520px 420px at 0% 0%, rgba(196,165,116,.28), transparent 62%),
    var(--bg);
}

/* Sidebar — frosted glass rail */
.sidebar {
  position: relative;
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 16px 12px 12px;
  border-radius: 24px;
  color: #e7e1d6;
  background:
    linear-gradient(180deg, rgba(255,252,248,.1), rgba(255,252,248,.03)),
    rgba(22, 18, 14, .78);
  box-shadow: 0 18px 40px rgba(20,18,16,.18), inset 0 1px 0 rgba(255,252,248,.14);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  animation: fadeIn .35s ease both;
}
.sidebar::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(160deg, rgba(246,241,231,.55) 0%, rgba(196,165,116,.42) 38%, rgba(255,252,248,.08) 68%, rgba(196,165,116,.22) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  pointer-events: none;
}
.sb-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 6px 2px 2px;
}
.sb-logo-icon {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: rgba(255,252,248,.08);
  box-shadow: inset 0 0 0 1px rgba(196,165,116,.35);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.sb-logo-icon svg { width: 16px; height: 16px; }
.sb-brand { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.sb-logo-text {
  min-height: 22px;
  font-family: var(--display);
  font-size: 24px;
  font-weight: 600;
  color: #f6f1e7;
  letter-spacing: -.02em;
  line-height: 1;
}
.sb-badge {
  width: fit-content;
  padding: 1px 7px;
  border-radius: 999px;
  background: rgba(196,165,116,.16);
  font-family: var(--display);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0;
  color: #e7d3ae;
}
.sb-nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-height: 0;
  overflow: auto;
  padding-right: 2px;
}
.sb-section {
  font-family: var(--display);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0;
  text-transform: none;
  color: rgba(231,225,214,.46);
  padding: 12px 10px 4px;
}
.sb-item {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 36px;
  padding: 0 8px 0 6px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 500;
  color: #d9d2c6;
  cursor: pointer;
  border: 0;
  background: transparent;
  transition: background .16s ease, color .16s ease;
  animation: fadeUp .4s ease both;
  animation-delay: calc(var(--i, 0) * 45ms);
}
.sb-item svg {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
  opacity: .8;
}
.sb-item:hover { background: rgba(255,252,248,.06); color: #f6f1e7; }
.sb-item:focus-visible { outline: 1px solid #e7d3ae; outline-offset: 2px; }
.sb-item.active {
  background: rgba(255,252,248,.1);
  color: #f6f1e7;
  box-shadow: inset 0 0 0 1px rgba(196,165,116,.38);
}
.sb-item.active svg { opacity: 1; color: #e7d3ae; }
.sb-item .pill {
  margin-left: auto;
  font-family: var(--display);
  font-size: 13px;
  font-weight: 700;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 6px;
  background: rgba(180, 35, 24, .85);
  color: #fff;
  display: grid;
  place-items: center;
}
.sb-spacer { flex: 1; }
.sb-user {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: auto;
  padding: 8px;
  border-radius: 16px;
  background: rgba(255,252,248,.06);
  box-shadow: inset 0 0 0 1px rgba(255,252,248,.08);
}
.sb-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(196,165,116,.16);
  box-shadow: inset 0 0 0 1px rgba(196,165,116,.4);
  display: grid;
  place-items: center;
  font-family: var(--display);
  font-size: 13px;
  color: #e7d3ae;
}
.sb-user-name { font-size: 13px; font-weight: 600; color: #f6f1e7; }
.sb-user-role { font-size: 11px; color: #b7aea2; margin-top: 1px; }

/* Main */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
  min-height: 0;
  border-radius: 24px;
  background: rgba(255,252,248,.35);
}

.topbar {
  height: 52px;
  padding: 0 20px;
  background: rgba(255,252,248,.86);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
  animation: fadeIn .3s ease both;
}
.tb-title {
  font-family: var(--display);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -.02em;
  line-height: 1;
}
.tb-sub { font-size: 11px; color: var(--t2); margin-top: 1px; }
.tb-left { display: flex; flex-direction: column; }
.tb-period {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: 16px;
  padding: 0 12px;
  height: 28px;
  border: 0;
  border-radius: 4px;
  font-family: var(--display);
  font-size: 14px;
  font-weight: 600;
  color: var(--t1);
  background: rgba(26,24,20,.05);
}
.tb-period svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.tb-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: transform .12s, box-shadow .12s;
}
.tb-btn:active { transform: scale(.97); }
.tb-btn-ghost {
  background: rgba(255,252,248,.45);
  border: 1px solid var(--border);
  color: var(--t2);
}
.tb-btn-ghost:hover { border-color: var(--teal); color: var(--teal); }
.tb-btn-primary {
  height: 36px;
  padding: 0 12px 0 4px;
  gap: 8px;
  background: var(--ink);
  color: #f6f1e7;
  font-family: var(--display);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -.02em;
  line-height: 1;
}
.tb-btn-primary:hover { background: #2a241c; }
.tb-plus {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--brass);
  color: var(--ink);
  font-size: 18px;
  line-height: 1;
}
.tb-btn-primary:hover .tb-plus { background: #d7bc8e; }
.tb-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

.content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 20px 24px 40px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background:
    radial-gradient(900px 280px at 0% 0%, rgba(196,165,116,.16), transparent 60%),
    var(--bg);
}

/* KPI row */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
.kpi {
  background: rgba(255,252,248,.78);
  border-radius: var(--radius);
  padding: 16px 18px 15px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  animation: fadeUp .4s ease both;
  transition: box-shadow .18s, transform .18s;
}
.kpi:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
.kpi-hero {
  background: rgba(20,18,16,.88);
  border-color: transparent;
  color: #f6f1e7;
}
.kpi-hero .kpi-label,
.kpi-hero .kpi-hint { color: rgba(246,241,231,.62); }
.kpi-hero .kpi-value { color: #f6f1e7; }
.kpi-hero .kpi-icon.teal { background: rgba(196,165,116,.16); color: var(--brass); }
.kpi:nth-child(1) { animation-delay: .04s; }
.kpi:nth-child(2) { animation-delay: .08s; }
.kpi:nth-child(3) { animation-delay: .12s; }
.kpi:nth-child(4) { animation-delay: .16s; }
.kpi-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.kpi-label { font-size: 11.5px; font-weight: 500; color: var(--t2); }
.kpi-icon {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  display: grid;
  place-items: center;
}
.kpi-icon svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
.kpi-icon.teal { background: var(--teal-l); color: var(--teal); }
.kpi-icon.red { background: var(--red-l); color: var(--red); }
.kpi-icon.green { background: var(--green-l); color: var(--green); }
.kpi-icon.blue { background: var(--blue-l); color: var(--blue); }
.kpi-value {
  font-family: var(--display);
  font-size: 42px;
  font-weight: 650;
  letter-spacing: -.04em;
  line-height: 1;
  color: var(--t1);
  font-variant-numeric: tabular-nums;
}
.kpi-foot {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
  font-size: 11px;
}
.kpi-delta {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 4px;
}
.kpi-delta.up { background: var(--green-l); color: var(--green); }
.kpi-delta.down { background: var(--red-l); color: var(--red); }
.kpi-delta svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2.5; }
.kpi-hint { color: var(--t3); }

/* Secondary KPIs */
.kpi-row-sm {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0;
  background: rgba(255,252,248,.62);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
}
.kpi-sm {
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 4px 16px;
  animation: fadeUp .4s .18s ease both;
  border-left: 1px solid var(--border);
}
.kpi-sm:first-child { border-left: none; padding-left: 2px; }
.kpi-sm-label { font-size: 11px; color: var(--t3); font-weight: 500; margin-bottom: 4px; letter-spacing: .02em; }
.kpi-sm-value {
  font-family: var(--display);
  font-size: 28px;
  font-weight: 650;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.kpi-sm-sub { font-size: 11px; color: var(--t2); margin-top: 3px; }

/* Grid layout */
.kpi-row,
.kpi-row-sm,
.grid-2-1,
.grid-1-1,
.content > .card { flex: 0 0 auto; overflow: visible; }

.grid-2-1 {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
  gap: 14px;
  align-items: stretch;
}
.grid-2-1 > .card { height: 100%; }
.grid-1-1 {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 14px;
}
.grid-2-1:has(> [hidden]),
.grid-1-1:has(> [hidden]) { grid-template-columns: minmax(0, 1fr); }

.card {
  background: rgba(255,252,248,.7);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
  animation: fadeUp .45s .22s ease both;
  display: flex;
  flex-direction: column;
}
.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-shrink: 0;
}
.card-title {
  font-family: var(--display);
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -.03em;
  line-height: .95;
}
.card-sub { font-size: 11px; color: var(--t3); margin-top: 2px; }
.card-tabs {
  display: flex;
  gap: 4px;
  background: var(--bg);
  padding: 3px;
  border-radius: 999px;
}
.card-tab {
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--t2);
  cursor: pointer;
  border: none;
  background: transparent;
  transition: background .12s, color .12s;
}
.card-tab.active { background: var(--ink); color: #f6f1e7; }

/* Bar chart */
.chart-area { flex: 1; position: relative; min-height: 280px; }
.chart-legend {
  display: flex;
  gap: 16px;
  margin-bottom: 12px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--t2);
  font-weight: 500;
}
.legend-dot { width: 8px; height: 8px; border-radius: 2px; }
.bar-chart {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  align-items: end;
  gap: 16px;
  height: 248px;
  padding: 8px 4px 0;
  border-bottom: 1px solid var(--border);
}
.month {
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  align-items: end;
  gap: 8px;
  height: 100%;
  min-width: 0;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  color: inherit;
}
.month-pair {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 100%;
  width: 100%;
}
.month-pair.single { justify-content: center; }
.month-pair.single .bar { width: 46%; flex: none; }
.bar {
  flex: 1;
  height: var(--h);
  border-radius: 8px 8px 2px 2px;
  transform-origin: bottom center;
  animation: growBar .7s var(--ease) both;
  animation-delay: calc(var(--d, 0) * 60ms);
}
.month:hover .bar { filter: brightness(1.12); }
.month.is-on .month-name { color: var(--ink); }
.month.is-on .bar { box-shadow: inset 0 0 0 1.5px rgba(255,252,248,.7); }
.bar.income { background: linear-gradient(180deg, #1a1814, #3a342c); }
.bar.expense { background: linear-gradient(180deg, #e7d7b8, #c4a574); }
.bar.net { background: linear-gradient(180deg, #1f8a6a, var(--teal)); }
.month-name {
  font-family: var(--display);
  font-size: 16px;
  font-weight: 600;
  line-height: 1;
  color: var(--t3);
}
.month-read {
  min-height: 22px;
  margin-top: 12px;
  font-size: 13px;
  color: var(--t1);
}
.month-read b { font-family: var(--display); font-size: 18px; font-weight: 650; }

/* Cash flow line */
.cash-chart { flex: 1; min-height: 180px; display: flex; }
.cash-chart svg { width: 100%; height: 100%; min-height: 180px; display: block; }
.cash-line {
  fill: none;
  stroke: rgba(20,18,16,.55);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: drawLine 1.2s var(--ease) forwards;
}
.cash-area { fill: url(#cashGrad); }
.grid-line { stroke: rgba(26,24,20,.07); stroke-width: 1; stroke-dasharray: 1 5; }
.axis-label { font-family: var(--display); font-size: 13px; font-weight: 500; fill: rgba(111,106,98,.72); }
.cash-pt { cursor: pointer; }
.cash-dot {
  fill: rgba(20,18,16,.28);
  stroke: none;
  transition: r .16s var(--ease), fill .16s ease;
}
.cash-pt.is-last .cash-dot { fill: #fffcf8; stroke: rgba(20,18,16,.45); stroke-width: 1.25; }
.cash-pt:hover .cash-dot,
.cash-pt.is-on .cash-dot { fill: var(--ink); stroke: none; }
.cash-scale { font-family: var(--display); font-size: 11px; font-weight: 500; fill: rgba(111,106,98,.55); }
.cash-foot {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
  font-size: 12px;
  color: var(--t3);
}
.cash-foot b { font-weight: 600; color: var(--t2); }

/* Donut */
.donut-wrap {
  display: flex;
  align-items: center;
  gap: 20px;
  flex: 1;
}
.donut-chart {
  position: relative;
  width: 140px;
  height: 140px;
  flex-shrink: 0;
}
.donut-chart svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.donut-total {
  font-family: var(--display);
  font-size: 28px;
  font-weight: 650;
  letter-spacing: -.02em;
}
.donut-lbl { font-size: 10px; color: var(--t3); }
.donut-legend { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.donut-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  padding: 4px 6px;
  border-radius: 6px;
  cursor: pointer;
}
.donut-row:hover, .donut-row.is-on { background: var(--bg); }
.donut-chart circle { transition: opacity .15s ease; }
.donut-chart circle.is-dim { opacity: .28; }
.donut-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.donut-row-name { flex: 1; color: var(--t2); }
.donut-row-val { font-weight: 700; font-variant-numeric: tabular-nums; }
.donut-row-pct { font-size: 10px; color: var(--t3); width: 36px; text-align: right; }

/* Transactions table */
.tx-table { width: 100%; border-collapse: collapse; }
.tx-wrap { overflow: visible; }
.tx-table th {
  text-align: left;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--t3);
  padding: 0 10px 10px;
  border-bottom: 1px solid var(--border);
}
.tx-table td {
  padding: 11px 10px;
  font-size: 12px;
  border-bottom: 1px solid #f1f5f9;
  vertical-align: middle;
}
.tx-table tr:last-child td { border-bottom: none; }
.tx-table tr:hover td { background: var(--bg); }
.tx-type {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 10.5px;
  font-weight: 600;
}
.tx-type.in { background: var(--green-l); color: var(--green); }
.tx-type.out { background: var(--red-l); color: var(--red); }
.tx-amount { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.tx-amount.pos { color: var(--green); }
.tx-amount.neg { color: var(--red); }
.tx-client { font-weight: 600; }
.tx-cat { font-size: 11px; color: var(--t3); }

/* Invoices */
.inv-list { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.inv-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-radius: 11px;
  transition: border-color .14s, box-shadow .14s;
}
.inv-item:hover { border-color: var(--teal); box-shadow: 0 2px 12px rgba(13,148,136,.08); }
.inv-item.overdue { border-color: #efc8c2; background: #fff8f6; }
.inv-num {
  font-family: var(--display);
  font-size: 13px;
  color: var(--t1);
  min-width: 108px;
}
.inv-client { flex: 1; min-width: 0; }
.inv-client-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.inv-due { font-size: 10px; color: var(--t3); margin-top: 1px; }
.inv-due.late { color: var(--red); font-weight: 600; }
.inv-amt { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.inv-status {
  font-size: 12px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 4px;
}
.inv-status.pending { background: var(--amber-l); color: var(--amber); }
.inv-status.sent { background: var(--blue-l); color: var(--blue); }
.inv-status.overdue { background: var(--red-l); color: var(--red); }

/* Tooltip */
.chart-tip {
  position: fixed;
  pointer-events: none;
  background: var(--t1);
  color: #f8fafc;
  font-size: 11px;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 8px;
  opacity: 0;
  transition: opacity .12s;
  z-index: 100;
  white-space: nowrap;
}
.chart-tip.show { opacity: 1; }

.cash-fig {
  width: 188px;
  flex: 0 0 auto;
  margin: -8px 0 -12px;
  --hairline-plate: transparent;
  --hairline-hi: #1a1814;
  --hairline-edge: #8a8378;
  --hairline-mid: #0e6b52;
  --hairline-lo: #c4a574;
  --hairline-stroke: 1.05;
}

[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .bar { transform: none; }
  .cash-line { stroke-dashoffset: 0; }
}
</style>
</head>
<body>

    </div>

    <div class="sb-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>

          Export

<div class="chart-tip" id="chartTip"></div>

<script>
const fmt = (n) => new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n);
const fmtK = (n) => n >= 1000 ? (n / 1000).toFixed(1).replace('.0', '') + 'k €' : fmt(n);
const pct = (n) => (n >= 0 ? '+' : '') + n.toFixed(1) + '%';

const DATA = {
  company: 'HexaNode SAS',
  period: 'Jan — Jun 2025',
  kpis: {
    revenue:      { value: 487200, delta: 14.2, label: 'Revenue' },
    expenses:     { value: 312800, delta: 8.6, label: 'Total expenses' },
    netProfit:    { value: 174400, delta: 22.8, label: 'Net profit' },
    cash:         { value: 89400,  delta: -3.2, label: 'Cash' },
    receivables:  { value: 42800,  sub: '4 invoices pending' },
    payables:     { value: 18600,  sub: 'Due in under 30 days' },
    grossMargin:  { value: 64.2,   sub: 'Gross margin' },
    vatDue:       { value: 12400,  sub: 'VAT to remit' }
  },
  monthly: [
    { month: 'Jan', income: 62000, expense: 48000 },
    { month: 'Feb', income: 71000, expense: 52000 },
    { month: 'Mar', income: 78000, expense: 54000 },
    { month: 'Apr', income: 85000, expense: 51000 },
    { month: 'May', income: 92000, expense: 56000 },
    { month: 'Jun', income: 99200, expense: 51800 }
  ],
  cashFlow: [72000, 68500, 74200, 79800, 83100, 89400],
  expenses: [
    { name: 'Salaries and charges', amount: 168000, color: '#1a1814' },
    { name: 'Cloud and infra', amount: 38400, color: '#0e6b52' },
    { name: 'SaaS tools', amount: 28600, color: '#c4a574' },
    { name: 'Offices', amount: 22400, color: '#8a9a7b' },
    { name: 'Marketing', amount: 18200, color: '#b85c38' },
    { name: 'Other', amount: 37200, color: '#c8c0b4' }
  ],
  transactions: [
    { date: '28 Jun', client: 'DataFlow GmbH', cat: 'Development', type: 'in', amount: 18500 },
    { date: '27 Jun', client: 'AWS Europe', cat: 'Cloud and hosting', type: 'out', amount: -4200 },
    { date: '26 Jun', client: 'ScaleUp Ventures', cat: 'SaaS maintenance', type: 'in', amount: 6800 },
    { date: '25 Jun', client: 'Figma Inc.', cat: 'Design tools', type: 'out', amount: -890 },
    { date: '24 Jun', client: 'NeoBank SA', cat: 'Security audit', type: 'in', amount: 12400 },
    { date: '23 Jun', client: 'WeWork', cat: 'Offices', type: 'out', amount: -3200 }
  ],
  invoices: [
    { num: 'FAC-2025-042', client: 'DataFlow GmbH', amount: 18500, due: '5 Jul', status: 'sent' },
    { num: 'FAC-2025-038', client: 'TechBridge AS', amount: 9200, due: '20 Jun', status: 'overdue', late: true },
    { num: 'FAC-2025-035', client: 'CloudNine Ltd', amount: 7600, due: '10 Jul', status: 'pending' },
    { num: 'FAC-2025-031', client: 'StartupLab', amount: 7500, due: '15 Jul', status: 'pending' }
  ]
};

const maxBar = Math.max(...DATA.monthly.flatMap(m => [m.income, m.expense]));
const totalExpBreakdown = DATA.expenses.reduce((s, e) => s + e.amount, 0);

function flowBars() {
  return DATA.monthly.map((m, i) => `
    <button class="month" type="button" data-i="${i}" style="--d:${i}" aria-pressed="false">
      <span class="month-pair">
        <i class="bar income" style="--h:${(m.income / maxBar) * 100}%"></i>
        <i class="bar expense" style="--h:${(m.expense / maxBar) * 100}%"></i>
      </span>
      <span class="month-name">${m.month}</span>
    </button>`).join('');
}

function netBars() {
  const nets = DATA.monthly.map((m) => m.income - m.expense);
  const max = Math.max(...nets);
  return DATA.monthly.map((m, i) => `
    <button class="month" type="button" data-i="${i}" style="--d:${i}" aria-pressed="false">
      <span class="month-pair single">
        <i class="bar net" style="--h:${(nets[i] / max) * 100}%"></i>
      </span>
      <span class="month-name">${m.month}</span>
    </button>`).join('');
}

function cashSvg() {
  const w = 640;
  const h = 220;
  const left = 58;
  const right = 12;
  const top = 16;
  const bottom = 32;
  const vals = DATA.cashFlow;
  const min = Math.min(...vals);
  const max = Math.max(...vals);
  const span = (max - min) || 1;
  const innerW = w - left - right;
  const innerH = h - top - bottom;
  const pts = vals.map((v, i) => ({
    x: left + i * (innerW / (vals.length - 1)),
    y: top + (1 - (v - min) / span) * innerH,
    v,
    month: DATA.monthly[i].month,
  }));
  let curve = `M ${pts[0].x} ${pts[0].y}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i];
    const b = pts[i + 1];
    const cx = (a.x + b.x) / 2;
    curve += ` C ${cx} ${a.y}, ${cx} ${b.y}, ${b.x} ${b.y}`;
  }
  const base = h - bottom;
  const area = `${curve} L ${pts[pts.length - 1].x} ${base} L ${pts[0].x} ${base} Z`;
  const grids = [0, 1].map((t) => {
    const y = top + (1 - t) * innerH;
    const label = fmtK(min + t * (max - min));
    return `<line class="grid-line" x1="${left}" y1="${y}" x2="${w - right}" y2="${y}"/><text class="cash-scale" x="${left - 8}" y="${y + 4}" text-anchor="end">${label}</text>`;
  }).join('');
  const dots = pts.map((p, i) => `<g class="cash-pt${i === pts.length - 1 ? ' is-last' : ''}" data-tip="${p.month}: ${fmt(p.v)}">
      <circle cx="${p.x}" cy="${p.y}" r="12" fill="transparent"></circle>
      <circle class="cash-dot" cx="${p.x}" cy="${p.y}" r="${i === pts.length - 1 ? 3.2 : 2.2}"></circle>
    </g>`).join('');
  const labels = pts.map((p) => `<text class="axis-label" x="${p.x}" y="${h - 8}" text-anchor="middle">${p.month}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Cash balance from ${fmt(pts[0].v)} in ${pts[0].month} to ${fmt(pts[pts.length - 1].v)} in ${pts[pts.length - 1].month}">
    <defs>
      <linearGradient id="cashGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#c4a574" stop-opacity=".22"/>
        <stop offset="100%" stop-color="#c4a574" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${grids}${labels}
    <path class="cash-area" d="${area}"/>
    <path class="cash-line" pathLength="1" d="${curve}"/>
    ${dots}
  </svg>`;
}

function kpiCard(key, icon, cls, invertDelta) {
  const k = DATA.kpis[key];
  const up = k.delta >= 0;
  const good = invertDelta ? !up : up;
  const deltaCls = good ? 'up' : 'down';
  const arrow = up
    ? '<svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>'
    : '<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>';
  const hero = key === 'revenue' ? ' kpi-hero' : '';
  return `
    <div class="kpi${hero}">
      <div class="kpi-head">
        <span class="kpi-label">${k.label}</span>
        <div class="kpi-icon ${cls}">${icon}</div>
      </div>
      <div class="kpi-value">${key === 'grossMargin' ? k.value + '%' : fmt(k.value)}</div>
      ${k.delta !== undefined ? `
      <div class="kpi-foot">
        <span class="kpi-delta ${deltaCls}">${arrow}${pct(Math.abs(k.delta))}</span>
        <span class="kpi-hint">vs. S1 2024</span>
      </div>` : ''}
    </div>`;
}

function render() {
  const el = document.getElementById('dashboard');
  const donutArcs = DATA.expenses.map((e, i) => {
    const pctVal = (e.amount / totalExpBreakdown) * 100;
    const circumference = 2 * Math.PI * 62;
    const dash = (pctVal / 100) * circumference;
    const offset = DATA.expenses.slice(0, i).reduce((s, x) => s + (x.amount / totalExpBreakdown) * circumference, 0);
    return `<circle cx="75" cy="75" r="62" fill="none" stroke="${e.color}" stroke-width="18"
      stroke-dasharray="${dash} ${circumference}" stroke-dashoffset="${-offset}"
      style="--dash:${dash}; animation: donutSpin .8s ${.1 + i * .08}s ease both"/>`;
  }).join('');

  el.innerHTML = `
    <div class="kpi-row" data-pane="dashboard">
      ${kpiCard('revenue', '<svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>', 'teal')}
      ${kpiCard('expenses', '<svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>', 'red', true)}
      ${kpiCard('netProfit', '<svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>', 'green')}
      ${kpiCard('cash', '<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>', 'blue', true)}
    </div>

    <div class="kpi-row-sm">
      <div class="kpi-sm" data-pane="dashboard customers"><div class="kpi-sm-label">Customer receivables</div><div class="kpi-sm-value">${fmt(DATA.kpis.receivables.value)}</div><div class="kpi-sm-sub">${DATA.kpis.receivables.sub}</div></div>
      <div class="kpi-sm" data-pane="dashboard suppliers"><div class="kpi-sm-label">Supplier payables</div><div class="kpi-sm-value">${fmt(DATA.kpis.payables.value)}</div><div class="kpi-sm-sub">${DATA.kpis.payables.sub}</div></div>
      <div class="kpi-sm" data-pane="dashboard"><div class="kpi-sm-label">Gross margin</div><div class="kpi-sm-value">${DATA.kpis.grossMargin.value}%</div><div class="kpi-sm-sub">Target: 60%</div></div>
      <div class="kpi-sm" data-pane="dashboard vat"><div class="kpi-sm-label">VAT to remit</div><div class="kpi-sm-value">${fmt(DATA.kpis.vatDue.value)}</div><div class="kpi-sm-sub">Due 24 Jul</div></div>
    </div>

    <div class="grid-2-1">
      <div class="card" data-pane="dashboard expenses">
        <div class="card-head">
          <div>
            <div class="card-title">Income vs expenses</div>
            <div class="card-sub">Monthly comparison — overall inflows and outflows</div>
          </div>
          <div class="card-tabs" id="chart-mode">
            <button class="card-tab active" type="button" data-mode="flow">Income & expenses</button>
            <button class="card-tab" type="button" data-mode="net">Net by month</button>
          </div>
        </div>
        <div class="chart-legend" id="flow-legend">
          <span class="legend-item"><span class="legend-dot" style="background:#1a1814"></span>Income</span>
          <span class="legend-item"><span class="legend-dot" style="background:#c4a574"></span>Expenses</span>
        </div>
        <div class="chart-legend" id="net-legend" hidden>
          <span class="legend-item"><span class="legend-dot" style="background:var(--teal)"></span>Net, income minus expenses</span>
        </div>
        <div class="chart-area">
          <div class="bar-chart" id="barChart">${flowBars()}</div>
          <div class="month-read" id="month-read" hidden></div>
        </div>
      </div>

      <div class="card" data-pane="dashboard cash">
        <div class="card-head">
          <div>
            <div class="card-title">Cash trend</div>
            <div class="card-sub">Cumulative bank balance</div>
          </div>
          <div class="hairline-fig cash-fig" data-hairline="vault" data-hairline-theme="light" data-intensity="0.5" role="img" aria-label="Wireframe vault"></div>
        </div>
        <div class="cash-chart">${cashSvg()}</div>
        <div class="cash-foot">
          <span>Start <b>${fmt(DATA.cashFlow[0])}</b></span>
          <span>Now <b>${fmt(DATA.cashFlow[DATA.cashFlow.length - 1])}</b></span>
        </div>
      </div>
    </div>

    <div class="grid-1-1">
      <div class="card" data-pane="expenses">
        <div class="card-head">
          <div>
            <div class="card-title">Expense breakdown</div>
            <div class="card-sub">By category — H1 2025</div>
          </div>
        </div>
        <div class="donut-wrap">
          <div class="donut-chart">
            <svg viewBox="0 0 150 150">${donutArcs}</svg>
            <div class="donut-center">
              <div class="donut-total">${fmtK(totalExpBreakdown)}</div>
              <div class="donut-lbl">Total expenses</div>
            </div>
          </div>
          <div class="donut-legend">
            ${DATA.expenses.map((e, i) => `
              <div class="donut-row" data-i="${i}" style="animation: fadeUp .4s ${0.08 + i * 0.05}s ease both">
                <span class="donut-swatch" style="background:${e.color}"></span>
                <span class="donut-row-name">${e.name}</span>
                <span class="donut-row-pct">${(e.amount / totalExpBreakdown * 100).toFixed(0)}%</span>
                <span class="donut-row-val">${fmtK(e.amount)}</span>
              </div>
            `).join('')}
          </div>
        </div>
      </div>

      <div class="card" data-pane="invoices customers">
        <div class="card-head">
          <div>
            <div class="card-title">Open invoices</div>
            <div class="card-sub">Receivables to collect</div>
          </div>
        </div>
        <div class="inv-list">
          ${DATA.invoices.map(inv => `
            <div class="inv-item${inv.late ? ' overdue' : ''}" style="animation: fadeUp .4s ${DATA.invoices.indexOf(inv) * 0.05}s ease both">
              <span class="inv-num">${inv.num}</span>
              <div class="inv-client">
                <div class="inv-client-name">${inv.client}</div>
                <div class="inv-due${inv.late ? ' late' : ''}">Due ${inv.due}${inv.late ? ' · Late' : ''}</div>
              </div>
              <span class="inv-amt">${fmt(inv.amount)}</span>
              <span class="inv-status ${inv.status}">${inv.status === 'overdue' ? 'Overdue' : inv.status === 'sent' ? 'Sent' : 'Pending'}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>

    <div class="card" data-pane="dashboard ledger" style="animation-delay:.32s">
      <div class="card-head">
        <div>
          <div class="card-title">Latest transactions</div>
          <div class="card-sub">Recent inflows and outflows</div>
        </div>
      </div>
      <div class="tx-wrap">
      <table class="tx-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Category</th>
            <th>Type</th>
            <th style="text-align:right">Amount</th>
          </tr>
        </thead>
        <tbody>
          ${DATA.transactions.map(tx => `
            <tr style="animation: fadeUp .4s ${DATA.transactions.indexOf(tx) * 0.04}s ease both">
              <td style="color:var(--t3)">${tx.date}</td>
              <td class="tx-client">${tx.client}</td>
              <td class="tx-cat">${tx.cat}</td>
              <td><span class="tx-type ${tx.type}">${tx.type === 'in' ? 'In' : 'Out'}</span></td>
              <td class="tx-amount ${tx.amount > 0 ? 'pos' : 'neg'}">${tx.amount > 0 ? '+' : ''}${fmt(Math.abs(tx.amount))}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;

  bindTooltips();
  bindMonths();
  bindChartMode();
  bindDonut();
  if (typeof window.mountHairlines === 'function') window.mountHairlines(el);
}

function bindTooltips() {
  const tip = document.getElementById('chartTip');
  document.querySelectorAll('.cash-pt[data-tip]').forEach((node) => {
    node.addEventListener('mouseenter', () => {
      tip.textContent = node.dataset.tip;
      tip.classList.add('show');
      node.classList.add('is-on');
    });
    node.addEventListener('mousemove', (event) => {
      tip.style.left = (event.clientX + 12) + 'px';
      tip.style.top = (event.clientY - 32) + 'px';
    });
    node.addEventListener('mouseleave', () => {
      tip.classList.remove('show');
      node.classList.remove('is-on');
    });
  });
}

function bindMonths() {
  const read = document.getElementById('month-read');
  document.querySelectorAll('.month').forEach((btn) => {
    btn.addEventListener('click', () => {
      const on = btn.classList.contains('is-on');
      document.querySelectorAll('.month').forEach((node) => {
        node.classList.remove('is-on');
        node.setAttribute('aria-pressed', 'false');
      });
      if (on) {
        read.hidden = true;
        return;
      }
      btn.classList.add('is-on');
      btn.setAttribute('aria-pressed', 'true');
      const month = DATA.monthly[Number(btn.dataset.i)];
      const net = month.income - month.expense;
      read.hidden = false;
      read.innerHTML = `${month.month} · income <b>${fmt(month.income)}</b> · expenses <b>${fmt(month.expense)}</b> · net <b>${fmt(net)}</b>`;
    });
  });
}

function bindChartMode() {
  const mode = document.getElementById('chart-mode');
  if (!mode) return;
  mode.addEventListener('click', (event) => {
    const tab = event.target.closest('.card-tab');
    if (!tab) return;
    mode.querySelectorAll('.card-tab').forEach((node) => node.classList.toggle('active', node === tab));
    const chart = document.getElementById('barChart');
    chart.innerHTML = tab.dataset.mode === 'net' ? netBars() : flowBars();
    document.getElementById('flow-legend').hidden = tab.dataset.mode === 'net';
    document.getElementById('net-legend').hidden = tab.dataset.mode !== 'net';
    document.getElementById('month-read').hidden = true;
    bindMonths();
  });
}

function bindDonut() {
  const rows = document.querySelectorAll('.donut-row');
  const arcs = document.querySelectorAll('.donut-chart circle');
  const total = document.querySelector('.donut-total');
  const label = document.querySelector('.donut-lbl');
  rows.forEach((row) => {
    row.addEventListener('mouseenter', () => {
      const index = Number(row.dataset.i);
      arcs.forEach((arc, i) => arc.classList.toggle('is-dim', i !== index));
      rows.forEach((node) => node.classList.toggle('is-on', node === row));
      const item = DATA.expenses[index];
      total.textContent = fmtK(item.amount);
      label.textContent = item.name;
    });
    row.addEventListener('mouseleave', () => {
      arcs.forEach((arc) => arc.classList.remove('is-dim'));
      rows.forEach((node) => node.classList.remove('is-on'));
      total.textContent = fmtK(totalExpBreakdown);
      label.textContent = 'Total expenses';
    });
  });
}

document.getElementById('periodLabel').textContent = DATA.period;
render();

function showView(view) {
  document.querySelectorAll('[data-pane]').forEach((node) => {
    node.hidden = view !== 'dashboard' && !node.dataset.pane.split(' ').includes(view);
  });
  document.querySelectorAll('.kpi-row-sm, .grid-2-1, .grid-1-1').forEach((row) => {
    const panes = [...row.querySelectorAll('[data-pane]')];
    if (panes.length) row.hidden = panes.every((node) => node.hidden);
  });
  const title = document.querySelector('.tb-title');
  const names = { dashboard: 'Accounting view', invoices: 'Invoices', expenses: 'Expenses', cash: 'Cash', ledger: 'General ledger', vat: 'VAT and tax', customers: 'Customers', suppliers: 'Suppliers' };
  if (title) title.textContent = names[view] || 'Accounting view';
}

document.querySelectorAll('.sb-item[data-view]').forEach((item) => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.sb-item').forEach((node) => node.classList.remove('active'));
    item.classList.add('active');
    showView(item.dataset.view);
  });
});

document.querySelector('.tb-btn-ghost').addEventListener('click', () => {
  const lines = ['Date,Description,Category,Type,Amount'];
  DATA.transactions.forEach((tx) => {
    lines.push([tx.date, tx.client, tx.cat, tx.type, tx.amount].join(','));
  });
  const file = new Blob([lines.join('\n')], { type: 'text/csv' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(file);
  link.download = 'ledgerstack-transactions.csv';
  link.click();
  URL.revokeObjectURL(link.href);
});

document.getElementById('newInvoiceBtn').addEventListener('click', () => {
  document.querySelector('.sb-item[data-view="invoices"]').click();
});

function mountLedgerEffects() {
  const word = document.getElementById('ledger-word');
  const script = document.createElement('script');
  script.src = '/effects/dist/effects.js';
  script.onload = () => {
    const fx = window.JobYouGoEffects;
    if (!fx) return;
    const paint = () => {
      if (word && fx.mountMetalWord) {
        fx.mountMetalWord(word, {
          text: 'LedgerStack',
          font: '600 28px/1 "Darker Grotesque", sans-serif',
          color: '#f6f1e7',
          theme: 'dark',
        });
      }
    };
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(paint);
    else paint();
  };
  document.head.appendChild(script);
}
mountLedgerEffects();
</script>
<script type="module" src="/effects/dist/landing-figures.js"></script>
</body>
</html>
