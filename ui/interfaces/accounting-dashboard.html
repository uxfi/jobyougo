<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LedgerStack — Comptabilité IT</title>
<link rel="stylesheet" href="/ui/assets/fonts.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #f4f6f9;
  --white:     #ffffff;
  --border:    #e2e8f0;
  --t1:        #0f172a;
  --t2:        #64748b;
  --t3:        #94a3b8;
  --teal:      #0d9488;
  --teal-d:    #0f766e;
  --teal-l:    #ccfbf1;
  --teal-xl:   #f0fdfa;
  --blue:      #3b82f6;
  --blue-l:    #dbeafe;
  --green:     #059669;
  --green-l:   #d1fae5;
  --red:       #dc2626;
  --red-l:     #fee2e2;
  --amber:     #d97706;
  --amber-l:   #fef3c7;
  --violet:    #7c3aed;
  --violet-l:  #ede9fe;
  --shadow:    0 1px 3px rgba(15,23,42,.05), 0 4px 20px rgba(15,23,42,.04);
  --shadow-lg: 0 8px 32px rgba(15,23,42,.08);
  --sidebar-w: 220px;
  --radius:    14px;
}

html, body {
  height: 100%;
  background: var(--bg);
  font-family: var(--font-inter), -apple-system, sans-serif;
  font-size: 13px;
  color: var(--t1);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes growBar { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes drawLine { from { stroke-dashoffset: 800; } to { stroke-dashoffset: 0; } }
@keyframes donutSpin { from { stroke-dasharray: 0 440; } to { stroke-dasharray: var(--dash) 440; } }

.app { display: flex; height: 100vh; overflow: hidden; }

/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--t1);
  color: #cbd5e1;
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
  animation: fadeIn .35s ease both;
}
.sb-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 6px 22px;
}
.sb-logo-icon {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--teal), #14b8a6);
  display: grid;
  place-items: center;
  box-shadow: 0 6px 18px rgba(13,148,136,.35);
}
.sb-logo-icon svg { width: 17px; height: 17px; }
.sb-logo-text { font-size: 15px; font-weight: 700; color: #f8fafc; letter-spacing: -.02em; }
.sb-logo-text span { color: #5eead4; }
.sb-badge {
  margin-left: auto;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 6px;
  background: rgba(94,234,212,.12);
  color: #5eead4;
}

.sb-section {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: #475569;
  padding: 12px 8px 6px;
}
.sb-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 10px;
  font-size: 12.5px;
  font-weight: 500;
  color: #94a3b8;
  cursor: pointer;
  transition: background .14s, color .14s;
}
.sb-item svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
.sb-item:hover { background: rgba(255,255,255,.06); color: #e2e8f0; }
.sb-item.active { background: rgba(13,148,136,.18); color: #5eead4; font-weight: 600; }
.sb-item .pill {
  margin-left: auto;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 20px;
  background: var(--red);
  color: #fff;
}
.sb-spacer { flex: 1; }
.sb-user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 10px;
  margin-top: 8px;
  border-top: 1px solid rgba(255,255,255,.08);
}
.sb-avatar {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: linear-gradient(135deg, #334155, #1e293b);
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 700;
  color: #5eead4;
}
.sb-user-name { font-size: 12px; font-weight: 600; color: #f1f5f9; }
.sb-user-role { font-size: 10px; color: #64748b; margin-top: 1px; }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

.topbar {
  height: 58px;
  padding: 0 22px;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
  animation: fadeIn .3s ease both;
}
.tb-title { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
.tb-sub { font-size: 12px; color: var(--t2); margin-top: 1px; }
.tb-left { display: flex; flex-direction: column; }
.tb-period {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: 16px;
  padding: 0 12px;
  height: 34px;
  border: 1px solid var(--border);
  border-radius: 9px;
  font-size: 12px;
  font-weight: 500;
  color: var(--t2);
  cursor: pointer;
  background: var(--bg);
}
.tb-period svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.tb-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 14px;
  border-radius: 9px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: transform .12s, box-shadow .12s;
}
.tb-btn:active { transform: scale(.97); }
.tb-btn-ghost {
  background: var(--white);
  border: 1px solid var(--border);
  color: var(--t2);
}
.tb-btn-ghost:hover { border-color: var(--teal); color: var(--teal); }
.tb-btn-primary {
  background: var(--teal);
  color: #fff;
  box-shadow: 0 4px 14px rgba(13,148,136,.28);
}
.tb-btn-primary:hover { background: var(--teal-d); }
.tb-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

.content {
  flex: 1;
  overflow-y: auto;
  padding: 18px 22px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* KPI row */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.kpi {
  background: var(--white);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow);
  border: 1px solid transparent;
  animation: fadeUp .4s ease both;
  transition: box-shadow .18s, border-color .18s;
}
.kpi:hover { box-shadow: var(--shadow-lg); border-color: var(--border); }
.kpi:nth-child(1) { animation-delay: .04s; }
.kpi:nth-child(2) { animation-delay: .08s; }
.kpi:nth-child(3) { animation-delay: .12s; }
.kpi:nth-child(4) { animation-delay: .16s; }
.kpi-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.kpi-label { font-size: 11.5px; font-weight: 500; color: var(--t2); }
.kpi-icon {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  display: grid;
  place-items: center;
}
.kpi-icon svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
.kpi-icon.teal { background: var(--teal-l); color: var(--teal); }
.kpi-icon.red { background: var(--red-l); color: var(--red); }
.kpi-icon.green { background: var(--green-l); color: var(--green); }
.kpi-icon.blue { background: var(--blue-l); color: var(--blue); }
.kpi-value {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -.03em;
  color: var(--t1);
  font-variant-numeric: tabular-nums;
}
.kpi-foot {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
  font-size: 11px;
}
.kpi-delta {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 20px;
}
.kpi-delta.up { background: var(--green-l); color: var(--green); }
.kpi-delta.down { background: var(--red-l); color: var(--red); }
.kpi-delta svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2.5; }
.kpi-hint { color: var(--t3); }

/* Secondary KPIs */
.kpi-row-sm {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.kpi-sm {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  animation: fadeUp .4s .18s ease both;
}
.kpi-sm-label { font-size: 10.5px; color: var(--t3); font-weight: 500; margin-bottom: 4px; }
.kpi-sm-value { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi-sm-sub { font-size: 10px; color: var(--t2); margin-top: 2px; }

/* Grid layout */
.grid-2-1 {
  display: grid;
  grid-template-columns: 1.55fr 1fr;
  gap: 14px;
  min-height: 280px;
}
.grid-1-1 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.card {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
  animation: fadeUp .45s .22s ease both;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-shrink: 0;
}
.card-title { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
.card-sub { font-size: 11px; color: var(--t3); margin-top: 2px; }
.card-tabs {
  display: flex;
  gap: 4px;
  background: var(--bg);
  padding: 3px;
  border-radius: 8px;
}
.card-tab {
  padding: 5px 11px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--t2);
  cursor: pointer;
  border: none;
  background: transparent;
  transition: background .12s, color .12s;
}
.card-tab.active { background: var(--white); color: var(--t1); box-shadow: 0 1px 4px rgba(0,0,0,.06); }

/* Bar chart */
.chart-area { flex: 1; position: relative; min-height: 200px; }
.chart-legend {
  display: flex;
  gap: 16px;
  margin-bottom: 12px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--t2);
  font-weight: 500;
}
.legend-dot { width: 8px; height: 8px; border-radius: 3px; }
.bar-chart {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  height: 180px;
  padding: 0 4px;
  gap: 6px;
}
.bar-group {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  height: 100%;
  justify-content: flex-end;
}
.bar-pair {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 100%;
  width: 100%;
  justify-content: center;
}
.bar {
  width: 42%;
  border-radius: 5px 5px 2px 2px;
  transform-origin: bottom;
  animation: growBar .6s cubic-bezier(.34,1.2,.64,1) both;
  cursor: pointer;
  transition: opacity .12s;
}
.bar:hover { opacity: .8; }
.bar.income { background: linear-gradient(180deg, #14b8a6, var(--teal)); }
.bar.expense { background: linear-gradient(180deg, #f87171, var(--red)); }
.bar-label { font-size: 10px; color: var(--t3); font-weight: 500; }

/* Cash flow line */
.cash-chart { flex: 1; min-height: 160px; }
.cash-chart svg { width: 100%; height: 160px; overflow: visible; }
.cash-line {
  fill: none;
  stroke: var(--teal);
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 800;
  animation: drawLine 1.4s ease forwards;
}
.cash-area {
  fill: url(#cashGrad);
  opacity: .35;
}
.grid-line { stroke: var(--border); stroke-width: 1; }
.axis-label { font-size: 10px; fill: var(--t3); }

/* Donut */
.donut-wrap {
  display: flex;
  align-items: center;
  gap: 20px;
  flex: 1;
}
.donut-chart {
  position: relative;
  width: 140px;
  height: 140px;
  flex-shrink: 0;
}
.donut-chart svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.donut-total { font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
.donut-lbl { font-size: 10px; color: var(--t3); }
.donut-legend { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.donut-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
}
.donut-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.donut-row-name { flex: 1; color: var(--t2); }
.donut-row-val { font-weight: 700; font-variant-numeric: tabular-nums; }
.donut-row-pct { font-size: 10px; color: var(--t3); width: 36px; text-align: right; }

/* Transactions table */
.tx-table { width: 100%; border-collapse: collapse; }
.tx-table th {
  text-align: left;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--t3);
  padding: 0 10px 10px;
  border-bottom: 1px solid var(--border);
}
.tx-table td {
  padding: 11px 10px;
  font-size: 12px;
  border-bottom: 1px solid #f1f5f9;
  vertical-align: middle;
}
.tx-table tr:last-child td { border-bottom: none; }
.tx-table tr:hover td { background: var(--bg); }
.tx-type {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 20px;
  font-size: 10.5px;
  font-weight: 600;
}
.tx-type.in { background: var(--green-l); color: var(--green); }
.tx-type.out { background: var(--red-l); color: var(--red); }
.tx-amount { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.tx-amount.pos { color: var(--green); }
.tx-amount.neg { color: var(--red); }
.tx-client { font-weight: 600; }
.tx-cat { font-size: 11px; color: var(--t3); }

/* Invoices */
.inv-list { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.inv-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-radius: 11px;
  transition: border-color .14s, box-shadow .14s;
}
.inv-item:hover { border-color: var(--teal); box-shadow: 0 2px 12px rgba(13,148,136,.08); }
.inv-item.overdue { border-color: #fecaca; background: #fffbfb; }
.inv-num { font-size: 11px; font-weight: 700; color: var(--teal); min-width: 72px; }
.inv-client { flex: 1; min-width: 0; }
.inv-client-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.inv-due { font-size: 10px; color: var(--t3); margin-top: 1px; }
.inv-due.late { color: var(--red); font-weight: 600; }
.inv-amt { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.inv-status {
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: .03em;
}
.inv-status.pending { background: var(--amber-l); color: var(--amber); }
.inv-status.sent { background: var(--blue-l); color: var(--blue); }
.inv-status.overdue { background: var(--red-l); color: var(--red); }

/* Summary strip */
.summary-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  animation: fadeUp .4s .28s ease both;
}
.summary-box {
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.summary-box.income { background: linear-gradient(135deg, #f0fdfa, #ccfbf1); border: 1px solid #99f6e4; }
.summary-box.expense { background: linear-gradient(135deg, #fff1f2, #ffe4e6); border: 1px solid #fecdd3; }
.summary-box.net { background: linear-gradient(135deg, #eff6ff, #dbeafe); border: 1px solid #bfdbfe; }
.summary-icon {
  width: 40px;
  height: 40px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: rgba(255,255,255,.7);
}
.summary-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
.summary-box.income .summary-icon { color: var(--teal); }
.summary-box.expense .summary-icon { color: var(--red); }
.summary-box.net .summary-icon { color: var(--blue); }
.summary-label { font-size: 11px; color: var(--t2); font-weight: 500; }
.summary-value { font-size: 20px; font-weight: 800; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.summary-pct { font-size: 11px; font-weight: 600; margin-top: 2px; }
.summary-box.income .summary-pct { color: var(--green); }
.summary-box.expense .summary-pct { color: var(--red); }
.summary-box.net .summary-pct { color: var(--blue); }

/* Tooltip */
.chart-tip {
  position: fixed;
  pointer-events: none;
  background: var(--t1);
  color: #f8fafc;
  font-size: 11px;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 8px;
  opacity: 0;
  transition: opacity .12s;
  z-index: 100;
  white-space: nowrap;
}
.chart-tip.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
        </svg>
      </div>
      <div class="sb-logo-text">Ledger<span>Stack</span></div>
      <span class="sb-badge">PME IT</span>
    </div>

    <div class="sb-section">Principal</div>
    <div class="sb-item active">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Tableau de bord
    </div>
    <div class="sb-item">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Factures
      <span class="pill">4</span>
    </div>
    <div class="sb-item">
      <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      Dépenses
    </div>
    <div class="sb-item">
      <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
      Trésorerie
    </div>

    <div class="sb-section">Comptabilité</div>
    <div class="sb-item">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      Grand livre
    </div>
    <div class="sb-item">
      <svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
      TVA &amp; fiscalité
    </div>
    <div class="sb-item">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      Clients
    </div>
    <div class="sb-item">
      <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
      Fournisseurs
    </div>

    <div class="sb-spacer"></div>
    <div class="sb-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      Paramètres
    </div>
    <div class="sb-user">
      <div class="sb-avatar">HN</div>
      <div>
        <div class="sb-user-name">HexaNode SAS</div>
        <div class="sb-user-role">Agence dev · 8 pers.</div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="tb-left">
        <div class="tb-title">Vue comptable</div>
        <div class="tb-sub">Synthèse financière — exercice 2025</div>
      </div>
      <div class="tb-period" id="periodBtn">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span id="periodLabel">Jan — Juin 2025</span>
        <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="tb-right">
        <button class="tb-btn tb-btn-ghost" type="button">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Exporter
        </button>
        <button class="tb-btn tb-btn-primary" type="button">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nouvelle facture
        </button>
      </div>
    </header>

    <div class="content" id="dashboard"></div>
  </div>
</div>
<div class="chart-tip" id="chartTip"></div>

<script>
const fmt = (n) => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n);
const fmtK = (n) => n >= 1000 ? (n / 1000).toFixed(1).replace('.0', '') + 'k €' : fmt(n);
const pct = (n) => (n >= 0 ? '+' : '') + n.toFixed(1) + '%';

const DATA = {
  company: 'HexaNode SAS',
  period: 'Jan — Juin 2025',
  kpis: {
    revenue:      { value: 487200, delta: 14.2, label: 'Chiffre d\'affaires' },
    expenses:     { value: 312800, delta: 8.6, label: 'Dépenses totales' },
    netProfit:    { value: 174400, delta: 22.8, label: 'Résultat net' },
    cash:         { value: 89400,  delta: -3.2, label: 'Trésorerie' },
    receivables:  { value: 42800,  sub: '4 factures en attente' },
    payables:     { value: 18600,  sub: 'Échéance < 30 j' },
    grossMargin:  { value: 64.2,   sub: 'Marge brute' },
    vatDue:       { value: 12400,  sub: 'TVA à décaisser' }
  },
  monthly: [
    { month: 'Jan', income: 62000, expense: 48000 },
    { month: 'Fév', income: 71000, expense: 52000 },
    { month: 'Mar', income: 78000, expense: 54000 },
    { month: 'Avr', income: 85000, expense: 51000 },
    { month: 'Mai', income: 92000, expense: 56000 },
    { month: 'Juin', income: 99200, expense: 51800 }
  ],
  cashFlow: [72000, 68500, 74200, 79800, 83100, 89400],
  expenses: [
    { name: 'Salaires & charges', amount: 168000, color: '#0d9488' },
    { name: 'Cloud & infra', amount: 38400, color: '#3b82f6' },
    { name: 'Outils SaaS', amount: 28600, color: '#7c3aed' },
    { name: 'Bureaux', amount: 22400, color: '#d97706' },
    { name: 'Marketing', amount: 18200, color: '#ec4899' },
    { name: 'Autres', amount: 37200, color: '#94a3b8' }
  ],
  transactions: [
    { date: '28 juin', client: 'DataFlow GmbH', cat: 'Développement', type: 'in', amount: 18500 },
    { date: '27 juin', client: 'AWS Europe', cat: 'Cloud & hébergement', type: 'out', amount: -4200 },
    { date: '26 juin', client: 'ScaleUp Ventures', cat: 'Maintenance SaaS', type: 'in', amount: 6800 },
    { date: '25 juin', client: 'Figma Inc.', cat: 'Outils design', type: 'out', amount: -890 },
    { date: '24 juin', client: 'NeoBank SA', cat: 'Audit sécurité', type: 'in', amount: 12400 },
    { date: '23 juin', client: 'WeWork', cat: 'Bureaux', type: 'out', amount: -3200 }
  ],
  invoices: [
    { num: 'FAC-2025-042', client: 'DataFlow GmbH', amount: 18500, due: '5 juil.', status: 'sent' },
    { num: 'FAC-2025-038', client: 'TechBridge AS', amount: 9200, due: '20 juin', status: 'overdue', late: true },
    { num: 'FAC-2025-035', client: 'CloudNine Ltd', amount: 7600, due: '10 juil.', status: 'pending' },
    { num: 'FAC-2025-031', client: 'StartupLab', amount: 7500, due: '15 juil.', status: 'pending' }
  ]
};

const totalIncome = DATA.monthly.reduce((s, m) => s + m.income, 0);
const totalExpense = DATA.monthly.reduce((s, m) => s + m.expense, 0);
const maxBar = Math.max(...DATA.monthly.flatMap(m => [m.income, m.expense]));
const totalExpBreakdown = DATA.expenses.reduce((s, e) => s + e.amount, 0);

function kpiCard(key, icon, cls, invertDelta) {
  const k = DATA.kpis[key];
  const up = k.delta >= 0;
  const good = invertDelta ? !up : up;
  const deltaCls = good ? 'up' : 'down';
  const arrow = up
    ? '<svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>'
    : '<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>';
  return `
    <div class="kpi">
      <div class="kpi-head">
        <span class="kpi-label">${k.label}</span>
        <div class="kpi-icon ${cls}">${icon}</div>
      </div>
      <div class="kpi-value">${key === 'grossMargin' ? k.value + '%' : fmt(k.value)}</div>
      ${k.delta !== undefined ? `
      <div class="kpi-foot">
        <span class="kpi-delta ${deltaCls}">${arrow}${pct(Math.abs(k.delta))}</span>
        <span class="kpi-hint">vs. S1 2024</span>
      </div>` : ''}
    </div>`;
}

function render() {
  const el = document.getElementById('dashboard');
  const donutArcs = DATA.expenses.map((e, i) => {
    const pctVal = (e.amount / totalExpBreakdown) * 100;
    const circumference = 2 * Math.PI * 62;
    const dash = (pctVal / 100) * circumference;
    const offset = DATA.expenses.slice(0, i).reduce((s, x) => s + (x.amount / totalExpBreakdown) * circumference, 0);
    return `<circle cx="75" cy="75" r="62" fill="none" stroke="${e.color}" stroke-width="18"
      stroke-dasharray="${dash} ${circumference}" stroke-dashoffset="${-offset}"
      style="--dash:${dash}; animation: donutSpin .8s ${.1 + i * .08}s ease both"/>`;
  }).join('');

  const cashPoints = DATA.cashFlow.map((v, i) => {
    const x = 40 + i * (320 / (DATA.cashFlow.length - 1));
    const y = 130 - ((v - 60000) / 35000) * 110;
    return `${x},${y}`;
  }).join(' ');
  const cashArea = `40,140 ${cashPoints} ${40 + 320},140`;

  el.innerHTML = `
    <div class="kpi-row">
      ${kpiCard('revenue', '<svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>', 'teal')}
      ${kpiCard('expenses', '<svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>', 'red', true)}
      ${kpiCard('netProfit', '<svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>', 'green')}
      ${kpiCard('cash', '<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>', 'blue', true)}
    </div>

    <div class="kpi-row-sm">
      <div class="kpi-sm"><div class="kpi-sm-label">Créances clients</div><div class="kpi-sm-value">${fmt(DATA.kpis.receivables.value)}</div><div class="kpi-sm-sub">${DATA.kpis.receivables.sub}</div></div>
      <div class="kpi-sm"><div class="kpi-sm-label">Dettes fournisseurs</div><div class="kpi-sm-value">${fmt(DATA.kpis.payables.value)}</div><div class="kpi-sm-sub">${DATA.kpis.payables.sub}</div></div>
      <div class="kpi-sm"><div class="kpi-sm-label">Marge brute</div><div class="kpi-sm-value">${DATA.kpis.grossMargin.value}%</div><div class="kpi-sm-sub">Objectif : 60%</div></div>
      <div class="kpi-sm"><div class="kpi-sm-label">TVA à décaisser</div><div class="kpi-sm-value">${fmt(DATA.kpis.vatDue.value)}</div><div class="kpi-sm-sub">Échéance 24 juil.</div></div>
    </div>

    <div class="summary-strip">
      <div class="summary-box income">
        <div class="summary-icon"><svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg></div>
        <div>
          <div class="summary-label">Revenus encaissés (6 mois)</div>
          <div class="summary-value">${fmt(totalIncome)}</div>
          <div class="summary-pct">+14,2% vs. N-1</div>
        </div>
      </div>
      <div class="summary-box expense">
        <div class="summary-icon"><svg viewBox="0 0 24 24"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/></svg></div>
        <div>
          <div class="summary-label">Dépenses engagées (6 mois)</div>
          <div class="summary-value">${fmt(totalExpense)}</div>
          <div class="summary-pct">+8,6% vs. N-1</div>
        </div>
      </div>
      <div class="summary-box net">
        <div class="summary-icon"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></div>
        <div>
          <div class="summary-label">Solde net (revenus − dépenses)</div>
          <div class="summary-value">${fmt(totalIncome - totalExpense)}</div>
          <div class="summary-pct">Marge nette ${((totalIncome - totalExpense) / totalIncome * 100).toFixed(1)}%</div>
        </div>
      </div>
    </div>

    <div class="grid-2-1">
      <div class="card">
        <div class="card-head">
          <div>
            <div class="card-title">Revenus vs Dépenses</div>
            <div class="card-sub">Comparaison mensuelle — vision globale entrées / sorties</div>
          </div>
          <div class="card-tabs">
            <button class="card-tab active" type="button">6 mois</button>
            <button class="card-tab" type="button">12 mois</button>
          </div>
        </div>
        <div class="chart-legend">
          <span class="legend-item"><span class="legend-dot" style="background:var(--teal)"></span>Revenus</span>
          <span class="legend-item"><span class="legend-dot" style="background:var(--red)"></span>Dépenses</span>
        </div>
        <div class="chart-area">
          <div class="bar-chart" id="barChart">
            ${DATA.monthly.map((m, i) => `
              <div class="bar-group">
                <div class="bar-pair">
                  <div class="bar income" style="height:${(m.income / maxBar) * 100}%; animation-delay:${i * .06}s"
                    data-tip="${m.month}: ${fmt(m.income)} revenus"></div>
                  <div class="bar expense" style="height:${(m.expense / maxBar) * 100}%; animation-delay:${i * .06 + .03}s"
                    data-tip="${m.month}: ${fmt(m.expense)} dépenses"></div>
                </div>
                <span class="bar-label">${m.month}</span>
              </div>
            `).join('')}
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div>
            <div class="card-title">Évolution trésorerie</div>
            <div class="card-sub">Solde bancaire cumulé</div>
          </div>
        </div>
        <div class="cash-chart">
          <svg viewBox="0 0 400 150" preserveAspectRatio="none">
            <defs>
              <linearGradient id="cashGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#0d9488" stop-opacity=".4"/>
                <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
              </linearGradient>
            </defs>
            ${[0,1,2,3].map(i => `<line class="grid-line" x1="40" y1="${30 + i * 28}" x2="360" y2="${30 + i * 28}"/>`).join('')}
            <polygon class="cash-area" points="${cashArea}"/>
            <polyline class="cash-line" points="${cashPoints}"/>
            ${DATA.monthly.map((m, i) => {
              const x = 40 + i * (320 / (DATA.monthly.length - 1));
              return `<text class="axis-label" x="${x}" y="148" text-anchor="middle">${m.month}</text>`;
            }).join('')}
            ${DATA.cashFlow.map((v, i) => {
              const x = 40 + i * (320 / (DATA.cashFlow.length - 1));
              const y = 130 - ((v - 60000) / 35000) * 110;
              return `<circle cx="${x}" cy="${y}" r="4" fill="#fff" stroke="#0d9488" stroke-width="2"/>`;
            }).join('')}
          </svg>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--t3)">
          <span>Début : ${fmt(DATA.cashFlow[0])}</span>
          <span style="font-weight:700;color:var(--teal)">Actuel : ${fmt(DATA.cashFlow[DATA.cashFlow.length - 1])}</span>
        </div>
      </div>
    </div>

    <div class="grid-1-1">
      <div class="card">
        <div class="card-head">
          <div>
            <div class="card-title">Répartition des dépenses</div>
            <div class="card-sub">Par catégorie — S1 2025</div>
          </div>
        </div>
        <div class="donut-wrap">
          <div class="donut-chart">
            <svg viewBox="0 0 150 150">${donutArcs}</svg>
            <div class="donut-center">
              <div class="donut-total">${fmtK(totalExpBreakdown)}</div>
              <div class="donut-lbl">Total dépenses</div>
            </div>
          </div>
          <div class="donut-legend">
            ${DATA.expenses.map(e => `
              <div class="donut-row">
                <span class="donut-swatch" style="background:${e.color}"></span>
                <span class="donut-row-name">${e.name}</span>
                <span class="donut-row-pct">${(e.amount / totalExpBreakdown * 100).toFixed(0)}%</span>
                <span class="donut-row-val">${fmtK(e.amount)}</span>
              </div>
            `).join('')}
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div>
            <div class="card-title">Factures en attente</div>
            <div class="card-sub">Créances à encaisser</div>
          </div>
        </div>
        <div class="inv-list">
          ${DATA.invoices.map(inv => `
            <div class="inv-item${inv.late ? ' overdue' : ''}">
              <span class="inv-num">${inv.num}</span>
              <div class="inv-client">
                <div class="inv-client-name">${inv.client}</div>
                <div class="inv-due${inv.late ? ' late' : ''}">Échéance ${inv.due}${inv.late ? ' · En retard' : ''}</div>
              </div>
              <span class="inv-amt">${fmt(inv.amount)}</span>
              <span class="inv-status ${inv.status}">${inv.status === 'overdue' ? 'Retard' : inv.status === 'sent' ? 'Envoyée' : 'Brouillon'}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>

    <div class="card" style="animation-delay:.32s">
      <div class="card-head">
        <div>
          <div class="card-title">Dernières opérations</div>
          <div class="card-sub">Flux entrants et sortants récents</div>
        </div>
      </div>
      <table class="tx-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Libellé</th>
            <th>Catégorie</th>
            <th>Type</th>
            <th style="text-align:right">Montant</th>
          </tr>
        </thead>
        <tbody>
          ${DATA.transactions.map(tx => `
            <tr>
              <td style="color:var(--t3)">${tx.date}</td>
              <td class="tx-client">${tx.client}</td>
              <td class="tx-cat">${tx.cat}</td>
              <td><span class="tx-type ${tx.type}">${tx.type === 'in' ? 'Entrée' : 'Sortie'}</span></td>
              <td class="tx-amount ${tx.amount > 0 ? 'pos' : 'neg'}">${tx.amount > 0 ? '+' : ''}${fmt(Math.abs(tx.amount))}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;

  bindTooltips();
}

function bindTooltips() {
  const tip = document.getElementById('chartTip');
  document.querySelectorAll('.bar[data-tip]').forEach(bar => {
    bar.addEventListener('mouseenter', e => {
      tip.textContent = bar.dataset.tip;
      tip.classList.add('show');
    });
    bar.addEventListener('mousemove', e => {
      tip.style.left = (e.clientX + 12) + 'px';
      tip.style.top = (e.clientY - 32) + 'px';
    });
    bar.addEventListener('mouseleave', () => tip.classList.remove('show'));
  });
}

document.getElementById('periodLabel').textContent = DATA.period;
render();
</script>
</body>
</html>
