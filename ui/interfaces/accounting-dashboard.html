<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LedgerStack — IT Accounting</title>
<link rel="stylesheet" href="/ui/assets/fonts.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #efece4;
  --white:     #fffcf8;
  --border:    #e3ddd2;
  --t1:        #1a1814;
  --t2:        #6f6a62;
  --t3:        #9a948a;
  --teal:      #0e6b52;
  --teal-d:    #0a5340;
  --teal-l:    #e4f2eb;
  --teal-xl:   #f3faf6;
  --blue:      #3d5a80;
  --blue-l:    #e7eef6;
  --green:     #0e6b52;
  --green-l:   #e4f2eb;
  --red:       #b42318;
  --red-l:     #f8e8e6;
  --amber:     #8a5a12;
  --amber-l:   #f8efd8;
  --violet:    #6b5b4f;
  --violet-l:  #f0ebe4;
  --brass:     #c4a574;
  --ink:       #141210;
  --shadow:    0 1px 0 rgba(26,24,20,.04), 0 10px 28px rgba(26,24,20,.04);
  --shadow-lg: 0 16px 40px rgba(26,24,20,.08);
  --sidebar-w: 232px;
  --radius:    16px;
}

html, body {
  height: 100%;
  background: var(--bg);
  font-family: var(--font-inter), -apple-system, sans-serif;
  font-size: 13px;
  color: var(--t1);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes growBar { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes drawLine { from { stroke-dashoffset: 800; } to { stroke-dashoffset: 0; } }
@keyframes donutSpin { from { stroke-dasharray: 0 440; } to { stroke-dasharray: var(--dash) 440; } }

.app { display: flex; height: 100vh; overflow: hidden; }

/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--ink);
  color: #cfc8bc;
  display: flex;
  flex-direction: column;
  padding: 22px 14px 16px;
  animation: fadeIn .35s ease both;
}
.sb-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 8px 18px;
  margin-bottom: 6px;
  border-bottom: 1px solid rgba(196,165,116,.28);
}
.sb-logo-icon {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: #241f1a;
  border: 1px solid rgba(196,165,116,.45);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.sb-logo-icon svg { width: 16px; height: 16px; }
.sb-brand { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sb-logo-text {
  min-height: 26px;
  font-family: var(--font-instrument), Georgia, serif;
  font-size: 22px;
  font-weight: 400;
  color: #f6f1e7;
  letter-spacing: -.02em;
  line-height: 1;
}
.sb-badge {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--brass);
}

.sb-section {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #6d675e;
  padding: 14px 10px 6px;
}
.sb-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  color: #b7b0a4;
  cursor: pointer;
  transition: background .14s, color .14s;
}
.sb-item svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
.sb-item:hover { background: rgba(255,255,255,.05); color: #f6f1e7; }
.sb-item.active { background: rgba(196,165,116,.12); color: #f6f1e7; font-weight: 600; }
.sb-item .pill {
  margin-left: auto;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 20px;
  background: var(--red);
  color: #fff;
}
.sb-spacer { flex: 1; }
.sb-user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 10px 4px;
  margin-top: 8px;
  border-top: 1px solid rgba(255,255,255,.08);
}
.sb-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #2a241c;
  border: 1px solid rgba(196,165,116,.4);
  display: grid;
  place-items: center;
  font-family: var(--font-instrument), Georgia, serif;
  font-size: 13px;
  color: var(--brass);
}
.sb-user-name { font-size: 12.5px; font-weight: 600; color: #f6f1e7; }
.sb-user-role { font-size: 11px; color: #8a8378; margin-top: 1px; }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

.topbar {
  height: 64px;
  padding: 0 24px;
  background: rgba(255,252,248,.86);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
  animation: fadeIn .3s ease both;
}
.tb-title {
  font-family: var(--font-instrument), Georgia, serif;
  font-size: 26px;
  font-weight: 400;
  letter-spacing: -.03em;
  line-height: 1;
}
.tb-sub { font-size: 12px; color: var(--t2); margin-top: 3px; }
.tb-left { display: flex; flex-direction: column; }
.tb-period {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: 16px;
  padding: 0 12px;
  height: 34px;
  border: 1px solid var(--border);
  border-radius: 9px;
  font-size: 12px;
  font-weight: 500;
  color: var(--t2);
  cursor: pointer;
  background: var(--bg);
}
.tb-period svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.tb-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 14px;
  border-radius: 9px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: transform .12s, box-shadow .12s;
}
.tb-btn:active { transform: scale(.97); }
.tb-btn-ghost {
  background: var(--white);
  border: 1px solid var(--border);
  color: var(--t2);
}
.tb-btn-ghost:hover { border-color: var(--teal); color: var(--teal); }
.tb-btn-primary {
  background: var(--ink);
  color: #f6f1e7;
  box-shadow: 0 8px 18px rgba(20,18,16,.16);
}
.tb-btn-primary:hover { background: #2a241c; }
.tb-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

.content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background:
    radial-gradient(900px 280px at 0% 0%, rgba(196,165,116,.16), transparent 60%),
    var(--bg);
}

/* KPI row */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
.kpi {
  background: var(--white);
  border-radius: var(--radius);
  padding: 16px 18px 15px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  animation: fadeUp .4s ease both;
  transition: box-shadow .18s, transform .18s;
}
.kpi:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
.kpi-hero {
  background: var(--ink);
  border-color: var(--ink);
  color: #f6f1e7;
}
.kpi-hero .kpi-label,
.kpi-hero .kpi-hint { color: rgba(246,241,231,.62); }
.kpi-hero .kpi-value { color: #f6f1e7; }
.kpi-hero .kpi-icon.teal { background: rgba(196,165,116,.16); color: var(--brass); }
.kpi:nth-child(1) { animation-delay: .04s; }
.kpi:nth-child(2) { animation-delay: .08s; }
.kpi:nth-child(3) { animation-delay: .12s; }
.kpi:nth-child(4) { animation-delay: .16s; }
.kpi-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.kpi-label { font-size: 11.5px; font-weight: 500; color: var(--t2); }
.kpi-icon {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  display: grid;
  place-items: center;
}
.kpi-icon svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
.kpi-icon.teal { background: var(--teal-l); color: var(--teal); }
.kpi-icon.red { background: var(--red-l); color: var(--red); }
.kpi-icon.green { background: var(--green-l); color: var(--green); }
.kpi-icon.blue { background: var(--blue-l); color: var(--blue); }
.kpi-value {
  font-family: var(--font-instrument), Georgia, serif;
  font-size: 32px;
  font-weight: 400;
  letter-spacing: -.03em;
  line-height: 1;
  color: var(--t1);
  font-variant-numeric: tabular-nums;
}
.kpi-foot {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
  font-size: 11px;
}
.kpi-delta {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 20px;
}
.kpi-delta.up { background: var(--green-l); color: var(--green); }
.kpi-delta.down { background: var(--red-l); color: var(--red); }
.kpi-delta svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2.5; }
.kpi-hint { color: var(--t3); }

/* Secondary KPIs */
.kpi-row-sm {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
}
.kpi-sm {
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 4px 16px;
  animation: fadeUp .4s .18s ease both;
  border-left: 1px solid var(--border);
}
.kpi-sm:first-child { border-left: none; padding-left: 2px; }
.kpi-sm-label { font-size: 11px; color: var(--t3); font-weight: 500; margin-bottom: 4px; letter-spacing: .02em; }
.kpi-sm-value {
  font-family: var(--font-instrument), Georgia, serif;
  font-size: 22px;
  font-weight: 400;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.kpi-sm-sub { font-size: 11px; color: var(--t2); margin-top: 3px; }

/* Grid layout */
.grid-2-1 {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
  gap: 14px;
  min-height: 280px;
}
.grid-1-1 {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 14px;
}

.card {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
  animation: fadeUp .45s .22s ease both;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-shrink: 0;
}
.card-title {
  font-family: var(--font-instrument), Georgia, serif;
  font-size: 20px;
  font-weight: 400;
  letter-spacing: -.02em;
}
.card-sub { font-size: 11px; color: var(--t3); margin-top: 2px; }
.card-tabs {
  display: flex;
  gap: 4px;
  background: var(--bg);
  padding: 3px;
  border-radius: 8px;
}
.card-tab {
  padding: 5px 11px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--t2);
  cursor: pointer;
  border: none;
  background: transparent;
  transition: background .12s, color .12s;
}
.card-tab.active { background: var(--white); color: var(--t1); box-shadow: 0 1px 4px rgba(0,0,0,.06); }

/* Bar chart */
.chart-area { flex: 1; position: relative; min-height: 200px; }
.chart-legend {
  display: flex;
  gap: 16px;
  margin-bottom: 12px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--t2);
  font-weight: 500;
}
.legend-dot { width: 8px; height: 8px; border-radius: 3px; }
.bar-chart {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  height: 180px;
  padding: 0 4px;
  gap: 6px;
}
.bar-group {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  height: 100%;
  justify-content: flex-end;
}
.bar-pair {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 100%;
  width: 100%;
  justify-content: center;
}
.bar {
  width: 42%;
  border-radius: 5px 5px 2px 2px;
  transform-origin: bottom;
  animation: growBar .6s cubic-bezier(.34,1.2,.64,1) both;
  cursor: pointer;
  transition: opacity .12s;
}
.bar:hover { opacity: .8; }
.bar.income { background: linear-gradient(180deg, #1f8a6a, var(--teal)); }
.bar.expense { background: linear-gradient(180deg, #e4d3b4, #c4a574); }
.bar-label { font-size: 10px; color: var(--t3); font-weight: 500; }

/* Cash flow line */
.cash-chart { flex: 1; min-height: 160px; }
.cash-chart svg { width: 100%; height: 160px; overflow: visible; }
.cash-line {
  fill: none;
  stroke: var(--teal);
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 800;
  animation: drawLine 1.4s ease forwards;
}
.cash-area {
  fill: url(#cashGrad);
  opacity: .35;
}
.grid-line { stroke: var(--border); stroke-width: 1; }
.axis-label { font-size: 10px; fill: var(--t3); }

/* Donut */
.donut-wrap {
  display: flex;
  align-items: center;
  gap: 20px;
  flex: 1;
}
.donut-chart {
  position: relative;
  width: 140px;
  height: 140px;
  flex-shrink: 0;
}
.donut-chart svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.donut-total {
  font-family: var(--font-instrument), Georgia, serif;
  font-size: 22px;
  font-weight: 400;
  letter-spacing: -.02em;
}
.donut-lbl { font-size: 10px; color: var(--t3); }
.donut-legend { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.donut-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
}
.donut-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.donut-row-name { flex: 1; color: var(--t2); }
.donut-row-val { font-weight: 700; font-variant-numeric: tabular-nums; }
.donut-row-pct { font-size: 10px; color: var(--t3); width: 36px; text-align: right; }

/* Transactions table */
.tx-table { width: 100%; border-collapse: collapse; }
.tx-table th {
  text-align: left;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--t3);
  padding: 0 10px 10px;
  border-bottom: 1px solid var(--border);
}
.tx-table td {
  padding: 11px 10px;
  font-size: 12px;
  border-bottom: 1px solid #f1f5f9;
  vertical-align: middle;
}
.tx-table tr:last-child td { border-bottom: none; }
.tx-table tr:hover td { background: var(--bg); }
.tx-type {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 20px;
  font-size: 10.5px;
  font-weight: 600;
}
.tx-type.in { background: var(--green-l); color: var(--green); }
.tx-type.out { background: var(--red-l); color: var(--red); }
.tx-amount { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.tx-amount.pos { color: var(--green); }
.tx-amount.neg { color: var(--red); }
.tx-client { font-weight: 600; }
.tx-cat { font-size: 11px; color: var(--t3); }

/* Invoices */
.inv-list { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.inv-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-radius: 11px;
  transition: border-color .14s, box-shadow .14s;
}
.inv-item:hover { border-color: var(--teal); box-shadow: 0 2px 12px rgba(13,148,136,.08); }
.inv-item.overdue { border-color: #efc8c2; background: #fff8f6; }
.inv-num {
  font-family: var(--font-instrument), Georgia, serif;
  font-size: 13px;
  color: var(--t1);
  min-width: 108px;
}
.inv-client { flex: 1; min-width: 0; }
.inv-client-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.inv-due { font-size: 10px; color: var(--t3); margin-top: 1px; }
.inv-due.late { color: var(--red); font-weight: 600; }
.inv-amt { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.inv-status {
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: .03em;
}
.inv-status.pending { background: var(--amber-l); color: var(--amber); }
.inv-status.sent { background: var(--blue-l); color: var(--blue); }
.inv-status.overdue { background: var(--red-l); color: var(--red); }

/* Summary strip */
.summary-strip {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  animation: fadeUp .4s .28s ease both;
}
.summary-box {
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.summary-box { background: var(--white); border: 1px solid var(--border); }
.summary-box.income { background: var(--white); }
.summary-box.expense { background: var(--white); }
.summary-box.net { background: var(--ink); border-color: var(--ink); color: #f6f1e7; }
.summary-box.net .summary-label { color: rgba(246,241,231,.62); }
.summary-box.net .summary-value { color: #f6f1e7; }
.summary-box.net .summary-pct { color: var(--brass); }
.summary-box.net .summary-icon { color: var(--brass); background: rgba(196,165,116,.12); }
.summary-icon {
  width: 40px;
  height: 40px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: rgba(255,255,255,.7);
}
.summary-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
.summary-box.income .summary-icon { color: var(--teal); }
.summary-box.expense .summary-icon { color: var(--red); }
.summary-box.net .summary-icon { color: var(--blue); }
.summary-label { font-size: 11px; color: var(--t2); font-weight: 500; }
.summary-value {
  font-family: var(--font-instrument), Georgia, serif;
  font-size: 26px;
  font-weight: 400;
  letter-spacing: -.03em;
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}
.summary-pct { font-size: 11px; font-weight: 600; margin-top: 2px; }
.summary-box.income .summary-pct { color: var(--green); }
.summary-box.expense .summary-pct { color: var(--red); }
.summary-box.net .summary-pct { color: var(--blue); }

/* Tooltip */
.chart-tip {
  position: fixed;
  pointer-events: none;
  background: var(--t1);
  color: #f8fafc;
  font-size: 11px;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 8px;
  opacity: 0;
  transition: opacity .12s;
  z-index: 100;
  white-space: nowrap;
}
.chart-tip.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#c4a574" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
        </svg>
      </div>
      <div class="sb-brand">
        <div class="sb-logo-text" id="ledger-word">LedgerStack</div>
        <span class="sb-badge">IT SME</span>
      </div>
    </div>

    <div class="sb-section">Main</div>
    <div class="sb-item active">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </div>
    <div class="sb-item">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Invoices
      <span class="pill">4</span>
    </div>
    <div class="sb-item">
      <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      Expenses
    </div>
    <div class="sb-item">
      <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
      Cash
    </div>

    <div class="sb-section">Accounting</div>
    <div class="sb-item">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      General ledger
    </div>
    <div class="sb-item">
      <svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
      VAT and tax
    </div>
    <div class="sb-item">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      Customers
    </div>
    <div class="sb-item">
      <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
      Suppliers
    </div>

    <div class="sb-spacer"></div>
    <div class="sb-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      Settings
    </div>
    <div class="sb-user">
      <div class="sb-avatar">HN</div>
      <div>
        <div class="sb-user-name">HexaNode SAS</div>
        <div class="sb-user-role">Dev agency · 8 people</div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="tb-left">
        <div class="tb-title">Accounting view</div>
        <div class="tb-sub">Financial summary — FY 2025</div>
      </div>
      <div class="tb-period" id="periodBtn">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span id="periodLabel">Jan — Jun 2025</span>
        <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="tb-right">
        <button class="tb-btn tb-btn-ghost" type="button">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export
        </button>
        <button class="tb-btn tb-btn-primary" id="newInvoiceBtn" type="button">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New invoice
        </button>
      </div>
    </header>

    <div class="content" id="dashboard"></div>
  </div>
</div>
<div class="chart-tip" id="chartTip"></div>

<script>
const fmt = (n) => new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n);
const fmtK = (n) => n >= 1000 ? (n / 1000).toFixed(1).replace('.0', '') + 'k €' : fmt(n);
const pct = (n) => (n >= 0 ? '+' : '') + n.toFixed(1) + '%';

const DATA = {
  company: 'HexaNode SAS',
  period: 'Jan — Jun 2025',
  kpis: {
    revenue:      { value: 487200, delta: 14.2, label: 'Revenue' },
    expenses:     { value: 312800, delta: 8.6, label: 'Total expenses' },
    netProfit:    { value: 174400, delta: 22.8, label: 'Net profit' },
    cash:         { value: 89400,  delta: -3.2, label: 'Cash' },
    receivables:  { value: 42800,  sub: '4 invoices pending' },
    payables:     { value: 18600,  sub: 'Due in under 30 days' },
    grossMargin:  { value: 64.2,   sub: 'Gross margin' },
    vatDue:       { value: 12400,  sub: 'VAT to remit' }
  },
  monthly: [
    { month: 'Jan', income: 62000, expense: 48000 },
    { month: 'Feb', income: 71000, expense: 52000 },
    { month: 'Mar', income: 78000, expense: 54000 },
    { month: 'Apr', income: 85000, expense: 51000 },
    { month: 'May', income: 92000, expense: 56000 },
    { month: 'Jun', income: 99200, expense: 51800 }
  ],
  cashFlow: [72000, 68500, 74200, 79800, 83100, 89400],
  expenses: [
    { name: 'Salaries and charges', amount: 168000, color: '#1a1814' },
    { name: 'Cloud and infra', amount: 38400, color: '#0e6b52' },
    { name: 'SaaS tools', amount: 28600, color: '#c4a574' },
    { name: 'Offices', amount: 22400, color: '#8a9a7b' },
    { name: 'Marketing', amount: 18200, color: '#b85c38' },
    { name: 'Other', amount: 37200, color: '#c8c0b4' }
  ],
  transactions: [
    { date: '28 Jun', client: 'DataFlow GmbH', cat: 'Development', type: 'in', amount: 18500 },
    { date: '27 Jun', client: 'AWS Europe', cat: 'Cloud and hosting', type: 'out', amount: -4200 },
    { date: '26 Jun', client: 'ScaleUp Ventures', cat: 'SaaS maintenance', type: 'in', amount: 6800 },
    { date: '25 Jun', client: 'Figma Inc.', cat: 'Design tools', type: 'out', amount: -890 },
    { date: '24 Jun', client: 'NeoBank SA', cat: 'Security audit', type: 'in', amount: 12400 },
    { date: '23 Jun', client: 'WeWork', cat: 'Offices', type: 'out', amount: -3200 }
  ],
  invoices: [
    { num: 'FAC-2025-042', client: 'DataFlow GmbH', amount: 18500, due: '5 Jul', status: 'sent' },
    { num: 'FAC-2025-038', client: 'TechBridge AS', amount: 9200, due: '20 Jun', status: 'overdue', late: true },
    { num: 'FAC-2025-035', client: 'CloudNine Ltd', amount: 7600, due: '10 Jul', status: 'pending' },
    { num: 'FAC-2025-031', client: 'StartupLab', amount: 7500, due: '15 Jul', status: 'pending' }
  ]
};

const totalIncome = DATA.monthly.reduce((s, m) => s + m.income, 0);
const totalExpense = DATA.monthly.reduce((s, m) => s + m.expense, 0);
const maxBar = Math.max(...DATA.monthly.flatMap(m => [m.income, m.expense]));
const totalExpBreakdown = DATA.expenses.reduce((s, e) => s + e.amount, 0);

function kpiCard(key, icon, cls, invertDelta) {
  const k = DATA.kpis[key];
  const up = k.delta >= 0;
  const good = invertDelta ? !up : up;
  const deltaCls = good ? 'up' : 'down';
  const arrow = up
    ? '<svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>'
    : '<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>';
  const hero = key === 'revenue' ? ' kpi-hero' : '';
  return `
    <div class="kpi${hero}">
      <div class="kpi-head">
        <span class="kpi-label">${k.label}</span>
        <div class="kpi-icon ${cls}">${icon}</div>
      </div>
      <div class="kpi-value">${key === 'grossMargin' ? k.value + '%' : fmt(k.value)}</div>
      ${k.delta !== undefined ? `
      <div class="kpi-foot">
        <span class="kpi-delta ${deltaCls}">${arrow}${pct(Math.abs(k.delta))}</span>
        <span class="kpi-hint">vs. S1 2024</span>
      </div>` : ''}
    </div>`;
}

function render() {
  const el = document.getElementById('dashboard');
  const donutArcs = DATA.expenses.map((e, i) => {
    const pctVal = (e.amount / totalExpBreakdown) * 100;
    const circumference = 2 * Math.PI * 62;
    const dash = (pctVal / 100) * circumference;
    const offset = DATA.expenses.slice(0, i).reduce((s, x) => s + (x.amount / totalExpBreakdown) * circumference, 0);
    return `<circle cx="75" cy="75" r="62" fill="none" stroke="${e.color}" stroke-width="18"
      stroke-dasharray="${dash} ${circumference}" stroke-dashoffset="${-offset}"
      style="--dash:${dash}; animation: donutSpin .8s ${.1 + i * .08}s ease both"/>`;
  }).join('');

  const cashPoints = DATA.cashFlow.map((v, i) => {
    const x = 40 + i * (320 / (DATA.cashFlow.length - 1));
    const y = 130 - ((v - 60000) / 35000) * 110;
    return `${x},${y}`;
  }).join(' ');
  const cashArea = `40,140 ${cashPoints} ${40 + 320},140`;

  el.innerHTML = `
    <div class="kpi-row">
      ${kpiCard('revenue', '<svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>', 'teal')}
      ${kpiCard('expenses', '<svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>', 'red', true)}
      ${kpiCard('netProfit', '<svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>', 'green')}
      ${kpiCard('cash', '<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>', 'blue', true)}
    </div>

    <div class="kpi-row-sm">
      <div class="kpi-sm"><div class="kpi-sm-label">Customer receivables</div><div class="kpi-sm-value">${fmt(DATA.kpis.receivables.value)}</div><div class="kpi-sm-sub">${DATA.kpis.receivables.sub}</div></div>
      <div class="kpi-sm"><div class="kpi-sm-label">Supplier payables</div><div class="kpi-sm-value">${fmt(DATA.kpis.payables.value)}</div><div class="kpi-sm-sub">${DATA.kpis.payables.sub}</div></div>
      <div class="kpi-sm"><div class="kpi-sm-label">Gross margin</div><div class="kpi-sm-value">${DATA.kpis.grossMargin.value}%</div><div class="kpi-sm-sub">Target: 60%</div></div>
      <div class="kpi-sm"><div class="kpi-sm-label">VAT to remit</div><div class="kpi-sm-value">${fmt(DATA.kpis.vatDue.value)}</div><div class="kpi-sm-sub">Due 24 Jul</div></div>
    </div>

    <div class="summary-strip">
      <div class="summary-box income">
        <div class="summary-icon"><svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg></div>
        <div>
          <div class="summary-label">Cash collected (6 months)</div>
          <div class="summary-value">${fmt(totalIncome)}</div>
          <div class="summary-pct">+14.2% vs. prior year</div>
        </div>
      </div>
      <div class="summary-box expense">
        <div class="summary-icon"><svg viewBox="0 0 24 24"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/></svg></div>
        <div>
          <div class="summary-label">Expenses incurred (6 months)</div>
          <div class="summary-value">${fmt(totalExpense)}</div>
          <div class="summary-pct">+8.6% vs. prior year</div>
        </div>
      </div>
      <div class="summary-box net">
        <div class="summary-icon"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></div>
        <div>
          <div class="summary-label">Net balance (income − expenses)</div>
          <div class="summary-value">${fmt(totalIncome - totalExpense)}</div>
          <div class="summary-pct">Net margin ${((totalIncome - totalExpense) / totalIncome * 100).toFixed(1)}%</div>
        </div>
      </div>
    </div>

    <div class="grid-2-1">
      <div class="card">
        <div class="card-head">
          <div>
            <div class="card-title">Income vs expenses</div>
            <div class="card-sub">Monthly comparison — overall inflows and outflows</div>
          </div>
          <div class="card-tabs">
            <button class="card-tab active" type="button">6 months</button>
            <button class="card-tab" type="button">12 months</button>
          </div>
        </div>
        <div class="chart-legend">
          <span class="legend-item"><span class="legend-dot" style="background:var(--teal)"></span>Income</span>
          <span class="legend-item"><span class="legend-dot" style="background:#c4a574"></span>Expenses</span>
        </div>
        <div class="chart-area">
          <div class="bar-chart" id="barChart">
            ${DATA.monthly.map((m, i) => `
              <div class="bar-group">
                <div class="bar-pair">
                  <div class="bar income" style="height:${(m.income / maxBar) * 100}%; animation-delay:${i * .06}s"
                    data-tip="${m.month}: ${fmt(m.income)} income"></div>
                  <div class="bar expense" style="height:${(m.expense / maxBar) * 100}%; animation-delay:${i * .06 + .03}s"
                    data-tip="${m.month}: ${fmt(m.expense)} expenses"></div>
                </div>
                <span class="bar-label">${m.month}</span>
              </div>
            `).join('')}
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div>
            <div class="card-title">Cash trend</div>
            <div class="card-sub">Cumulative bank balance</div>
          </div>
        </div>
        <div class="cash-chart">
          <svg viewBox="0 0 400 150" preserveAspectRatio="none">
            <defs>
              <linearGradient id="cashGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#0e6b52" stop-opacity=".35"/>
                <stop offset="100%" stop-color="#0e6b52" stop-opacity="0"/>
              </linearGradient>
            </defs>
            ${[0,1,2,3].map(i => `<line class="grid-line" x1="40" y1="${30 + i * 28}" x2="360" y2="${30 + i * 28}"/>`).join('')}
            <polygon class="cash-area" points="${cashArea}"/>
            <polyline class="cash-line" points="${cashPoints}"/>
            ${DATA.monthly.map((m, i) => {
              const x = 40 + i * (320 / (DATA.monthly.length - 1));
              return `<text class="axis-label" x="${x}" y="148" text-anchor="middle">${m.month}</text>`;
            }).join('')}
            ${DATA.cashFlow.map((v, i) => {
              const x = 40 + i * (320 / (DATA.cashFlow.length - 1));
              const y = 130 - ((v - 60000) / 35000) * 110;
              return `<circle cx="${x}" cy="${y}" r="4" fill="#fffcf8" stroke="#0e6b52" stroke-width="2"/>`;
            }).join('')}
          </svg>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--t3)">
          <span>Start: ${fmt(DATA.cashFlow[0])}</span>
          <span style="font-weight:700;color:var(--teal)">Current: ${fmt(DATA.cashFlow[DATA.cashFlow.length - 1])}</span>
        </div>
      </div>
    </div>

    <div class="grid-1-1">
      <div class="card">
        <div class="card-head">
          <div>
            <div class="card-title">Expense breakdown</div>
            <div class="card-sub">By category — H1 2025</div>
          </div>
        </div>
        <div class="donut-wrap">
          <div class="donut-chart">
            <svg viewBox="0 0 150 150">${donutArcs}</svg>
            <div class="donut-center">
              <div class="donut-total">${fmtK(totalExpBreakdown)}</div>
              <div class="donut-lbl">Total expenses</div>
            </div>
          </div>
          <div class="donut-legend">
            ${DATA.expenses.map(e => `
              <div class="donut-row">
                <span class="donut-swatch" style="background:${e.color}"></span>
                <span class="donut-row-name">${e.name}</span>
                <span class="donut-row-pct">${(e.amount / totalExpBreakdown * 100).toFixed(0)}%</span>
                <span class="donut-row-val">${fmtK(e.amount)}</span>
              </div>
            `).join('')}
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div>
            <div class="card-title">Open invoices</div>
            <div class="card-sub">Receivables to collect</div>
          </div>
        </div>
        <div class="inv-list">
          ${DATA.invoices.map(inv => `
            <div class="inv-item${inv.late ? ' overdue' : ''}">
              <span class="inv-num">${inv.num}</span>
              <div class="inv-client">
                <div class="inv-client-name">${inv.client}</div>
                <div class="inv-due${inv.late ? ' late' : ''}">Due ${inv.due}${inv.late ? ' · Late' : ''}</div>
              </div>
              <span class="inv-amt">${fmt(inv.amount)}</span>
              <span class="inv-status ${inv.status}">${inv.status === 'overdue' ? 'Overdue' : inv.status === 'sent' ? 'Sent' : 'Pending'}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>

    <div class="card" style="animation-delay:.32s">
      <div class="card-head">
        <div>
          <div class="card-title">Latest transactions</div>
          <div class="card-sub">Recent inflows and outflows</div>
        </div>
      </div>
      <table class="tx-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Category</th>
            <th>Type</th>
            <th style="text-align:right">Amount</th>
          </tr>
        </thead>
        <tbody>
          ${DATA.transactions.map(tx => `
            <tr>
              <td style="color:var(--t3)">${tx.date}</td>
              <td class="tx-client">${tx.client}</td>
              <td class="tx-cat">${tx.cat}</td>
              <td><span class="tx-type ${tx.type}">${tx.type === 'in' ? 'In' : 'Out'}</span></td>
              <td class="tx-amount ${tx.amount > 0 ? 'pos' : 'neg'}">${tx.amount > 0 ? '+' : ''}${fmt(Math.abs(tx.amount))}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;

  bindTooltips();
}

function bindTooltips() {
  const tip = document.getElementById('chartTip');
  document.querySelectorAll('.bar[data-tip]').forEach(bar => {
    bar.addEventListener('mouseenter', e => {
      tip.textContent = bar.dataset.tip;
      tip.classList.add('show');
    });
    bar.addEventListener('mousemove', e => {
      tip.style.left = (e.clientX + 12) + 'px';
      tip.style.top = (e.clientY - 32) + 'px';
    });
    bar.addEventListener('mouseleave', () => tip.classList.remove('show'));
  });
}

document.getElementById('periodLabel').textContent = DATA.period;
render();

function mountLedgerEffects() {
  const word = document.getElementById('ledger-word');
  const button = document.getElementById('newInvoiceBtn');
  const script = document.createElement('script');
  script.src = '/effects/dist/effects.js';
  script.onload = () => {
    const fx = window.JobYouGoEffects;
    if (!fx) return;
    const paint = () => {
      if (word && fx.mountMetalWord) {
        fx.mountMetalWord(word, {
          text: 'LedgerStack',
          font: '400 22px/1 "Instrument Serif", Georgia, serif',
          color: '#f6f1e7',
          theme: 'dark',
        });
      }
      if (button && fx.mountPulseButton) fx.mountPulseButton(button);
    };
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(paint);
    else paint();
  };
  document.head.appendChild(script);
}
mountLedgerEffects();
</script>
</body>
</html>
