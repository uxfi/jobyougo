<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Health Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/ui/assets/fonts.css">
<style>
  :root {
    --bg: #141a12;
    --card: #1f241d;
    --line: rgba(255,255,255,.07);
    --ink: #fff;
    --ink-2: rgba(255,255,255,.74);
    --ink-3: rgba(255,255,255,.58);
    --lime: #d4e660;
    --cream: #ece0a0;
    --lav: #caaade;
    --amber: #e89040;
    --ease: cubic-bezier(.22,1,.36,1);
    --gut: 12px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    font-family: var(--font-inter, 'Inter', -apple-system, BlinkMacSystemFont, sans-serif);
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button {
    appearance: none; background: none; border: 0; color: inherit; font: inherit;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

  /* The phone frame can be shorter than the content: the screen scrolls, the page never does. */
  .screen {
    width: 100%; height: 100%;
    max-width: 440px; margin: 0 auto;
    display: flex; flex-direction: column;
    overflow-x: hidden; overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: none;
    padding-bottom: var(--gut);
  }
  .screen::-webkit-scrollbar { display: none; }

  /* ── STATUS BAR ── */
  .status {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px 0;
    flex-shrink: 0;
  }
  .status-time { font-size: 14px; font-weight: 600; letter-spacing: -.3px; }
  .status-icons { display: flex; align-items: center; gap: 5px; }

  /* ── NAV ── */
  .nav { padding: 10px 20px 2px; flex-shrink: 0; text-align: center; }
  .nav h1 { font-size: 15px; font-weight: 600; letter-spacing: -.2px; }

  /* ── RINGS ── */
  .rings-wrap {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 4px 0;
    flex-shrink: 0;
  }
  /* Grows on a tall phone (390x844), stays compact in a short frame */
  .rings-wrap svg { display: block; width: clamp(168px, 27vh, 216px); height: auto; aspect-ratio: 1; }
  .ring { cursor: pointer; transition: opacity .24s var(--ease); }
  .rings-wrap[data-focus] .ring { opacity: .18; }
  .rings-wrap[data-focus="stress"] .ring[data-ring="stress"],
  .rings-wrap[data-focus="sleep"]  .ring[data-ring="sleep"],
  .rings-wrap[data-focus="calm"]   .ring[data-ring="calm"] { opacity: 1; }

  /* Arc and end cap share duration and easing, so the darker cap rides the tip of its arc. */
  .arc { animation: arc-draw 1.1s var(--ease) var(--d) backwards; }
  .cap-end {
    transform-origin: 100px 100px;
    transform: rotate(var(--a));
    animation: cap-sweep 1.1s var(--ease) var(--d) backwards;
  }
  @keyframes arc-draw  { from { stroke-dasharray: 0 999; } }
  @keyframes cap-sweep { from { transform: rotate(0deg); } }

  .ring-center {
    position: absolute; left: 50%; top: 50%;
    width: 64px;
    display: flex; flex-direction: column; align-items: center;
    text-align: center; pointer-events: none;
    opacity: 0; transform: translate(-50%,-50%) scale(.92);
    transition: opacity .2s var(--ease), transform .26s var(--ease);
  }
  .rings-wrap[data-focus] .ring-center { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  .ring-center span { font-size: 19px; font-weight: 700; letter-spacing: -.6px; line-height: 1; font-variant-numeric: tabular-nums; }
  .ring-center small { margin-top: 3px; font-size: 10px; color: var(--ink-2); white-space: nowrap; }

  /* ── STATS (they are the rings' legend: pressing one isolates its ring) ── */
  .stats {
    display: flex; justify-content: center; gap: 2px;
    padding: 0 8px 6px;
    flex-shrink: 0;
  }
  .stat {
    display: flex; flex-direction: column; align-items: flex-start;
    padding: 6px 8px; border-radius: 12px; text-align: left;
    transition: background-color .18s var(--ease), box-shadow .18s var(--ease);
    animation: rise .5s var(--ease) calc(.3s + var(--i) * 60ms) backwards;
  }
  .stat[aria-pressed="true"] { background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .stat-num { font-size: 18px; font-weight: 700; letter-spacing: -.5px; line-height: 1.15; white-space: nowrap; }
  .stat-num small { font-size: 12px; font-weight: 400; letter-spacing: 0; color: var(--ink-2); }
  .count { display: inline-block; font-variant-numeric: tabular-nums; }
  .stat-label {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--ink-3); margin-top: 2px; white-space: nowrap;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .dot-lime { background: var(--lime); }
  .dot-cream { background: var(--cream); }
  .dot-lav { background: var(--lav); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
  }

  /* ── CARDS ── */
  .card {
    margin: 0 var(--gut) var(--gut);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    flex-shrink: 0;
    animation: rise .6s var(--ease) var(--d) backwards;
  }
  .card-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    margin-bottom: 10px;
  }
  .card-head h2 { font-size: 13px; font-weight: 600; }
  .card-cap { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ── MOOD CHART ── */
  .mood-plot { position: relative; height: 94px; }
  .mood-svg {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 74px;
    overflow: visible;
    animation: wipe .9s var(--ease) .62s backwards;
  }
  .mood-line { fill: none; stroke: var(--lime); stroke-width: 1.75; stroke-linecap: round; opacity: .85; }
  @keyframes wipe {
    from { clip-path: inset(0 100% 0 0); }
    to   { clip-path: inset(0 0 0 0); }
  }

  .mood-days {
    position: absolute; inset: 0;
    display: grid; grid-template-columns: repeat(7, 1fr);
  }
  .day { position: relative; height: 100%; border-radius: 10px; transition: background-color .18s var(--ease); }
  .day:focus-visible { outline-offset: -2px; }
  .day-emoji {
    position: absolute; left: 50%; top: calc(var(--y) * 1px);
    width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 16px; line-height: 1;
    background: var(--card);
    transform: translate(-50%, calc(-50% + var(--lift, 0px))) scale(var(--sc, 1));
    transition: transform .22s var(--ease), box-shadow .22s var(--ease);
    animation: pop .45s var(--ease) calc(.7s + var(--i) * 60ms) backwards;
  }
  @keyframes pop {
    from { opacity: 0; transform: translate(-50%,-50%) scale(.5); }
  }
  .day[aria-checked="true"] .day-emoji { --sc: 1.12; box-shadow: 0 0 0 1.5px var(--lime); }
  .day-rule {
    position: absolute; left: 50%; width: 1px;
    top: calc(var(--y) * 1px + 15px); bottom: 18px;
    background: linear-gradient(rgba(212,230,96,.55), rgba(212,230,96,0));
    opacity: 0; transition: opacity .2s var(--ease);
  }
  .day[aria-checked="true"] .day-rule { opacity: 1; }
  .day-date {
    position: absolute; left: 0; right: 0; bottom: 0;
    font-size: 11px; line-height: 16px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    transition: color .18s var(--ease);
  }
  .day[aria-checked="true"] .day-date { color: var(--ink); font-weight: 600; }

  .mood-readout {
    margin-top: 8px;
    font-size: 12px; line-height: 16px; color: var(--ink-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mood-readout b { color: var(--ink); font-weight: 600; }

  /* ── WORK / LIFE: one day on a 24 h ribbon ── */
  .ribbon {
    position: relative; height: 14px; border-radius: 7px;
    background-color: rgba(255,255,255,.06);
    background-image:
      linear-gradient(90deg, transparent calc(25% - .5px), rgba(255,255,255,.14) 0 calc(25% + .5px), transparent 0),
      linear-gradient(90deg, transparent calc(50% - .5px), rgba(255,255,255,.14) 0 calc(50% + .5px), transparent 0),
      linear-gradient(90deg, transparent calc(75% - .5px), rgba(255,255,255,.14) 0 calc(75% + .5px), transparent 0);
  }
  .ribbon-fill {
    position: absolute; inset: 0; border-radius: inherit; overflow: hidden;
    animation: wipe .8s var(--ease) .78s backwards;
  }
  .seg {
    position: absolute; top: 0; bottom: 0; border-radius: 4px;
    transition: left .32s var(--ease), width .32s var(--ease), opacity .2s var(--ease);
  }
  .seg-sleep { background: linear-gradient(90deg, #c8b450, var(--cream)); }
  .seg-work  { background: linear-gradient(90deg, #d27c34, var(--amber)); }
  .seg-future {
    top: 0; bottom: 0; right: 0;
    background: repeating-linear-gradient(-45deg, rgba(255,255,255,.09) 0 2px, transparent 2px 5px);
    opacity: 0;
    transition: left .32s var(--ease), opacity .2s var(--ease);
  }
  .ribbon.is-today .seg-future { opacity: 1; }
  .now {
    position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px;
    background: var(--ink); border-radius: 1px;
    opacity: 0; visibility: hidden;
    transition: opacity .2s var(--ease), visibility .2s;
    animation: fade .3s var(--ease) 1.5s backwards; /* once, after the ribbon wipe */
  }
  .ribbon.is-today .now { opacity: 1; visibility: visible; }
  .ribbon:not(.is-today) .now::after { animation-play-state: paused; }
  .now::before, .now::after {
    content: ""; position: absolute; left: 50%; top: -3px;
    width: 6px; height: 6px; margin-left: -3px; border-radius: 50%;
    background: var(--ink);
  }
  .now::after { animation: pulse 2.4s ease-out 1.8s infinite; }
  @keyframes pulse {
    from { transform: scale(1); opacity: .7; }
    to   { transform: scale(3.2); opacity: 0; }
  }
  @keyframes fade { from { opacity: 0; } }

  .ribbon-scale {
    display: flex; justify-content: space-between;
    margin-top: 5px;
    font-size: 10px; line-height: 12px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .wl-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; }
  .wl-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .wl-item b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .key { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .key-work { background: var(--amber); }
  .key-sleep { background: var(--cream); }
  .key-free { box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); }
  .wl-insight { margin-top: 8px; font-size: 12px; line-height: 1.4; color: var(--ink-2); }

  /* Hover only where a pointer can hover: a tap on the phone must not leave a stuck state */
  @media (hover: hover) {
    .stat:hover:not([aria-pressed="true"]) { background: rgba(255,255,255,.04); }
    .day:hover { background: rgba(255,255,255,.03); }
    .day:hover .day-emoji { --lift: -2px; }
    .day:hover .day-date { color: var(--ink-2); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="screen">

  <!-- Status bar (decorative) -->
  <div class="status" aria-hidden="true">
    <div class="status-time">9:41</div>
    <div class="status-icons">
      <svg width="16" height="11" viewBox="0 0 16 11" fill="white">
        <rect x="0" y="7" width="3" height="4" rx=".7" opacity=".3"/>
        <rect x="4.3" y="4.5" width="3" height="6.5" rx=".7" opacity=".55"/>
        <rect x="8.6" y="2" width="3" height="9" rx=".7" opacity=".8"/>
        <rect x="12.9" y="0" width="3" height="11" rx=".7"/>
      </svg>
      <svg width="14" height="11" viewBox="0 0 20 14" fill="none">
        <path d="M1 4.5C4.5 1 15.5 1 19 4.5" stroke="white" stroke-width="2" stroke-linecap="round" opacity=".3"/>
        <path d="M4 7.5C6.5 5 13.5 5 16 7.5" stroke="white" stroke-width="2" stroke-linecap="round" opacity=".6"/>
        <path d="M7.5 10.5C8.8 9.2 11.2 9.2 12.5 10.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <circle cx="10" cy="13.5" r="1.2" fill="white"/>
      </svg>
      <svg width="23" height="11" viewBox="0 0 26 12" fill="none">
        <rect x=".5" y=".5" width="21" height="11" rx="3" stroke="white" stroke-opacity=".3"/>
        <rect x="2" y="2" width="14" height="8" rx="2" fill="white"/>
        <path d="M23 4v4a2 2 0 0 0 0-4z" fill="white" opacity=".4"/>
      </svg>
    </div>
  </div>

  <header class="nav">
    <h1>Health Overview</h1>
  </header>

  <!-- Goal rings: each arc is the stat below it, as a share of its goal -->
  <div class="rings-wrap" id="rings">
    <svg width="176" height="176" viewBox="0 0 200 200" overflow="visible" role="img"
      aria-label="Goals: no stress 56 of 70 days, sleep quality 79 percent, meditation 23 of 40 days">
      <defs>
        <linearGradient id="g-lime" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#d4e660"/>
          <stop offset="100%" stop-color="#a8c038"/>
        </linearGradient>
        <linearGradient id="g-cream" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ece0a0"/>
          <stop offset="100%" stop-color="#c8b450"/>
        </linearGradient>
        <linearGradient id="g-lav" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#caaade"/>
          <stop offset="100%" stop-color="#9870c4"/>
        </linearGradient>
      </defs>

      <!-- No stress: 56 / 70 days = 80% -->
      <g class="ring" data-ring="stress">
        <circle cx="100" cy="100" r="78" fill="none" stroke="rgba(212,230,96,.1)" stroke-width="13"/>
        <circle class="arc" style="--d:.1s" cx="100" cy="100" r="78" fill="none" stroke="url(#g-lime)" stroke-width="13"
          stroke-dasharray="392.07 490.09" stroke-linecap="round" transform="rotate(-90 100 100)"/>
        <circle cx="100" cy="22" r="6.5" fill="#d4e660"/>
        <circle class="cap-end" style="--d:.1s;--a:288deg" cx="100" cy="22" r="6.5" fill="#a0bc30"/>
      </g>

      <!-- Sleep quality: 79% -->
      <g class="ring" data-ring="sleep">
        <circle cx="100" cy="100" r="61" fill="none" stroke="rgba(236,224,160,.1)" stroke-width="13"/>
        <circle class="arc" style="--d:.18s" cx="100" cy="100" r="61" fill="none" stroke="url(#g-cream)" stroke-width="13"
          stroke-dasharray="302.78 383.27" stroke-linecap="round" transform="rotate(-90 100 100)"/>
        <circle cx="100" cy="39" r="6.5" fill="#ece0a0"/>
        <circle class="cap-end" style="--d:.18s;--a:284.4deg" cx="100" cy="39" r="6.5" fill="#c4a840"/>
      </g>

      <!-- Meditation: 23 / 40 days = 57.5% -->
      <g class="ring" data-ring="calm">
        <circle cx="100" cy="100" r="44" fill="none" stroke="rgba(202,170,222,.1)" stroke-width="13"/>
        <circle class="arc" style="--d:.26s" cx="100" cy="100" r="44" fill="none" stroke="url(#g-lav)" stroke-width="13"
          stroke-dasharray="158.96 276.46" stroke-linecap="round" transform="rotate(-90 100 100)"/>
        <circle cx="100" cy="56" r="6.5" fill="#caaade"/>
        <circle class="cap-end" style="--d:.26s;--a:207deg" cx="100" cy="56" r="6.5" fill="#9060bc"/>
      </g>
    </svg>
    <div class="ring-center" id="ring-center" aria-hidden="true">
      <span><b>0</b>%</span>
      <small></small>
    </div>
  </div>

  <div class="stats" role="group" aria-label="Show one ring">
    <button class="stat" type="button" aria-pressed="false" style="--i:0" data-ring="stress" data-pct="80" data-sub="of 70 days">
      <span class="stat-num"><span class="count">56</span><small>/70 days</small></span>
      <span class="stat-label"><span class="dot dot-lime"></span>No stress</span>
    </button>
    <button class="stat" type="button" aria-pressed="false" style="--i:1" data-ring="sleep" data-pct="79" data-sub="quality">
      <span class="stat-num"><span class="count">79</span><small>%</small></span>
      <span class="stat-label"><span class="dot dot-cream"></span>Sleep quality</span>
    </button>
    <button class="stat" type="button" aria-pressed="false" style="--i:2" data-ring="calm" data-pct="58" data-sub="of 40 days">
      <span class="stat-num"><span class="count">23</span><small>/40 days</small></span>
      <span class="stat-label"><span class="dot dot-lav"></span>Meditation</span>
    </button>
  </div>

  <!-- Mood: one point per day; picking a day also drives the work/life ribbon below -->
  <section class="card" style="--d:.45s" aria-labelledby="mood-h">
    <div class="card-head">
      <h2 id="mood-h">Mood tracker</h2>
      <span class="card-cap">9–15 Oct</span>
    </div>
    <div class="mood-plot">
      <svg class="mood-svg" viewBox="0 0 100 74" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="g-mood" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#d4e660" stop-opacity=".2"/>
            <stop offset="100%" stop-color="#d4e660" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path id="mood-area" fill="url(#g-mood)"/>
        <path id="mood-line" class="mood-line" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="mood-days" role="radiogroup" aria-label="Pick a day">
        <button class="day" type="button" role="radio" aria-checked="false" tabindex="-1" style="--y:13;--i:0" aria-label="Fri 9 Oct, happy"
          data-label="Fri 9 Oct" data-mood="Happy" data-note="Long walk at lunch" data-sleep="0,7.5" data-work="9,17.5">
          <span class="day-rule"></span><span class="day-emoji" aria-hidden="true">😊</span><span class="day-date">9</span>
        </button>
        <button class="day" type="button" role="radio" aria-checked="false" tabindex="-1" style="--y:20.7;--i:1" aria-label="Sat 10 Oct, happy"
          data-label="Sat 10 Oct" data-mood="Happy" data-note="No alarm, slow breakfast" data-sleep="0.5,8.5" data-work="">
          <span class="day-rule"></span><span class="day-emoji" aria-hidden="true">😊</span><span class="day-date">10</span>
        </button>
        <button class="day" type="button" role="radio" aria-checked="false" tabindex="-1" style="--y:33.2;--i:2" aria-label="Sun 11 Oct, worried"
          data-label="Sun 11 Oct" data-mood="Worried" data-note="Opened the work inbox" data-sleep="1,7" data-work="14,17">
          <span class="day-rule"></span><span class="day-emoji" aria-hidden="true">😟</span><span class="day-date">11</span>
        </button>
        <button class="day" type="button" role="radio" aria-checked="false" tabindex="-1" style="--y:13;--i:3" aria-label="Mon 12 Oct, happy"
          data-label="Mon 12 Oct" data-mood="Happy" data-note="Good team sync" data-sleep="0,7.5" data-work="9,18">
          <span class="day-rule"></span><span class="day-emoji" aria-hidden="true">😊</span><span class="day-date">12</span>
        </button>
        <button class="day" type="button" role="radio" aria-checked="false" tabindex="-1" style="--y:48.5;--i:4" aria-label="Tue 13 Oct, frustrated"
          data-label="Tue 13 Oct" data-mood="Frustrated" data-note="Deadline moved up" data-sleep="0.5,6.5" data-work="8.5,19.5">
          <span class="day-rule"></span><span class="day-emoji" aria-hidden="true">😤</span><span class="day-date">13</span>
        </button>
        <button class="day" type="button" role="radio" aria-checked="false" tabindex="-1" style="--y:61;--i:5" aria-label="Wed 14 Oct, angry"
          data-label="Wed 14 Oct" data-mood="Angry" data-note="Skipped lunch, late call" data-sleep="0.75,6.25" data-work="8.5,19">
          <span class="day-rule"></span><span class="day-emoji" aria-hidden="true">😠</span><span class="day-date">14</span>
        </button>
        <button class="day" type="button" role="radio" aria-checked="true" tabindex="0" style="--y:23.1;--i:6" aria-label="Today, Thu 15 Oct, relieved"
          data-label="Thu 15 Oct" data-mood="Relieved" data-note="Slept in, calmer start" data-sleep="0,7.5" data-work="9,9.683" data-now="9.683">
          <span class="day-rule"></span><span class="day-emoji" aria-hidden="true">😌</span><span class="day-date">Today</span>
        </button>
      </div>
    </div>
    <p class="mood-readout"><b id="mood-word">Relieved</b> · <span id="mood-note" aria-live="polite">Slept in, calmer start</span></p>
  </section>

  <!-- Work / life balance for the picked day -->
  <section class="card" style="--d:.55s" aria-labelledby="wl-h">
    <div class="card-head">
      <h2 id="wl-h">Work/life balance</h2>
      <span class="card-cap" id="wl-day">Today, so far</span>
    </div>
    <div class="ribbon is-today" id="wl-ribbon" role="img" aria-label="Today so far: sleep 7.5h, work 41m, free 1.5h">
      <div class="ribbon-fill">
        <span class="seg seg-sleep" id="seg-sleep" style="left:0%;width:31.25%"></span>
        <span class="seg seg-work" id="seg-work" style="left:37.5%;width:2.846%"></span>
        <span class="seg seg-future" id="seg-future" style="left:40.346%"></span>
      </div>
      <span class="now" id="seg-now" style="left:40.346%"></span>
    </div>
    <div class="ribbon-scale" aria-hidden="true"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
    <div class="wl-legend">
      <span class="wl-item"><i class="key key-work"></i>Work <b id="v-work">41m</b></span>
      <span class="wl-item"><i class="key key-sleep"></i>Sleep <b id="v-sleep">7.5h</b></span>
      <span class="wl-item"><i class="key key-free"></i>Free <b id="v-free">1.5h</b></span>
    </div>
    <p class="wl-insight" id="wl-insight">Day in progress. Sleep goal met.</p>
  </section>

</main>
<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SLEEP_GOAL = 7.5, WORK_CAP = 9;

  function $(id) { return document.getElementById(id); }
  function fmt(h) {
    if (h <= 0) return '0h';
    if (h < 1) return Math.round(h * 60) + 'm';
    return (Math.round(h * 10) / 10) + 'h';
  }
  function tween(el, from, to, dur, delay) {
    cancelAnimationFrame(el._raf); clearTimeout(el._wait);
    if (reduce) { el.textContent = to; return; }
    el._wait = setTimeout(function () {
      var t0 = null;
      function step(now) {
        if (t0 === null) t0 = now;
        var t = Math.min((now - t0) / dur, 1);
        el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - t, 3)));
        if (t < 1) el._raf = requestAnimationFrame(step);
      }
      el._raf = requestAnimationFrame(step);
    }, delay || 0);
  }

  /* Stat count-up, timed with the stats' rise. Width is reserved so the row does not jitter. */
  document.querySelectorAll('.count').forEach(function (el, i) {
    var target = +el.textContent;
    el.style.minWidth = String(target).length + 'ch';
    if (reduce) return;
    el.textContent = '0';
    tween(el, 0, target, 900, 300 + i * 60);
  });

  /* Stats as the rings' legend: press one to isolate its ring and read its share of the goal. */
  var rings = $('rings'), cNum = $('ring-center').querySelector('b'), cSub = $('ring-center').querySelector('small');
  var stats = [].slice.call(document.querySelectorAll('.stat'));
  stats.forEach(function (b) {
    b.addEventListener('click', function () {
      var on = b.getAttribute('aria-pressed') !== 'true';
      stats.forEach(function (x) { x.setAttribute('aria-pressed', String(on && x === b)); });
      if (!on) { rings.removeAttribute('data-focus'); return; }
      var from = rings.hasAttribute('data-focus') ? (+cNum.textContent || 0) : 0;
      rings.setAttribute('data-focus', b.dataset.ring);
      cSub.textContent = b.dataset.sub;
      tween(cNum, from, +b.dataset.pct, 420, 0);
    });
  });
  /* A tap on a ring does the same as its stat (the stats stay the keyboard path). */
  [].slice.call(document.querySelectorAll('.ring')).forEach(function (g) {
    g.addEventListener('click', function () {
      var b = stats.filter(function (x) { return x.dataset.ring === g.dataset.ring; })[0];
      if (b) b.click();
    });
  });

  /* Mood curve: a Catmull-Rom spline through the emoji centres, flat to both edges. */
  var days = [].slice.call(document.querySelectorAll('.day'));
  var pts = days.map(function (b, i) {
    return [(i + 0.5) / days.length * 100, parseFloat(b.style.getPropertyValue('--y'))];
  });
  pts.unshift([0, pts[0][1]]);
  pts.push([100, pts[pts.length - 1][1]]);
  function r(n) { return Math.round(n * 100) / 100; }
  var d = 'M' + r(pts[0][0]) + ',' + r(pts[0][1]);
  for (var i = 0; i < pts.length - 1; i++) {
    var p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ' C' + r(p1[0] + (p2[0] - p0[0]) / 6) + ',' + r(p1[1] + (p2[1] - p0[1]) / 6) +
         ' ' + r(p2[0] - (p3[0] - p1[0]) / 6) + ',' + r(p2[1] - (p3[1] - p1[1]) / 6) +
         ' ' + r(p2[0]) + ',' + r(p2[1]);
  }
  $('mood-line').setAttribute('d', d);
  $('mood-area').setAttribute('d', d + ' L100,74 L0,74 Z');

  /* One picked day drives the mood readout and the 24 h ribbon. */
  var ribbon = $('wl-ribbon'), segSleep = $('seg-sleep'), segWork = $('seg-work');
  var segFuture = $('seg-future'), segNow = $('seg-now');
  function span(s) { return s ? s.split(',').map(Number) : null; }
  function place(el, range) {
    if (!range) { el.style.width = '0%'; el.style.opacity = '0'; return; }
    el.style.opacity = '';
    el.style.left = (range[0] / 24 * 100) + '%';
    el.style.width = ((range[1] - range[0]) / 24 * 100) + '%';
  }
  function insight(sleep, work, today) {
    var parts = [];
    if (work > WORK_CAP) parts.push('work ' + fmt(work - WORK_CAP) + ' over the ' + WORK_CAP + 'h cap');
    if (sleep < SLEEP_GOAL) parts.push('sleep ' + fmt(SLEEP_GOAL - sleep) + ' short of ' + SLEEP_GOAL + 'h');
    var s;
    if (parts.length) s = parts.join(', ');
    else if (today) s = 'sleep goal met';
    else s = work ? 'within the ' + WORK_CAP + 'h work cap and ' + SLEEP_GOAL + 'h sleep goal' : 'rest day, sleep goal met';
    s = s.charAt(0).toUpperCase() + s.slice(1) + '.';
    return today ? 'Day in progress. ' + s : s;
  }
  function select(i, moveFocus) {
    days.forEach(function (b, j) {
      b.setAttribute('aria-checked', String(j === i));
      b.tabIndex = j === i ? 0 : -1;
    });
    var b = days[i], ds = b.dataset;
    if (moveFocus) b.focus();
    $('mood-word').textContent = ds.mood;
    $('mood-note').textContent = ds.note;

    var sleep = span(ds.sleep), work = span(ds.work);
    var today = ds.now !== undefined, now = today ? +ds.now : 24;
    var hS = sleep ? sleep[1] - sleep[0] : 0, hW = work ? work[1] - work[0] : 0, hF = now - hS - hW;
    place(segSleep, sleep);
    place(segWork, work);
    ribbon.classList.toggle('is-today', today);
    if (today) { segFuture.style.left = segNow.style.left = (now / 24 * 100) + '%'; }
    $('v-work').textContent = fmt(hW);
    $('v-sleep').textContent = fmt(hS);
    $('v-free').textContent = fmt(hF);
    $('wl-day').textContent = today ? 'Today, so far' : ds.label;
    $('wl-insight').textContent = insight(hS, hW, today);
    ribbon.setAttribute('aria-label', (today ? 'Today so far' : ds.label) +
      ': sleep ' + fmt(hS) + ', work ' + fmt(hW) + ', free ' + fmt(hF));
  }
  days.forEach(function (b, i) {
    b.addEventListener('click', function () { select(i); });
    b.addEventListener('keydown', function (e) {
      var n = days.length, j = null;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') j = (i + 1) % n;
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') j = (i - 1 + n) % n;
      else if (e.key === 'Home') j = 0;
      else if (e.key === 'End') j = n - 1;
      if (j !== null) { e.preventDefault(); select(j, true); }
    });
  });
  select(days.length - 1);
})();
</script>
</body>
</html>
