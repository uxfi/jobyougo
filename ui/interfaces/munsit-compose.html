<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Munsit — Home</title>
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="../assets/munsit-mobile.css">
</head>
<body class="screen-compose">
  <main class="screen">
    <div class="statusbar">
      <span>9:41</span>
      <div class="status-icons"><span>5G</span><span class="dot"></span><span>100%</span></div>
    </div>

    <section class="compose-home">
      <div class="compose-shell">
        <div class="compose-topbar">
          <div class="compose-profile">
            <div class="compose-avatar">
              <img src="https://images.unsplash.com/photo-1664359028599-c3ac398825e0?auto=format&fit=crop&fm=jpg&q=80&w=240&h=240" alt="Profile photo">
            </div>
            <div class="compose-profile-copy">
              <span>Welcome</span>
              <strong>Naiem</strong>
            </div>
          </div>
          <div class="compose-top-actions">
            <button class="compose-action" aria-label="Notifications">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
            </button>
            <button class="compose-action theme-toggle" id="theme-toggle" aria-label="Switch to light theme" aria-pressed="false" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.7 6.7 0 0 0 9.8 9.8Z"/></svg>
            </button>
          </div>
        </div>

        <h1 class="compose-title">What would you like to do today?</h1>

        <div class="compose-grid">
          <article class="compose-tile tile-tts">
            <div class="compose-tile-head">
              <span class="compose-tile-icon is-chat">
                <span class="compose-icon-core">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 17.2c-2.3-1.3-3.8-3.6-3.8-6.2C3.2 6.6 7.1 3 12 3s8.8 3.6 8.8 8-3.9 8-8.8 8c-1.2 0-2.3-.2-3.4-.6L4 20l1.7-4.1Z"/></svg>
                </span>
              </span>
            </div>
            <div class="compose-tile-small">Chat</div>
            <div class="compose-tile-copy small">Write it, refine it, turn it into speech.</div>
          </article>

          <article class="compose-tile tile-stt">
            <div class="compose-tile-head">
              <span class="compose-tile-icon is-speak">
                <span class="compose-icon-core">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4a3 3 0 0 1 3 3v4a3 3 0 1 1-6 0V7a3 3 0 0 1 3-3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8.5 21h7"/></svg>
                </span>
              </span>
            </div>
            <div class="compose-tile-small">Speak</div>
            <div class="compose-tile-copy small">Turn voice notes into clean transcripts.</div>
          </article>
        </div>

        <section class="compose-clone-banner">
          <div class="compose-clone-main">
            <div class="compose-clone-copy">
              <div class="compose-tile-small">Voice Clone</div>
              <div class="compose-tile-copy small">Create and reuse consent-based Arabic voice models with identity-safe presets.</div>
            </div>
            <div class="compose-clone-orbit" aria-label="Voice clone orbit">
              <div class="compose-clone-core">
                <img src="https://api.dicebear.com/9.x/notionists/svg?seed=Naiem&backgroundColor=b6e3f4,c0aede,d1d4f9" alt="Primary clone avatar">
              </div>
              <div class="compose-clone-ring ring-one"></div>
              <div class="compose-clone-ring ring-two"></div>
              <div class="compose-clone-node orbit-a">
                <div class="compose-clone-face face-sm">
                  <img src="https://api.dicebear.com/9.x/notionists/svg?seed=Layla&backgroundColor=fde2e4,ffd6a5,ffcad4" alt="Clone avatar">
                </div>
              </div>
              <div class="compose-clone-node orbit-b">
                <div class="compose-clone-face face-lg">
                  <img src="https://api.dicebear.com/9.x/notionists/svg?seed=Omar&backgroundColor=d1d4f9,c0aede,b6e3f4" alt="Clone avatar">
                </div>
              </div>
              <div class="compose-clone-node orbit-c">
                <div class="compose-clone-face face-md">
                  <img src="https://api.dicebear.com/9.x/notionists/svg?seed=Mira&backgroundColor=f1f0ff,ffd6e0,e0c3fc" alt="Clone avatar">
                </div>
              </div>
              <div class="compose-clone-node orbit-d">
                <div class="compose-clone-face face-sm">
                  <img src="https://api.dicebear.com/9.x/notionists/svg?seed=Youssef&backgroundColor=b6e3f4,f1f0ff,c0aede" alt="Clone avatar">
                </div>
              </div>
              <div class="compose-clone-node orbit-e">
                <div class="compose-clone-face face-xs">
                  <img src="https://api.dicebear.com/9.x/notionists/svg?seed=Hana&backgroundColor=ffd6e0,fde2e4,e0c3fc" alt="Clone avatar">
                </div>
              </div>
            </div>
          </div>
        </section>

        <div class="compose-promptbar">
          <button class="compose-shiny-cta" type="button" aria-label="Text to Speech Studio">
            <span>
              <strong>Text to Speech Studio</strong>
              <small>Paste Arabic text, choose a voice, and generate in one flow.</small>
            </span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
          </button>
        </div>

        <nav class="compose-nav" aria-label="Primary">
          <div class="compose-nav-item active">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1v-9.5Z"/></svg>
            <span>Home</span>
          </div>
          <div class="compose-nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M19 11a7 7 0 0 1-14 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
            <span>Voices</span>
          </div>
          <div class="compose-nav-center" role="button" aria-label="New voice note">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
              <line x1="2"  y1="11.5" x2="2"  y2="12.5"/>
              <line x1="7"  y1="9"    x2="7"  y2="15"/>
              <line x1="12" y1="6"    x2="12" y2="18"/>
              <line x1="17" y1="9"    x2="17" y2="15"/>
              <line x1="22" y1="11.5" x2="22" y2="12.5"/>
            </svg>
          </div>
          <div class="compose-nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
            <span>History</span>
          </div>
          <div class="compose-nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
            <span>Profile</span>
          </div>
        </nav>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const storageKey = 'munsit-compose-theme';
      const body = document.body;
      const toggle = document.getElementById('theme-toggle');
      if (!toggle) return;

      const moonIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.7 6.7 0 0 0 9.8 9.8Z"/></svg>';
      const sunIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.1M12 19.1v2.1M21.2 12h-2.1M4.9 12H2.8M18.5 5.5 17 7M7 17l-1.5 1.5M18.5 18.5 17 17M7 7 5.5 5.5"/></svg>';

      function applyTheme(theme) {
        const isLight = theme === 'light';
        body.classList.toggle('theme-light', isLight);
        toggle.setAttribute('aria-pressed', String(isLight));
        toggle.setAttribute('aria-label', isLight ? 'Switch to dark theme' : 'Switch to light theme');
        toggle.innerHTML = isLight ? sunIcon : moonIcon;
      }

      const savedTheme = window.localStorage.getItem(storageKey);
      applyTheme(savedTheme === 'light' ? 'light' : 'dark');

      toggle.addEventListener('click', () => {
        const nextTheme = body.classList.contains('theme-light') ? 'dark' : 'light';
        window.localStorage.setItem(storageKey, nextTheme);
        applyTheme(nextTheme);
      });
    })();
  </script>
</body>
</html>
