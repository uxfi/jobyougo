    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }
    /* Portfolio embed: hide the internal design/dev switchers */
    .project-settings-trigger:not(.currency-switcher-trigger), .dash-header-admin-switch, .header-menu-trigger.is-admin { display: none !important; }
    /* Prefer white shell before React hydrates (CSS default .shell is dark). */
    html[data-oa-theme="light"] { color-scheme: light; background: #fafaf7; }
    html[data-oa-theme="dark"] { color-scheme: dark; background: #05070a; }
    </style>
    <script>
    /* Force theme from ?theme= before the app boots. Default: light/white. */
    (function () {
      try {
        var q = new URLSearchParams(window.location.search);
        var t = q.get('theme');
        if (t !== 'dark' && t !== 'light') t = 'light';
        document.documentElement.dataset.oaTheme = t;
        document.documentElement.style.colorScheme = t;
        try { localStorage.setItem('oneasset-theme', t); } catch (e) {}
        if (t === 'light') {
          var keepLight = function () {
            var shell = document.querySelector('.shell');
            if (!shell) return;
            if (document.documentElement.dataset.oaTheme !== 'light') return;
            if (!shell.classList.contains('light')) shell.classList.add('light');
          };
          var mo = new MutationObserver(keepLight);
          mo.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'data-oa-theme'] });
          document.addEventListener('DOMContentLoaded', keepLight);
          setTimeout(function () { try { mo.disconnect(); } catch (e) {} }, 8000);
        }
      } catch (e) {}
    })();
    </script>
