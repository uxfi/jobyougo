<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PM - dashboard</title>
    <meta name="description" content="Streamline property management with an intuitive dashboard that consolidates tenant information, maintenance requests, and financial tracking for efficient operations." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }
    /* Portfolio embed: hide the internal design/dev switchers */
    .project-settings-trigger:not(.currency-switcher-trigger), .dash-header-admin-switch, .header-menu-trigger.is-admin { display: none !important; }
    /* Prefer white shell before React hydrates (CSS default .shell is dark). */
    html[data-oa-theme="light"] { color-scheme: light; background: #fafaf7; }
    html[data-oa-theme="dark"] { color-scheme: dark; background: #05070a; }
    html[data-oa-unlocked] #oa-gate { display: none; }
    #oa-gate {
      position: fixed; inset: 0; z-index: 100000;
      display: grid; place-items: center;
      background: #fafaf7; color: #0d1124;
      font-family: Inter, sans-serif;
    }
    #oa-gate form {
      width: min(360px, calc(100% - 40px));
      display: grid; gap: 12px;
      padding: 28px; border-radius: 18px;
      background: #fff; border: 1px solid #e3e7f3;
      box-shadow: 0 24px 60px rgba(28,40,110,.12);
    }
    #oa-gate h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.02em; }
    #oa-gate p { margin: 0; font-size: 14px; line-height: 1.5; color: #4a506a; }
    #oa-gate input {
      width: 100%; box-sizing: border-box;
      padding: 12px 14px; border-radius: 12px;
      border: 1px solid #e3e7f3; background: #fafaf7;
      font: 500 15px/1.2 Inter, sans-serif; color: #0d1124;
    }
    #oa-gate input:focus { outline: 2px solid #3b59ff; border-color: transparent; }
    #oa-gate button {
      border: 0; border-radius: 12px; padding: 12px 14px; cursor: pointer;
      background: #3b59ff; color: #fff; font: 600 14px/1 Inter, sans-serif;
    }
    #oa-gate-err { color: #b42318; font-size: 13px; }
    </style>
    <script>
    /* Force theme from ?theme= before the app boots. Default: light/white. */
    (function () {
      try {
        var q = new URLSearchParams(window.location.search);
        var t = q.get('theme');
        if (t !== 'dark' && t !== 'light') t = 'light';
        document.documentElement.dataset.oaTheme = t;
        document.documentElement.style.colorScheme = t;
        try { localStorage.setItem('oneasset-theme', t); } catch (e) {}
        if (t === 'light') {
          var keepLight = function () {
            var shell = document.querySelector('.shell');
            if (!shell) return;
            if (document.documentElement.dataset.oaTheme !== 'light') return;
            if (!shell.classList.contains('light')) shell.classList.add('light');
          };
          var mo = new MutationObserver(keepLight);
          mo.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'data-oa-theme'] });
          document.addEventListener('DOMContentLoaded', keepLight);
          setTimeout(function () { try { mo.disconnect(); } catch (e) {} }, 8000);
        }
      } catch (e) {}
    })();
    </script>
    <script>
    /* Soft gate for the portfolio embed and the full-screen tab. Same origin, so one unlock covers both. */
    (function () {
      var PASSWORD = 'oneasset';
      var KEY = 'oa-demo-ok';
      function boot() {
        if (document.documentElement.dataset.oaBooted) return;
        document.documentElement.dataset.oaBooted = '1';
        document.documentElement.dataset.oaUnlocked = '1';
        var gate = document.getElementById('oa-gate');
        if (gate) gate.remove();
        var root = document.getElementById('root');
        if (root) root.hidden = false;
        var s = document.createElement('script');
        s.type = 'module';
        s.crossOrigin = 'anonymous';
        s.src = '/demos/oneasset/assets/main-CkwmdojU.js';
        document.head.appendChild(s);
      }
      window.__oaBootDemo = boot;
      try {
        if (sessionStorage.getItem(KEY) === '1') document.documentElement.dataset.oaUnlocked = '1';
      } catch (e) {}
      document.addEventListener('DOMContentLoaded', function () {
        if (document.documentElement.dataset.oaUnlocked === '1') { boot(); return; }
        var form = document.getElementById('oa-gate-form');
        var input = document.getElementById('oa-gate-pass');
        var err = document.getElementById('oa-gate-err');
        if (!form || !input) return;
        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          if (input.value !== PASSWORD) {
            if (err) err.hidden = false;
            input.select();
            return;
          }
          try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
          boot();
        });
        input.focus();
      });
    })();
    </script>
    <link rel="modulepreload" crossorigin href="/demos/oneasset/assets/workspace-navigation-CnubU-Pg.js">
    <link rel="modulepreload" crossorigin href="/demos/oneasset/assets/vendor-react-DUX7-3KW.js">
    <link rel="modulepreload" crossorigin href="/demos/oneasset/assets/vendor-radix-D5bgM0J6.js">
    <link rel="modulepreload" crossorigin href="/demos/oneasset/assets/vendor-charts-DV5HzagS.js">
    <link rel="modulepreload" crossorigin href="/demos/oneasset/assets/vendor-icons-BDFm4FbF.js">
    <link rel="stylesheet" crossorigin href="/demos/oneasset/assets/main-icie1ROI.css">
  </head>
  <body>
    <div id="oa-gate">
      <form id="oa-gate-form" autocomplete="off">
        <h1>Live prototype</h1>
        <p>Enter the password to open the OneAsset prototype.</p>
        <input id="oa-gate-pass" type="password" name="password" placeholder="Password" autocomplete="current-password" required>
        <p id="oa-gate-err" hidden>Wrong password.</p>
        <button type="submit">Open</button>
      </form>
    </div>
    <div id="root" hidden></div>
  </body>
</html>
