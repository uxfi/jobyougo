<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BeReal. posting flow — prototype</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --s1:#0e0e0f; --s2:#1a1a1c; --tx:#fff; --mut:rgba(255,255,255,.52); --line:rgba(255,255,255,.1); --late:#ff453a; --ok:#30d158; --acc:#c6f432;
    --disp:"Bricolage Grotesque","SF Pro Rounded",ui-rounded,-apple-system,system-ui,sans-serif; --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
    --spring:cubic-bezier(.34,1.56,.64,1); --soft:cubic-bezier(.2,.8,.2,1); }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--bg); color:var(--tx); font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif; overflow:hidden; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  button:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .app { position:relative; width:100%; height:100%; max-width:430px; margin:0 auto; overflow:hidden; overflow:clip; }
  .scr { position:absolute; inset:0; display:flex; flex-direction:column; padding:54px 16px 26px; opacity:0; pointer-events:none; transform:translateX(24px) scale(.985); transition:opacity .3s ease, transform .45s var(--soft); }
  .scr.on { opacity:1; pointer-events:auto; transform:none; }
  .top { display:flex; align-items:center; justify-content:space-between; height:38px; margin-bottom:12px; }
  .top b { font:600 16px/1 var(--disp); letter-spacing:-.01em; }
  .logo { font:800 23px/1 var(--disp); letter-spacing:-.03em; }

  /* liquid glass */
  .glass { position:relative; background:linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.05) 45%, rgba(255,255,255,.08));
    -webkit-backdrop-filter:blur(18px) saturate(1.8); backdrop-filter:blur(18px) saturate(1.8);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.38), inset 0 -1px 0 rgba(255,255,255,.08), inset 1px 0 0 rgba(255,255,255,.1), inset -1px 0 0 rgba(255,255,255,.06), 0 8px 24px rgba(0,0,0,.35); }
  .glass::after { content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; background:radial-gradient(120% 60% at 30% -10%, rgba(255,255,255,.22), transparent 55%); mix-blend-mode:screen; }
  .ico { width:38px; height:38px; border-radius:50%; display:grid; place-items:center; transition:transform .4s var(--spring); }
  .ico:active { transform:scale(.86); }
  .ico svg { width:18px; height:18px; }
  .timer { font:600 13px/1 var(--disp); font-variant-numeric:tabular-nums; height:30px; padding:0 11px; border-radius:15px; display:inline-flex; align-items:center; gap:6px; }
  .timer .ic { color:var(--acc); }
  .timer.late { color:#ff8a80; } .timer.late .ic { color:var(--late); }

  /* photos */
  .ph { position:absolute; inset:0; border-radius:inherit; overflow:hidden; background:#111 center/cover no-repeat; }
  .ph-back { background-image:url(img/back-cafe.webp); } .ph-front { background-image:url(img/front-hugo.webp); }
  .ph-b2 { background-image:url(img/back-park.webp); } .ph-f2 { background-image:url(img/front-julie.webp); }
  .ph-b3 { background-image:url(img/back-desk.webp); } .ph-f3 { background-image:url(img/front-sam.webp); }
  .av.img { background:#222 center/cover; color:transparent; }
  .dual { position:relative; border-radius:24px; background:#111; overflow:hidden; isolation:isolate; }
  .dual .pip { position:absolute; z-index:3; top:12px; left:12px; width:31%; aspect-ratio:3/4; border-radius:15px; border:2px solid #000; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.5); transition:transform .5s var(--spring); }

  /* capture */
  .cam { flex:1; aspect-ratio:3/4; max-height:calc(100% - 150px); align-self:center; width:100%; transition:border-radius .6s var(--soft), transform .6s var(--spring); }
  .cam .pip { cursor:pointer; }
  .count { position:absolute; inset:0; z-index:6; display:grid; place-items:center; font:800 104px/1 var(--disp); text-shadow:0 6px 30px rgba(0,0,0,.45); pointer-events:none; }
  .count span { display:block; animation:cnt .45s var(--spring) both; }
  @keyframes cnt { 0% { transform:scale(.4); opacity:0 } 55% { transform:scale(1.12); opacity:1 } 100% { transform:scale(1) } }
  .shut-row { display:flex; align-items:center; justify-content:space-between; padding:22px 26px 0; margin-top:auto; }
  .shut { position:relative; width:80px; height:80px; border-radius:50%; display:grid; place-items:center; touch-action:none; }
  .shut::before { content:''; position:absolute; inset:0; border-radius:50%; border:4px solid #fff; transition:transform .5s var(--spring); }
  .shut i { width:62px; height:62px; border-radius:31px; background:#fff; transition:transform .45s var(--spring), border-radius .45s var(--spring), background .25s; }
  .shut.squash { animation:squash .55s var(--soft); }
  @keyframes squash { 0%{transform:scale(1)} 18%{transform:scale(1.14,.84)} 38%{transform:scale(.9,1.1)} 58%{transform:scale(1.05,.96)} 78%{transform:scale(.98,1.02)} 100%{transform:scale(1)} }
  .shut:active i { transform:scale(.86); }
  .rec .shut i { transform:scale(.46); border-radius:12px; background:var(--late); }
  .rec .shut::before { transform:scale(1.12); }
  .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:9; }
  .flash.go { animation:fl .35s ease; } @keyframes fl { 0%{opacity:.9} 100%{opacity:0} }

  /* liquid recording edge */
  .rline { position:absolute; inset:0; width:100%; height:100%; z-index:5; pointer-events:none; opacity:0; transition:opacity .3s; overflow:visible; }
  .rec .rline { opacity:1; }
  .rline rect { fill:none; stroke-linecap:round; }
  .rline .base { stroke:rgba(255,255,255,.18); stroke-width:1.5; }
  .rline .prog { stroke:#fff; stroke-width:2; stroke-dasharray:1 1; stroke-dashoffset:1; }
  .rline .tip { stroke:#fff; stroke-width:5; stroke-dasharray:.018 .982; stroke-dashoffset:.018; filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px rgba(255,255,255,.7)); opacity:.9; }
  .rec .rline .prog { animation:prog var(--max,15s) linear forwards; }
  .rec .rline .tip { animation:tip var(--max,15s) linear forwards; }
  @keyframes prog { to { stroke-dashoffset:0; } } @keyframes tip { to { stroke-dashoffset:-.982; } }
  .rec .cam { animation:wob 3.2s ease-in-out infinite; }
  @keyframes wob { 0%,100% { border-radius:24px 26px 23px 25px; transform:scale(.992) } 33% { border-radius:27px 22px 26px 23px; transform:scale(.996,.989) } 66% { border-radius:22px 27px 24px 27px; transform:scale(.989,.995) } }
  .recpill { position:absolute; top:12px; right:12px; z-index:7; height:26px; padding:0 10px; border-radius:13px; display:flex; align-items:center; gap:6px; font:600 12px/1 var(--disp); font-variant-numeric:tabular-nums; opacity:0; transform:scale(.7); transition:opacity .2s, transform .45s var(--spring); pointer-events:none; }
  .recpill i { width:7px; height:7px; border-radius:50%; background:var(--late); animation:rdot 1s ease-in-out infinite; }
  @keyframes rdot { 50% { opacity:.35 } }
  .rec .recpill { opacity:1; transform:none; }

  /* selfie slot placeholder */
  .pip-ph { position:absolute; inset:0; display:none; align-items:center; justify-content:center; color:rgba(255,255,255,.75);
    background:rgba(28,28,30,.55); backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px); border-radius:inherit; box-shadow:inset 0 0 0 1px rgba(255,255,255,.18); overflow:hidden; transition:opacity .35s ease; }
  .pip-ph::after { content:''; position:absolute; inset:0; background:linear-gradient(105deg, transparent 35%, rgba(255,255,255,.14) 50%, transparent 65%); transform:translateX(-100%); animation:shim 2.2s ease-in-out infinite; }
  @keyframes shim { to { transform:translateX(100%); } }
  .nomc .pip-ph { display:flex; } .nomc #camSmall { opacity:0; transition:opacity .35s ease; }
  .nomc.filled #camSmall { opacity:1; } .nomc.filled .pip-ph { opacity:0; }
  .mcchip { position:fixed; left:16px; bottom:16px; z-index:50; font:600 11px/1 var(--disp); padding:8px 11px; border-radius:99px; color:var(--mut); display:none; }
  .mcchip.show { display:block; }

  /* stickers: die-cut */
  .stk-layer { position:absolute; inset:0; z-index:4; pointer-events:none; }
  .stk { --r:0deg; --sk:0deg; --sc:1; position:absolute; pointer-events:auto; touch-action:none; cursor:grab; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
    transform:translate(-50%,-50%) rotate(var(--r)) skewX(var(--sk)) scale(var(--sc)); transform-origin:50% 50%;
    filter:drop-shadow(0 0 0 #fff) drop-shadow(0 6px 10px rgba(0,0,0,.35)); transition:transform .5s var(--spring); will-change:transform; user-select:none; }
  .stk.in { animation:stkIn .7s var(--soft) both; }
  @keyframes stkIn { 0% { transform:translate(-50%,-50%) rotate(var(--r)) scale(.6); opacity:0 } 40% { transform:translate(-50%,-50%) rotate(var(--r)) scale(1.06); opacity:1 }
    58% { transform:translate(-50%,-50%) rotate(calc(var(--r) - 5deg)) scale(.98) } 76% { transform:translate(-50%,-50%) rotate(calc(var(--r) + 3deg)) scale(1.01) } 100% { transform:translate(-50%,-50%) rotate(var(--r)) scale(1) } }
  .stk.drag { cursor:grabbing; transition:none; --sc:1.08; filter:drop-shadow(0 14px 18px rgba(0,0,0,.45)); }
  .stk.drop { animation:jelly .6s var(--soft); }
  @keyframes jelly { 0% { transform:translate(-50%,-50%) rotate(var(--r)) scale(1.08) } 25% { transform:translate(-50%,-50%) rotate(var(--r)) scale(1.12,.88) } 50% { transform:translate(-50%,-50%) rotate(var(--r)) scale(.94,1.06) } 75% { transform:translate(-50%,-50%) rotate(var(--r)) scale(1.02,.98) } 100% { transform:translate(-50%,-50%) rotate(var(--r)) scale(1) } }
  .s-loc { padding:7px 11px 7px 8px; border-radius:13px; background:#fff; color:#111; font:800 14px/1 var(--disp); letter-spacing:-.01em; box-shadow:0 0 0 2.5px #fff; }
  .s-loc svg { width:15px; height:15px; color:var(--late); }
  .s-mus { padding:5px 11px 5px 5px; border-radius:14px; background:#141414; color:#fff; font:600 12px/1.1 var(--disp); box-shadow:0 0 0 2.5px #fff; }
  .s-mus .vin { width:30px; height:30px; border-radius:50%; background:radial-gradient(circle, var(--acc) 0 18%, #111 19% 24%, #2a2a2a 25% 38%, #1a1a1a 39% 52%, #2a2a2a 53% 66%, #111 67%); animation:spin 3s linear infinite; box-shadow:inset 0 0 0 1px rgba(255,255,255,.15); }
  @keyframes spin { to { transform:rotate(1turn); } }
  .s-mus small { display:block; color:var(--mut); font-size:10px; font-weight:600; }
  .eq { display:flex; gap:2px; align-items:flex-end; height:12px; margin-left:2px; }
  .eq i { width:2.5px; height:100%; border-radius:2px; background:var(--acc); transform-origin:bottom; animation:eq .9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay:-.3s; } .eq i:nth-child(3) { animation-delay:-.6s; } .eq i:nth-child(4) { animation-delay:-.15s; }
  @keyframes eq { 0%,100% { transform:scaleY(.3) } 50% { transform:scaleY(1) } }
  .s-tag { padding:4px 12px 6px; border-radius:12px; background:var(--acc); color:#111; font:700 22px/1 var(--hand); box-shadow:0 0 0 2.5px #fff; }
  .mine .stk-layer .stk, .sheet .stk { cursor:default; }
  .mine .stk-layer { transform:scale(.36); transform-origin:0 0; width:278%; height:278%; inset:auto; left:0; top:0; }
  .flabel { position:absolute; left:50%; top:18px; z-index:6; padding:6px 12px; border-radius:11px; background:#fff; color:#111; font:800 15px/1 var(--disp); box-shadow:0 0 0 2.5px #fff, 0 6px 14px rgba(0,0,0,.35); opacity:0; transform:translateX(-50%) rotate(-3deg) scale(.6); pointer-events:none; }
  .flabel.show { animation:flab 1.1s var(--soft) forwards; }
  @keyframes flab { 0% { opacity:0; transform:translateX(-50%) rotate(-3deg) scale(.6) } 22% { opacity:1; transform:translateX(-50%) rotate(-3deg) scale(1.08) } 34% { transform:translateX(-50%) rotate(-3deg) scale(1) } 75% { opacity:1; transform:translateX(-50%) rotate(-3deg) scale(1) } 100% { opacity:0; transform:translateX(-50%) translateY(-6px) rotate(-3deg) scale(.92) } }
  .edit .ph-back, .edit .pip { will-change:transform; }
  .edit.swl .ph-back, .edit.swl .pip { animation:swl .45s var(--spring); } .edit.swr .ph-back, .edit.swr .pip { animation:swr .45s var(--spring); }
  @keyframes swl { 0% { transform:translateX(26px) scale(.95); opacity:.6 } 100% { transform:none; opacity:1 } }
  @keyframes swr { 0% { transform:translateX(-26px) scale(.95); opacity:.6 } 100% { transform:none; opacity:1 } }

  /* context */
  .edit { aspect-ratio:3/4; width:100%; touch-action:pan-y; user-select:none; flex:none; max-height:calc(100% - 210px); align-self:center; }
  .fdots { display:flex; justify-content:center; gap:5px; margin-top:4px; height:6px; }
  .fdots button { width:6px; height:6px; padding:0; border-radius:3px; background:rgba(255,255,255,.28); transition:width .45s var(--spring), background .2s; }
  .fdots button.on { background:#fff; width:18px; }
  .cbub { position:relative; z-index:5; align-self:flex-start; display:block; width:fit-content; max-width:75%; margin:0 0 -10px 16px; transform:translateY(-42%) rotate(-2.5deg);
    padding:8px 13px; border-radius:18px; border-bottom-left-radius:5px; background:#F2F2F7; color:#000; font:500 15px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; text-align:left;
    box-shadow:0 0 0 2.5px #fff, 0 6px 14px rgba(0,0,0,.35); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:visible; overflow-wrap:anywhere; }
  .cbub.in { animation:bubIn .6s var(--soft) both; }
  @keyframes bubIn { 0% { transform:translateY(-42%) rotate(-2.5deg) scale(.6); opacity:0 } 45% { transform:translateY(-42%) rotate(-2.5deg) scale(1.06); opacity:1 } 70% { transform:translateY(-42%) rotate(-5deg) scale(.99) } 100% { transform:translateY(-42%) rotate(-2.5deg) scale(1) } }
  .cbub[hidden] { display:none; }
  .cbub::before { content:''; position:absolute; left:-4px; bottom:0; width:12px; height:12px; background:#F2F2F7; clip-path:path('M12 0 C12 6 8 10 0 12 C5 12 9 11 12 9 Z'); }
  .cbub.sm { margin:8px 0 0 6px; transform:rotate(-2deg); font-size:13px; }
  .post .cbub { margin-left:14px; }
  input.capfield { width:100%; margin-top:10px; padding:12px 14px; border-radius:16px; border:0; outline:none; font:inherit; font-size:15px; color:#fff; caret-color:var(--acc); background:rgba(255,255,255,.08); box-shadow:inset 0 1px 0 rgba(255,255,255,.2); }
  input::placeholder { color:var(--mut); }
  .tray-wrap { position:relative; margin-top:14px; }
  .tray { display:flex; padding:5px; border-radius:24px; gap:2px; }
  .tool { position:relative; z-index:1; flex:1; height:50px; border-radius:19px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font:600 10.5px/1 var(--disp); color:rgba(255,255,255,.75); transition:color .2s, transform .45s var(--spring); }
  
  
  .tool.sel { color:#fff; } 
  .tool.has::after { content:''; position:absolute; top:7px; right:calc(50% - 15px); width:6px; height:6px; border-radius:50%; background:var(--acc); }
  .blob { position:absolute; z-index:0; top:5px; left:5px; height:50px; border-radius:19px; background:rgba(255,255,255,.14); box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 0 12px rgba(255,255,255,.06); opacity:0;
    transition:transform .55s var(--spring), width .55s var(--spring), opacity .25s; }
  .blob.on { opacity:1; } .blob.stretch { animation:stretch .55s var(--soft); }
  @keyframes stretch { 0% { scale:1 } 35% { scale:1.18 .82 } 65% { scale:.95 1.06 } 100% { scale:1 } }
  .sheet { display:grid; grid-template-rows:0fr; transition:grid-template-rows .45s var(--spring), margin .45s var(--spring), opacity .25s; opacity:0; margin-top:0; }
  .sheet.open { grid-template-rows:1fr; opacity:1; margin-top:10px; }
  .sheet > div { overflow:hidden; }
  .sugg { display:flex; gap:12px; align-items:center; padding:8px 4px 10px; overflow-x:auto; scrollbar-width:none; }
  .sugg::-webkit-scrollbar { display:none; }
  .sugg > button { flex:none; position:relative; }
  .sugg .stk { position:relative; transform:rotate(var(--r)); left:auto; top:auto; animation:stkIn2 .5s var(--spring) both; }
  .sugg > button:nth-child(2) .stk { animation-delay:.05s } .sugg > button:nth-child(3) .stk { animation-delay:.1s } .sugg > button:nth-child(4) .stk { animation-delay:.15s }
  @keyframes stkIn2 { from { transform:rotate(var(--r)) scale(.5); opacity:0 } }
  .sugg > button:active .stk { transform:rotate(var(--r)) scale(.9); }
  .x { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:14px; color:var(--mut); }
  .sheet-in { flex:none; width:128px; height:34px; padding:0 12px; border-radius:17px; border:0; outline:none; color:#fff; font:inherit; font-size:13px; caret-color:var(--acc); background:rgba(255,255,255,.08); box-shadow:inset 0 1px 0 rgba(255,255,255,.18); }
  .next-row { display:flex; gap:10px; margin-top:auto; padding-top:14px; align-items:center; }
  .circ-btn { flex:1; height:54px; border-radius:27px; display:flex; align-items:center; gap:10px; padding:0 16px 0 8px; font:600 15px/1 var(--disp); text-align:left; transition:transform .45s var(--spring); }
  .circ-btn:active { transform:scale(.97); }
  .circ-btn .em { width:38px; height:38px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.1); font-size:18px; }
  .circ-btn .chev { margin-left:auto; color:var(--mut); }
  .go-btn { width:54px; height:54px; border-radius:50%; background:#fff; color:#000; display:grid; place-items:center; transition:transform .45s var(--spring); box-shadow:0 8px 24px rgba(255,255,255,.12); }
  .go-btn:active { transform:scale(.88); } .go-btn svg { width:22px; height:22px; }

  /* audience */
  h2 { align-self:flex-start; font:800 30px/1 var(--disp); letter-spacing:-.03em; margin:6px 0 2px; }
  .note { font-size:12.5px; color:var(--mut); margin:2px 0 12px; }
  .opts { display:flex; flex-direction:column; gap:6px; }
  .opt { position:relative; display:flex; align-items:center; gap:14px; padding:10px 12px 10px 10px; border-radius:22px; text-align:left; background:rgba(255,255,255,.05); box-shadow:inset 0 0 0 1px transparent; transition:background .25s, box-shadow .25s, transform .45s var(--spring); }
  .opt:active { transform:scale(.98); }
  .opt.on { background:rgba(255,255,255,.1); box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55), inset 0 1px 0 rgba(255,255,255,.3); }
  .clu { position:relative; width:64px; height:44px; flex:none; }
  .clu .av { position:absolute; top:4px; width:34px; height:34px; border-radius:50%; border:2px solid #000; font:700 10px/1 var(--disp); display:grid; place-items:center; color:#fff; transition:transform .5s var(--spring); }
  .clu .av:nth-child(1) { left:0; transform:rotate(-6deg); } .clu .av:nth-child(2) { left:15px; z-index:1; } .clu .av:nth-child(3) { left:30px; z-index:2; transform:rotate(6deg); }
  .opt.on .clu .av:nth-child(1) { transform:translateX(-3px) rotate(-10deg); } .opt.on .clu .av:nth-child(3) { transform:translateX(3px) rotate(10deg); }
  .clu .emo { position:absolute; right:-4px; bottom:-2px; z-index:3; width:24px; height:24px; border-radius:50%; background:#fff; display:grid; place-items:center; font-size:13px; box-shadow:0 2px 6px rgba(0,0,0,.4); transform:rotate(8deg); }
  .clu .av.img { color:transparent; } .clu .ghost { background:rgba(255,255,255,.08); border:1.5px dashed rgba(255,255,255,.3); }
  .opt .nm { font:600 16px/1.15 var(--disp); letter-spacing:-.01em; }
  .opt .nm small { display:block; font:500 12px/1.3 -apple-system,system-ui,sans-serif; color:var(--mut); margin-top:2px; }
  .opt .edit-l { margin-left:auto; font-size:12px; color:var(--mut); padding:6px 8px; }
  .chk { width:26px; height:26px; border-radius:50%; flex:none; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3); display:grid; place-items:center; color:#111; margin-left:auto; }
  .opt .edit-l + .chk { margin-left:0; }
  .chk svg { width:14px; height:14px; opacity:0; overflow:visible; }
  .opt.on .chk { background:var(--acc); box-shadow:none; animation:chk .55s var(--spring); } .opt.on .chk svg { opacity:1; }
  @keyframes chk { 0% { transform:scale(.4) } 60% { transform:scale(1.18) } 100% { transform:scale(1) } }
  .newc { margin-top:8px; display:flex; align-items:center; gap:10px; padding:10px; border-radius:22px; color:var(--mut); font:600 14px/1 var(--disp); transition:transform .45s var(--spring); }
  .newc:active { transform:scale(.97); }
  .newc > span { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; border:1.5px dashed rgba(255,255,255,.3); color:#fff; }
  .cname { width:100%; margin:10px 0 2px; padding:12px 14px; border-radius:16px; background:rgba(255,255,255,.08); border:0; outline:none; color:#fff; font:inherit; caret-color:var(--acc); }

  @keyframes fxPop { 0% { transform:scale(.85) } 55% { transform:scale(1.15) } 100% { transform:none } }

  @keyframes fxBlink { 50% { transform:scaleY(.1) } }
  @keyframes fxNudge { 50% { transform:translateX(4px) } } @keyframes fxNudgeL { 50% { transform:translateX(-4px) } }
  .ico .ic { --is:20px; } .timer .ic { --is:15px; } .tool .ic { --is:22px; } .circ-btn .em .ic { --is:20px; } .chev .ic { --is:16px; }

  .x .ic { --is:14px; }
  .tab { display:flex; flex-direction:column; align-items:center; color:var(--mut); padding:2px 6px; } .tab.on { color:#fff; } .tab .ic { --is:24px; } .tabs .ic, .newc .ic { display:inline-grid; border:0; width:var(--is); height:var(--is); }

  }

  // context
  let openTool = null;
  function blobMove() {

  function closeSheet() { openTool = null; $('#sheet').classList.remove('open'); $$('.tool').forEach(t => t.classList.remove('sel')); blobMove(); }
  function renderCtx() {

    const cf = $('#capField'); const editingCap = document.activeElement === cf; if (!editingCap) cf.value = state.ctx.caption || '';
    const bub = $('#capBub'); const showB = !!state.ctx.caption && !editingCap; const was = !bub.hidden && bub.textContent === (state.ctx.caption || '');

  function openCaption() { const cf = $('#capField'); cf.style.display = ''; $('#capBub').hidden = true; cf.focus(); }
  $$('[data-tool]').forEach(t => t.onclick = () => {
    const k = t.dataset.tool;
    if (openTool === k) { closeSheet(); return; }
    openTool = k; $$('.tool').forEach(x => x.classList.toggle('sel', x === t)); blobMove();
    if (k === 'caption') { $('#sheet').classList.remove('open'); openCaption(); return; }
    const search = (k === 'tag' || k === 'music') ? `<label class="srch">${IC('magnifying-glass','pop')}<input class="sheet-in" type="text" inputmode="none" autocomplete="off" data-k="${k}" placeholder="${k === 'tag' ? 'Search friends' : 'Search a song'}"></label>` : '';
    const rots = [-3, 2, -2, 3];
    $('#sugg').innerHTML = search + SUGGEST[k].map((v, i) => v === 'Hide location' ? `<button class="x glass" data-k="${k}" data-v="" aria-label="Hide location">${IC('x','spin')}</button>` : `<button data-k="${k}" data-v="${v}"><span class="stk ${CLS[k]}" style="--r:${rots[i % 4]}deg">${stkHTML(k, v)}</span></button>`).join('') + (state.ctx[k] && k !== 'location' ? `<button class="x glass" data-k="${k}" data-v="" aria-label="Remove">${IC('x','spin')}</button>` : '');
    $('#sheet').classList.add('open');
    $$('#sugg button').forEach(b => b.onclick = () => { const v = b.dataset.v; if (!v) delete state.ctx[k]; else state.ctx[k] = v; renderCtx(); moFx('squish', 600); });
    const si = $('#sugg .sheet-in'); if (si) si.addEventListener('keydown', e => { if (e.key === 'Enter' && si.value.trim()) { state.ctx[k] = (k === 'tag' ? '@' : '♪ ') + si.value.trim().replace(/^[@♪ ]+/, ''); renderCtx(); } });
  });
  $('#capField').addEventListener('blur', () => setTimeout(() => { renderCtx(); if (openTool === 'caption') closeSheet(); }, 0));
  $('#capBub').onclick = openCaption;
  $('#capField').addEventListener('input', e => { const v = e.target.value.trim(); if (v) state.ctx.caption = v; else delete state.ctx.caption; renderCtx(); });

  // audience
  const CIRCLES = [
    { id:'all', em:'globe-hemisphere-west', name:'All friends', sub:'42 friends' },
    { id:'close', em:'sparkle', name:'Close friends', members:['LM','JD','SA','TB','NK','EO'] },
    { id:'family', em:'house', name:'Family', members:['EO','RC','MP','NK'] },
    { id:'room', em:'couch', name:'Roommates', members:['JD','TB','SA'] },
  ];
  let editing = null;
  const avHTML = n => { const f = FMAP[n]; return f[2] ? `<span class="av img" style="background-image:url(img/av-${f[2]}.webp)">${n}</span>` : `<span class="av" style="background:${f[1]}">${n}</span>`; };
  $('#friends').innerHTML = FRIENDS.map(([n, c, img]) => `<button class="fr" data-f="${n}"><span class="av${img ? ' img' : ''}" style="background:${img ? `#222 url(img/av-${img}.webp) center/cover` : c}">${n}</span>${img || n.toLowerCase()}</button>`).join('');
  const cur = () => CIRCLES.find(c => c.id === state.aud);
  const CHK = '<span class="chk"><svg viewBox="0 0 24 24"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  function cluster(c) {
    const ms = c.id === 'all' ? ['JD', 'SA', 'TB'] : c.members.slice(0, 3);
    const avs = ms.map(avHTML).join('') + Array.from({ length: Math.max(0, 3 - ms.length) }, () => '<span class="av ghost"></span>').join('');
    return `<span class="clu">${avs}<span class="emo">${IC(c.em)}</span></span>`;
  }
  function renderOpts() {
    $('#opts').innerHTML = CIRCLES.filter(c => c.id === 'all' || c.members.length || c.id === editing).map(c => `<button class="opt${c.id === state.aud ? ' on' : ''}" data-aud="${c.id}">${cluster(c)}<span class="nm">${c.name}<small>${c.sub || (c.members.length + ' people')}</small></span>${c.id !== 'all' ? `<span class="edit-l" data-edit="${c.id}" role="button" aria-label="Edit ${c.name}">${IC('pencil-simple','scrib')}</span>` : ''}${CHK}</button>`).join('');
    $$('.opt').forEach(o => o.onclick = ev => {
      const ed = ev.target.dataset.edit; state.aud = o.dataset.aud;

  const sendLbl = t => { $('#postBtn .lbl').textContent = t; };
  function syncAud() {

    $('#friends').style.display = show ? '' : 'none';
    const cn = $('#cName'); const isNew = show && /^new/.test(c.id); cn.style.display = isNew ? '' : 'none'; if (isNew && document.activeElement !== cn) cn.value = c.name === 'New circle' ? '' : c.name;
    $$('.fr').forEach(f => f.classList.toggle('on', show && c.members.includes(f.dataset.f)));

    const n = c.members ? c.members.length : 0;
    sendLbl(c.id === 'all' ? 'Send to all friends' : n ? `Send to ${c.name}` : 'Add people first');
    $('#postBtn').disabled = c.id !== 'all' && !n;
    $('#audChip').textContent = c.name; $('#audEm').innerHTML = IC(c.em);
    SUGGEST.tag = c.members && c.members.length ? c.members.slice(0, 3).map(m => '@' + (FMAP[m][2] ? FMAP[m][2] + '.' + m[1].toLowerCase() : m.toLowerCase())) : ['@julie.d', '@sam.a', '@tom.b'];
    SUGGEST.location = c.id === 'all' ? LOC_ALL : LOC_CIRCLE;
  }
  $$('.fr').forEach(f => f.onclick = () => { const c = cur(); if (!c.members) return; const k = f.dataset.f; const i = c.members.indexOf(k); i < 0 ? c.members.push(k) : c.members.splice(i, 1); syncAud(); });
  $('#cName').addEventListener('input', e => { const c = cur(); c.name = e.target.value.trim() || 'New circle'; const sel = $(`.opt[data-aud="${c.id}"] .nm`); if (sel) sel.firstChild.textContent = c.name; if (c.members.length) sendLbl(`Send to ${c.name}`); });
  $('#newC').onclick = () => { const id = 'new' + CIRCLES.length; CIRCLES.push({ id, em:'users-three', name:'New circle', members:[] }); state.aud = id; editing = id; syncAud(); };

  function audLabel() { const c = cur(); return c.id === 'all' ? 'all friends' : c.name; }
  function syncFeed() {
    const c = cur(); $('#mineAud').innerHTML = (c.id === 'all' ? '' : '<i class="ring-dot"></i>') + IC(c.em) + c.name;
    const bits = ['On time · just now'];
    if (state.flt) bits.push(FILTERS[state.flt][1]);
    $('#mineMeta').textContent = bits.join(' · ');
    renderStickers($('#mineStk'), false);
    const mb = $('#mineBub'); mb.hidden = !state.ctx.caption; mb.textContent = state.ctx.caption || '';
  }
  $('#seenBtn').onclick = () => { const b = $('#seenBtn'); const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); b.lastChild.textContent = on ? 'Seen by 6 · only you see this' : 'Show who saw it'; };
  function segMove() { const b = $('#fchips button.on'); const i = $('#segInd'); if (!b || !b.offsetWidth) return; i.style.width = b.offsetWidth + 'px'; i.style.transform = `translateX(${b.offsetLeft}px)`; }
  $$('#fchips button').forEach(b => b.onclick = () => {
    $$('#fchips button').forEach(x => x.classList.toggle('on', x === b)); segMove();
    const f = b.dataset.f; $$('.post').forEach(p => p.style.display = (f === 'all' || p.dataset.kind === f) ? '' : 'none');
    let em = $('.fof-empty'); if (f === 'fof' && !em) { em = document.createElement('div'); em.className = 'fof-empty'; em.textContent = 'Friends of friends posts appear here.'; $('.feed').appendChild(em); } if (em) em.hidden = f !== 'fof';
  });

  $$('[data-go]').forEach(b => b.addEventListener('click', () => go(+b.dataset.go)));
  $('#postBtn').addEventListener('click', () => {
    const b = $('#postBtn'); if (b.disabled) return;

  });

  // simulated iOS keyboard
  const KB = { a:['qwertyuiop','asdfghjkl','zxcvbnm'], n:['1234567890','-/:;()$&@"',".,?!'"] };
  let kbField = null, kbShift = false, kbNum = false;
  function kbRender() {
    const L = kbNum ? KB.n : KB.a; const t = s => kbShift && !kbNum ? s.toUpperCase() : s;
    const row = s => [...s].map(c => `<span class="k" data-c="${c}">${t(c)}</span>`).join('');
    $('#kb').innerHTML = `<div class="r">${row(L[0])}</div><div class="r">${row(L[1])}</div>
      <div class="r"><span class="k f w${kbShift ? ' on' : ''}" data-a="shift">${kbNum ? '#+=' : '⇧'}</span>${row(L[2])}<span class="k f w" data-a="del">⌫</span></div>
      <div class="r"><span class="k f w" data-a="num">${kbNum ? 'ABC' : '123'}</span><span class="k f w" data-a="emoji">☺︎</span><span class="k sp" data-c=" ">space</span><span class="k ret" data-a="ret">${kbField && kbField.classList.contains('sheet-in') ? 'search' : 'return'}</span></div>
      <div class="ft"><span>🌐︎</span><span>🎙︎</span></div>`;
  }
  function kbShow(f) {
    kbField = f; kbRender(); $('#kb').classList.add('on'); $('#app').scrollTop = 0;
    const scr = f.closest('.scr'); scr.style.transform = 'none';
    requestAnimationFrame(() => { const kh = $('#kb').offsetHeight, ah = $('#app').clientHeight, fb = f.getBoundingClientRect().bottom - $('#app').getBoundingClientRect().top; const shift = Math.max(0, fb - (ah - kh) + 12); scr.style.transform = shift ? `translateY(-${shift}px)` : ''; mo.classList.toggle('hide', !!shift); });
  }
  function kbHide() { if (!kbField) return; const scr = kbField.closest('.scr'); kbField.blur(); kbField = null; $('#kb').classList.remove('on'); if (scr) scr.style.transform = ''; $('#app').scrollTop = 0; requestAnimationFrame(() => moAt(state.step)); }
  function kbInsert(s) {
    const f = kbField; if (!f) return; const a = f.selectionStart ?? f.value.length, b = f.selectionEnd ?? a;
    if (s === null) { if (a === b && a > 0) f.setRangeText('', a - 1, a, 'end'); else f.setRangeText('', a, b, 'end'); }
    else { if (f.maxLength > 0 && f.value.length >= f.maxLength) return; f.setRangeText(s, a, b, 'end'); }
    f.dispatchEvent(new Event('input', { bubbles: true }));
    if (!f.value && !kbShift && !kbNum) { kbShift = true; kbRender(); }
  }
  $('#kb').addEventListener('pointerdown', e => {
    e.preventDefault(); const k = e.target.closest('.k'); if (!k) return;
    if (k.dataset.c != null) { kbInsert(kbShift && !kbNum ? k.dataset.c.toUpperCase() : k.dataset.c); if (kbShift) { kbShift = false; kbRender(); } return; }
    const a = k.dataset.a;
    if (a === 'shift') { kbShift = !kbShift; kbRender(); } else if (a === 'num') { kbNum = !kbNum; kbShift = false; kbRender(); }
    else if (a === 'del') kbInsert(null); else if (a === 'emoji') kbInsert('😀');

  });
  document.addEventListener('focusin', e => { const f = e.target; if (f.matches && f.matches('#app input[type="text"]')) { kbShift = !f.value; kbNum = false; kbShow(f); } });
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && kbField && e.isTrusted) kbHide(); });
  document.addEventListener('pointerdown', e => { if (kbField && !e.composedPath().includes($('#kb')) && e.target !== kbField) kbHide(); });

  // embed API
  window.addEventListener('message', e => { const d = e.data; if (!d) return; if (d.bereal === 'filter') setFlt(+d.i || 0); if (d.bereal === 'go') go(typeof d.step === 'number' ? d.step : STEPS.indexOf(d.step), true); if (d.bereal === 'setMulticam') setMC(!!d.on); });
  window.__bereal = { setFlt, go, state, renderCtx };
  const q = new URLSearchParams(location.search).get('step');
  const start = q == null ? 0 : (isNaN(+q) ? STEPS.indexOf(q) : +q);
  syncAud(); renderCtx();
  if (start >= 1) { state.ctx = { caption: 'sunday reset ☀️', location: 'Paris 11e', music: '♪ Now playing' }; renderCtx(); }
  go(start < 0 ? 0 : start, true);
  document.fonts && document.fonts.ready.then(() => moAt(state.step));
})();
