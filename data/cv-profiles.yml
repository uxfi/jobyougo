        status: "+1000 users"
      - name: "Flemme OS"
        desc: "Social outbound automation"
        status: "MVP"
      - name: "UXfi.ai"
        desc: "AI UX audit platform"
        status: "MVP"
      - name: "Panfy"
        desc: "Crypto analytics + AI signals"
        status: "MVP"
      - name: "Career-Ops"
        desc: "AI job search pipeline"
        status: "MVP"
      - name: "Jarvos"
        desc: "AI Agent OS (side project)"
        status: "In progress"
      - name: "Ancient World"
        desc: "UE5 MMORPG + Supabase backend (side project)"
        status: "In progress"
