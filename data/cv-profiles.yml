        - name: "Vercel"
        - name: "n8n"
        - name: "JavaScript"
        - name: "Cloud Run"
        - name: "Cursor"
  transformation:
    title: "AI Product Building Scope"
    subtitle: "Self-taught. 5 live products shipped end to end."
    description: "Builds production-ready MVPs with Vercel, Supabase, PostgreSQL, n8n, Cloud Run, and LLM APIs. Designs LLM workflows, structured outputs, scoring systems, and automation pipelines, then works with engineers on architecture and implementation when products scale."
