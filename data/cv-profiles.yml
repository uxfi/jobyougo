ai_builder:
  use_profile_config: false
  headline: "Senior AI Product Builder & Product Designer"
  portrait: "hugo_vermot.png"
  summary: |
    Senior Product Designer turned AI Product Builder, with 12 years in digital products for enterprise, SaaS, and startup environments. Since 2024, building AI-powered products end to end: UX, product architecture, LLM workflows, automation, backend tooling, and launch.

    I focus on turning ambiguous AI ideas into usable products: mapping the user problem, designing the workflow, prototyping the interface, connecting LLM and data pipelines, then shipping a working MVP. Looking for a senior role where I can bring product design, AI building, and shipping experience to a focused team.
  stats:
    - value: "12y"
      label: "experience"
      sub: "designer"
    - value: "5"
