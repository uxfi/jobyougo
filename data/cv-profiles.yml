# CV variants for Hugo Vermot. Facts: cv.md, article-digest.md, config/profile.yml.
ai_builder:
  use_profile_config: false
  headline: AI Product Builder | Senior Product Designer
  portrait: hugo_vermot.png
  summary: >-
    AI Product Builder with a senior product design background across enterprise and SaaS. I have worked with
    AI for 4 years, building bootstrapped products: UXfi, Flemme OS and Creads.io, which has 1,200 registered
    users. My work covers the user flow, structured inputs, LLM workflow and deployment.


    At OneAsset I shipped the full product in 6 months with one Product Owner (investor app, admin, marketing
    site, plus OTC). Prototypes are built in Cursor and Claude Code, reviewed in Figmol, and handed to
    engineering on GitHub. I am looking for an AI product building role with responsibility for user
    experience and delivery.


    Currently employed at OneAsset; seeking a new full-time role. Start date to be agreed.
  stats:
    - value: '12'
      label: years
      sub: product design
    - value: 1,200
      label: users
      sub: Creads.io
    - value: 15+
      label: maisons
      sub: LVMH platform
  availability_tags:
    - label: Seeking full-time
      bg: '#f0fdf4'
      color: '#166534'
      border: '#bbf7d0'
    - label: Full remote
      bg: '#eff6ff'
      color: '#1d4ed8'
      border: '#bfdbfe'
  target_roles:
    - AI Product Builder
    - LLM Product Builder
    - Founding Product Designer
    - AI Product Designer
  skill_sections:
    - title: AI & LLM Systems
      items:
        - name: LLM workflows
        - name: Agentic pipelines
        - name: RAG
        - name: Structured outputs
        - name: Scoring systems
        - name: Scraping pipelines
        - name: Claude/OpenAI APIs
    - title: Product & Design
      items:
        - name: UX research
        - name: Information architecture
        - name: AI UX patterns
        - name: Prototyping
        - name: Design systems
        - name: Complex B2B flows
    - title: Build Stack
      items:
        - name: Supabase
        - name: PostgreSQL
        - name: Vercel
        - name: n8n
        - name: JavaScript
        - name: Cloud Run
        - name: Cursor
  transformation:
    title: AI Product Building Scope
    subtitle: Self-taught. Bootstrapped products from UX through deployment.
    description: >-
      Builds production-ready MVPs with Vercel, Supabase, PostgreSQL, n8n, Cloud Run, and LLM APIs. Designs
      LLM workflows, structured outputs, scoring systems, and automation pipelines, then works with engineers
      on architecture and implementation when products scale.
    skills:
      - UX
      - Frontend
      - Backend tooling
      - LLM pipelines
      - Automation
      - Launch
    products:
      - name: Creads.io
        desc: AI ad generation SaaS
        status: 1,200 registered users
      - name: Flemme OS
        desc: Social outbound automation
        status: MVP
      - name: UXfi.ai
        desc: AI UX audit platform
        status: MVP
      - name: Panfy
        desc: Crypto analytics + AI signals
        status: MVP
      - name: Jarvos
        desc: AI Agent OS (agent-flow proof)
        status: In progress
      - name: Ancient World
        desc: UE5 MMORPG + Supabase backend (side project)
        status: In progress
  highlights_title: Proof Points
  highlights:
    - 'OneAsset: in 6 months, full product with one PO (investor app, admin, marketing) plus OTC; Git hand-off. Figmol is OneAsset's internal tool.'
    - 'Creads.io: founded and built an AI advertising SaaS with 1,200 registered users.'
    - 'LVMH: stakeholder interviews and shared data-marketing workflows across 15+ maisons.'
  projects_title: Selected work
  projects:
    - name: OneAsset
      logo: oneasset-logo.png
      screenshot: oneasset-cover.png
      desc: 'Full product in 6 months with one PO: investor app, admin, marketing, plus OTC'
      tag: Product Lead
      bullets:
        - >-
          In the first 6 months, shipped the full product with one Product Owner: investor app, admin panel,
          and marketing site, plus an OTC product. Prototypes built in Cursor and Claude Code, reviewed in
          GitHub flow with engineering. Figmol is OneAsset's internal review tool, not a peer of GitHub or Cursor.
        - Design, product strategy and prototype ownership; GitHub collaboration with engineering.
    - name: Creads.io
      logo: creads_logo_final.png
      screenshot: screenshot_creads.png
      url: https://creads.io
      desc: AI advertising SaaS, from brand context to checked creative outputs
      tag: 1,200 registered users
      bullets:
        - Founded and built the product, from user flows through AI orchestration and deployment.
        - Brand memory, structured briefs and a second prompt checking output compliance.
        - >-
          1,200 registered users, 20 paying clients and 5,000 monthly visits (September 2026). Zero paid
          acquisition.
    - name: LVMH Group
      logo: lvmh.png
      screenshot: lvmh-screenshot.png
      desc: 'Data marketing platform: customer data and campaign performance across 15+ maisons'
      tag: Enterprise UX
      bullets:
        - Designed a data marketing platform unifying customer data and campaign performance across 15+ maisons.
        - Interviewed stakeholders across Dior, Louis Vuitton, Fendi, Kenzo and other maisons; built monitoring tools.
    - name: Renault Group
      logo: renault.png
      screenshot: renault-screens.png
      desc: Renew international marketplace and multi-country design system
      tag: Design systems
      bullets:
        - Sole design lead across the front and back office, with cross-team stakeholder workshops.
        - Recorded 20% reduction in development time through the shared design system.
    - name: Société Générale
      logo: societegenerale.png
      screenshot: societe-generale-desktop.png
      desc: Savings and investment journeys under MIF2 requirements
      tag: Fintech UX
      bullets:
        - Designed investor-profile validation, savings and allocation journeys on desktop and mobile.
        - Recorded +12% investment activity following work on these flows.
  experience_note: Freelance and founder activity ran in parallel with selected long-term client missions.
  experience:
    - company: OneAsset
      role: Senior Product Designer / Product Lead
      period: Feb 2026 – Present
      bullets:
        - >-
          In the first 6 months, shipped the full product with one Product Owner: investor app, admin panel,
          and marketing site, plus an OTC product. Prototypes built in Cursor and Claude Code, reviewed in
          GitHub flow with engineering. Figmol is OneAsset's internal review tool, not a peer of GitHub or Cursor.
        - >-
          Product strategy, investor UX, KYB compliance onboarding, and PM workspace architecture for a
          regulated RWA investment platform (commercial real estate, daily USDC yield, Base / ERC-3643).
        - >-
          Trust-first institutional design system: homepage with regulatory trust bar, asset marketplace,
          fractional purchase selector, and asset-class-dependent reporting flows.
    - company: Independent AI Product Builder
      url: https://creads.io
      logo: creads_logo_final.png
      role: Founder / AI Product Builder
      period: 2022 – Present
      bullets:
        - >-
          Shipped AI-native products solo across UX auditing (UXfi), growth automation (Flemme OS), creative
          generation (Creads.io), and crypto analytics (Panfy).
        - >-
          Own UX, product architecture, prompt systems, LLM workflows, scoring logic, backend tooling,
          analytics, and launch.
    - company: UpViral
      url: https://upviral.com
      logo: upviral.png
      role: Product Designer / Product Manager
      period: Jul 2024 – Dec 2025
      bullets:
        - >-
          Rebuilt core SaaS foundations: information architecture, campaign-builder flows, UI hierarchy, and
          customer interviews.
        - Partner with the CPO on roadmap decisions, implementation priorities, and product quality.
    - company: Agence V0
      url: https://v0.agency
      logo: logo-HV.jpg
      role: Founder & Head of Product Design
      period: Oct 2020 – Jan 2024
      bullets:
        - >-
          Built and ran a product design agency; managed up to 7 junior freelance designers and generated
          around €400K revenue.
        - >-
          Delivered 20+ projects for Renault, BMW, Shiseido, Société Générale, Edenred, GALIAN-SMABTP, and
          other accounts.
    - company: Société Générale
      logo: societegenerale.png
      role: Senior Product Designer
      period: Feb 2023 – Oct 2024
      bullets:
        - >-
          Designed savings, allocation, MIF2 validation, and investor-profile journeys across desktop and
          mobile.
        - Contributed to +12% investment activity.
    - company: LVMH / BMW / Renault / Shiseido
      role: Senior Product Designer
      period: 2020 – 2024
      bullets:
        - >-
          Designed complex enterprise, retail, mobility, loyalty, and data-marketing products for major
          brands.
        - >-
          Results include +20% loyalty enrollment, +12% engagement, and -20% development time through
          design-system adoption.
