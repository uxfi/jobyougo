  highlights:
    - "Creads.io: bootstrapped AI creative SaaS with Brand Agents, 4,000+ templates, creative matching, +1000 users, 20 paying clients, and 5,000 monthly visits with zero paid acquisition."
    - "End-to-end delivery: designs user flows, prototypes interfaces, architects LLM and automation pipelines, ships with Supabase, Vercel, PostgreSQL, n8n, and Cloud Run."
    - "Enterprise credibility before the AI pivot: product work for LVMH, Renault, BMW, Société Générale, Shiseido, Edenred, SNCF, and Publicis."
  projects_title: "AI Products"
  projects:
