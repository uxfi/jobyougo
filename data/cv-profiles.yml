    - label: "Full remote"
      bg: "#eff6ff"
      color: "#2563eb"
      border: "#bfdbfe"
    - label: "Salaried & freelance"
      bg: "#faf5ff"
      color: "#7c3aed"
      border: "#e9d5ff"
  target_roles:
    - "AI Product Builder"
    - "LLM Product Builder"
    - "Founding Product Designer"
    - "AI Product Designer"
  skill_sections:
    - title: "AI & LLM Systems"
      items:
        - name: "LLM workflows"
        - name: "Agentic pipelines"
        - name: "RAG"
        - name: "Structured outputs"
        - name: "Scoring systems"
